        buffer.put(PAD0, 8);

const DB_NAME = 'r-preloved-db';
const DB_VERSION = 2;
const STORES = ['products','sales','expenses','settings','stocktakes','syncQueue'];

let dbPromise = null;
function getDB(){
  if(dbPromise) return dbPromise;
  dbPromise = new Promise((resolve,reject)=>{
    if(!window.indexedDB){ reject(new Error('IndexedDB tidak didukung browser ini')); return; }
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      STORES.forEach(s => {
        if(!db.objectStoreNames.contains(s)) db.createObjectStore(s,{keyPath:'id',autoIncrement:true});
      });
    };
    req.onblocked = () => console.warn('R-Preloved: IndexedDB blocked (kemungkinan ada tab lain terbuka).');
    req.onsuccess = () => {
      const db = req.result;
      db.onversionchange = () => { db.close(); dbPromise = null; };
      db.onclose = () => { dbPromise = null; };
      resolve(db);
    };
    req.onerror = () => reject(req.error || new Error('IndexedDB unavailable'));
  });
  dbPromise.catch(()=>{ dbPromise = null; });
  return dbPromise;
}

const memStore = {products:[],sales:[],expenses:[],stocktakes:[],settings:[]};
async function idbOp(fn){
  const db = await getDB();
  return await fn(db);
}
async function dbAll(store){
  try{
    const rows = await idbOp(db=>new Promise((resolve,reject)=>{
      const tx=db.transaction(store,'readonly'), req=tx.objectStore(store).getAll();
      req.onsuccess=()=>resolve(req.result||[]);
      req.onerror=()=>reject(req.error);
    }));
    idbSupported = true;
    return rows;
  }catch(err){
    console.warn('R-Preloved: gagal membaca dari IndexedDB, memakai penyimpanan sementara.', err);
    idbSupported = false;
    return memStore[store]||(memStore[store]=[]);
  }

  try{
    await idbOp(db=>new Promise((resolve,reject)=>{
      const tx=db.transaction(store,'readwrite'), req=tx.objectStore(store).put(record);
      req.onsuccess=()=>resolve(req.result); req.onerror=()=>reject(req.error);
    }));
    idbSupported = true;
    enqueueSync(store,'upsert',record.id);

    console.warn('R-Preloved: gagal menyimpan ke IndexedDB, memakai penyimpanan sementara.', err);

    const list=memStore[store]||[];
    return list.find(r=>String(r.id)===asStr);

}
// Tulis banyak record + hapus banyak id dalam SATU transaksi (jauh lebih cepat daripada 1 transaksi per record).
async function dbApplyBatch(store,puts,delIds){
  if(!puts.length && !delIds.length) return;
  await idbOp(db=>new Promise((resolve,reject)=>{
    const tx=db.transaction(store,'readwrite'), os=tx.objectStore(store);
    puts.forEach(r=>os.put(r));
    delIds.forEach(id=>os.delete(id));
    tx.oncomplete=()=>resolve();
    tx.onerror=()=>reject(tx.error);
    tx.onabort=()=>reject(tx.error||new Error('Transaksi IndexedDB dibatalkan'));
  }));
}
async function dbPutRaw(store,value){
  const record={...value,id:value.id||uid()};
  await idbOp(db=>new Promise((resolve,reject)=>{
    const tx=db.transaction(store,'readwrite'), req=tx.objectStore(store).put(record);
    req.onsuccess=()=>resolve(record.id); req.onerror=()=>reject(req.error);
  }));
  return record.id;
}
async function dbDeleteRaw(store,id){
  await idbOp(db=>new Promise((resolve,reject)=>{
    const tx=db.transaction(store,'readwrite'), req=tx.objectStore(store).delete(id);
    req.onsuccess=()=>resolve(); req.onerror=()=>reject(req.error);
  }));
}
async function refreshPendingCount(){

let syncSeq = 0; // nomor urut per sesi: menjaga urutan operasi yang terjadi di milidetik yang sama
function syncQueueCompare(a,b){
  return (Number(a.ts)||0)-(Number(b.ts)||0)
      || (Number(a.seq)||0)-(Number(b.seq)||0)
      || String(a.id).localeCompare(String(b.id));
}
function enqueueSync(store,action,recordId){
  if(!SYNCABLE_STORES.includes(store)) return;
  dbPutRaw('syncQueue',{store,action,recordId,ts:Date.now(),seq:++syncSeq})
    .then(refreshPendingCount)
    .then(()=>flushSyncQueue())
    .catch(err=>{ console.warn('R-Preloved: gagal mencatat antrian sync.',err); syncState={...syncState,lastError:String(err.message||err)}; emitSyncState(); });
}

// MOV/QuickTime (rekaman iPhone) tidak bisa diputar di Chrome/Android: minta Cloudinary mengirim versi .mp4
const videoUrl = u => String(u||'').replace(/\.(mov|qt)(\?.*)?$/i,'.mp4$2');
const isVideoSrc = u => { u=String(u||''); return /^data:video\//i.test(u) || /\.(mp4|webm|mov|qt)(\?|#|$)/i.test(u) || /\/video\/upload\//i.test(u); };
const firstImage = list => (list||[]).find(u=>u && !isVideoSrc(u)) || null;
// --- Multi akun Cloudinary: pakai akun utama dulu; bila penuh/dibatasi, pindah otomatis ke cadangan ---
const CLOUD_COOLDOWN_MS = 12*60*60*1000; // akun yang gagal karena kuota dilewati dulu 12 jam
function cloudAccounts(){
  const list=[{cloudName:syncSettings.cloudName, uploadPreset:syncSettings.uploadPreset}, ...(syncSettings.extraAccounts||[]), ...(DEFAULT_SYNC.extraAccounts||[])];
  const seen=new Set();
  return list.filter(a=>a && a.cloudName && a.uploadPreset && !seen.has(a.cloudName) && seen.add(a.cloudName));
}
function cloudDownMap(){ try{ return JSON.parse(localStorage.getItem('cloudDown')||'{}'); }catch(e){ return {}; } }
function markCloudDown(name){ try{ const m=cloudDownMap(); m[name]=Date.now(); localStorage.setItem('cloudDown',JSON.stringify(m)); }catch(e){} }
function clearCloudDown(name){ try{ const m=cloudDownMap(); if(m[name]){ delete m[name]; localStorage.setItem('cloudDown',JSON.stringify(m)); } }catch(e){} }
// true bila kegagalan disebabkan kuota/limit/akun nonaktif (layak pindah akun), bukan masalah file/jaringan
function isCloudQuotaError(status,msg){
  if([401,402,403,420,429].includes(status)) return true;
  return /(limit|quota|exceed|credit|disabled|suspend|restrict|blocked|plan)/i.test(String(msg||''));
}
async function uploadToCloudinary(dataUrl){
  if(!dataUrl || !String(dataUrl).startsWith('data:')) return dataUrl;
  const accounts=cloudAccounts();
  if(!accounts.length) throw new Error('Cloudinary Cloud Name / Upload Preset belum diisi di Pengaturan — foto tidak bisa disync ke backend.');
  const down=cloudDownMap(), now=Date.now();
  const fresh=accounts.filter(a=>!(down[a.cloudName] && now-down[a.cloudName]<CLOUD_COOLDOWN_MS));
  const stale=accounts.filter(a=>!fresh.includes(a));
  const order=[...fresh,...stale]; // akun yang sedang "penuh" dicoba paling akhir
  let lastErr=null;
  for(const acc of order){
    try{
      const body=new FormData();
      body.append('file', dataUrl);
      body.append('upload_preset', acc.uploadPreset);
      const res=await fetch(`https://api.cloudinary.com/v1_1/${encodeURIComponent(acc.cloudName)}/auto/upload`,{method:'POST',body});
      const json=await res.json().catch(()=>null);
      if(res.ok && json?.secure_url){ clearCloudDown(acc.cloudName); return json.secure_url; }
      const msg=json?.error?.message || 'Upload ke Cloudinary gagal';
      lastErr=new Error(order.length>1 ? `[${acc.cloudName}] ${msg}` : msg);
      if(isCloudQuotaError(res.status,msg)){ markCloudDown(acc.cloudName); console.warn('Cloudinary akun penuh/dibatasi, pindah akun:',acc.cloudName,msg); continue; }
      throw lastErr; // error lain (file rusak/terlalu besar, preset salah) tidak akan beres dengan ganti akun
    }catch(err){
      if(err===lastErr) throw err;
      lastErr=err; // gagal jaringan: jangan tandai penuh; coba akun lain, kalau semua gagal lempar error
    }
  }
  throw lastErr || new Error('Upload ke Cloudinary gagal');
}

async function pushUpsert(store,recordId){
  const record = await dbGet(store,recordId);
  if(!record) return;
  let next=record, patched=false;
  if(store==='products'){
    const list = Array.isArray(next.images) && next.images.length ? next.images : (next.image ? [next.image] : []);
    if(list.some(u=>String(u).startsWith('data:'))){
      const out=[...list];
      try{
        for(let i=0;i<out.length;i++){ if(String(out[i]).startsWith('data:')){ const wasVid=isVideoSrc(out[i]); const up=await uploadToCloudinary(out[i]); out[i]=wasVid?videoUrl(up):up; } }
      }catch(err){
        // simpan foto yang sudah terunggah supaya tidak diunggah ulang saat dicoba lagi
        await dbPutRaw(store,{...next, images:out, image:firstImage(out)});
        throw err;
      }
      next={...next, images:out, image:firstImage(out)}; patched=true;
    }
  }
  if(store==='sales' && next.receipt && String(next.receipt).startsWith('data:')){
    next={...next, receipt: await uploadToCloudinary(next.receipt)}; patched=true;
  }
  if(patched) await dbPutRaw(store,next);
  const row = {
    id: String(recordId),
    updated_at: Number(next.updatedAt)||Date.now(),
    deleted: !!next.deleted,
    data: next
  };
  if(store==='products') row.status = next.status || 'available';
  const {error} = await sb.from(store).upsert(row);
  if(error) throw new Error(error.message);
  knownRemoteIds[store]?.add(String(recordId));
}
async function pushDelete(store,recordId){
  const {error} = await sb.from(store).update({deleted:true, updated_at:Date.now()}).eq('id',String(recordId));
  if(error) throw new Error(error.message);
}

let flushing = false;
async function flushSyncQueue(){
  if(flushing) return;
  if(!navigator.onLine) return;
  if(!(await ensureSession())) return;
  flushing=true; syncState={...syncState,syncing:true}; emitSyncState();
  try{
    while(true){
      const queue=await dbAll('syncQueue');
      queue.sort(syncQueueCompare);
      const item=queue[0];
      if(!item){ syncState={...syncState,lastError:''}; break; }
      try{
        if(item.action==='delete') await pushDelete(item.store,item.recordId);
        else await pushUpsert(item.store,item.recordId);
        await dbDeleteRaw('syncQueue',item.id);
      }catch(err){
        console.warn('R-Preloved sync: gagal, akan dicoba lagi nanti.',err);
        syncState={...syncState,lastError:String(err.message||err)};
        break;
      }
      await refreshPendingCount();
    }
  }finally{
    flushing=false; syncState={...syncState,syncing:false}; emitSyncState();
    await refreshPendingCount();
  }
}
window.addEventListener('online', ()=>flushSyncQueue());

const NUMERIC_FIELDS = {

function isTruthyFlag(v){ return v===true || v==='TRUE' || v==='true' || v===1 || v==='1'; }
function isValidSyncedRecord(store, r){
  if(store==='sales') return Number.isFinite(r.date) && Array.isArray(r.items) && r.items.length>0;
  return true;
}
function unflattenFromSheet(store,raw){
  const r={...raw};
  if(store==='sales' && typeof r.items==='string'){ try{ r.items=JSON.parse(r.items)||[]; }catch(e){ r.items=[]; } }
  if(store==='stocktakes' && typeof r.entries==='string'){ try{ r.entries=JSON.parse(r.entries)||[]; }catch(e){ r.entries=[]; } }
  (NUMERIC_FIELDS[store]||[]).forEach(f=>{
    if(r[f]===undefined || r[f]==='') r[f]=undefined; else r[f]=Number(r[f]);
  });
  if(store==='sales'){
    r.cancelled = raw.cancelled!==undefined && raw.cancelled!=='' ? isTruthyFlag(raw.cancelled) : false;
    if(raw.cancelledAt===undefined || raw.cancelledAt==='') r.cancelledAt=undefined; else r.cancelledAt=Number(raw.cancelledAt);
  }
  r.deleted = isTruthyFlag(r.deleted);

}
async function fetchAllRows(store){
  // PostgREST membatasi 1000 baris per request, jadi dipaging.
  const PAGE=1000, out=[];
  for(let from=0;;from+=PAGE){
    const {data,error} = await sb.from(store).select('id,updated_at,deleted,data').order('id').range(from,from+PAGE-1);
    if(error) throw new Error(error.message);
    out.push(...data);
    if(data.length<PAGE) break;
  }
  return out;
}
async function pullStore(store){
  const rows = (await fetchAllRows(store)).map(r=>({...(r.data||{}), id:r.id, updatedAt:r.updated_at, deleted:r.deleted}));
  const local = await dbAll(store);
  const localById = new Map(local.map(r=>[String(r.id),r]));
  // Kumpulkan dulu perubahan, lalu tulis sekaligus dalam satu transaksi.
  const toPut=[], toDelete=[];
  for(const raw of rows){
    if(!raw || !raw.id) continue;
    const remote = unflattenFromSheet(store,raw);
    knownRemoteIds[store]?.add(String(remote.id));
    const localRec = localById.get(String(remote.id));
    if(remote.deleted){
      if(localRec) toDelete.push(localRec.id);
      continue;
    }
    if(!isValidSyncedRecord(store,remote)) continue;
    const remoteTs = Number(remote.updatedAt)||0;
    const localTs = localRec ? (Number(localRec.updatedAt)||0) : -1;
    if(!localRec || remoteTs>localTs){
      toPut.push({...remote,id:localRec?localRec.id:remote.id});
    }
  }
  await dbApplyBatch(store,toPut,toDelete);
  // Self-heal: record lokal yang belum ada di Supabase (mis. hasil import lama) di-push otomatis.
  const remoteIds=new Set(rows.map(r=>String(r.id)));
  for(const rec of local){ if(rec && rec.id!=null && !remoteIds.has(String(rec.id)) && !rec.deleted) enqueueSync(store,'upsert',rec.id); }
}
async function pullAll(){
  if(!navigator.onLine) return;

  // Keempat store ditarik paralel (tiap request JSONP punya callback unik, jadi aman).
  await Promise.all(SYNCABLE_STORES.map(async store=>{
    try{ await pullStore(store); }catch(err){ ok=false; console.warn('R-Preloved: gagal menarik data.',store,err); syncState={...syncState,lastError:String(err.message||err)}; emitSyncState(); }
  }));
  if(ok){ syncState={...syncState,lastError:''}; emitSyncState(); }
}

function beep(kind='success'){
  try{
    const Ctx = window.AudioContext||window.webkitAudioContext;
    if(!Ctx) return;
    if(!sharedAudioCtx) sharedAudioCtx = new Ctx();
    const ctx = sharedAudioCtx;
    if(ctx.state==='suspended') ctx.resume();
    const now = ctx.currentTime;
    const tone=(freq,start,dur,type='sine',vol=0.4)=>{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type=type; o.frequency.setValueAtTime(freq, now+start);
      g.gain.setValueAtTime(0, now+start);
      g.gain.linearRampToValueAtTime(vol, now+start+0.006);
      g.gain.exponentialRampToValueAtTime(0.001, now+start+dur);
      o.connect(g); g.connect(ctx.destination);
      o.start(now+start); o.stop(now+start+dur+0.03);
    };
    if(kind==='success'){
      tone(1318.5, 0, 0.1, 'sine', 0.5);
      tone(1975.5, 0.08, 0.16, 'sine', 0.45);
    }else{

}
const imgData = file => new Promise((resolve,reject)=>{
  if(!file) return resolve(null);
  const r=new FileReader(); r.onload=()=>resolve(r.result); r.onerror=reject; r.readAsDataURL(file);
});
/* Foto produk: perkecil (sisi terpanjang 1600px, JPEG) agar ringan disimpan & diunggah. Gagal → pakai file asli. */
const imgScaled = (file,max=1600,quality=0.82) => new Promise((resolve,reject)=>{
  if(!file) return resolve(null);
  // GIF (animasi) jangan lewat canvas: canvas hanya mengambil 1 frame lalu jadi JPEG statis.
  if(file.type==='image/gif') return imgData(file).then(resolve,reject);
  const url=URL.createObjectURL(file), im=new Image();
  im.onload=()=>{
    try{
      const k=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));
      const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(im.naturalWidth*k)); c.height=Math.max(1,Math.round(im.naturalHeight*k));
      const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(im,0,0,c.width,c.height);
      URL.revokeObjectURL(url); resolve(c.toDataURL('image/jpeg',quality));
    }catch(e){ URL.revokeObjectURL(url); imgData(file).then(resolve,reject); }
  };
  im.onerror=()=>{ URL.revokeObjectURL(url); imgData(file).then(resolve,reject); };
  im.src=url;
});


function wrapLine(s,width){
  s=String(s||'');
  const out=[];
  while(s.length>width){ out.push(s.slice(0,width)); s=s.slice(width); }
  out.push(s);
  return out;
}
function padRow(left,right,width){
  left=String(left||''); right=String(right||'');
  if(left.length+right.length+1>width) left=left.slice(0,Math.max(0,width-right.length-1));
  const spaces=Math.max(1,width-left.length-right.length);
  return left+' '.repeat(spaces)+right;
}
function decoDivider(width){
  const orn='୨ৎ';
  const dashes=Math.max(1,width-6);
  return '─'+orn+'─'.repeat(dashes)+orn+'─';
}
function buildReceiptLines(sale,settings){
  const width = settings.paperWidth===58?32:48;
  const div = decoDivider(width);
  const lines=[];
  lines.push({type:'text',t:(settings.storeName||'Toko').toUpperCase(),align:'center',bold:true,big:true});
  if(settings.storeAddress) wrapLine(settings.storeAddress,width).forEach(l=>lines.push({type:'text',t:l,align:'center'}));
  if(settings.storePhone) lines.push({type:'text',t:settings.storePhone,align:'center'});
  lines.push({type:'div',t:div});
  lines.push({type:'text',t:dateText(sale.date),align:'center'});
  lines.push({type:'text',t:`No. Transaksi #${String(sale.id).slice(0,8).toUpperCase()}`,align:'center'});
  lines.push({type:'div',t:div});
  sale.items.forEach((it,idx)=>{
    const left=it.name, right=moneyPlain(it.price);
    lines.push({type:'row',left,right,t:padRow(left,right,width)});
    lines.push({type:'text',t:`• ${it.sku||'-'}`});
    if(it.discount>0){const dl='  Diskon',dr='-'+moneyPlain(it.discount);lines.push({type:'row',left:dl,right:dr,t:padRow(dl,dr,width)});}
    if(idx<sale.items.length-1) lines.push({type:'blank',t:''});
  });
  lines.push({type:'div',t:div});
  if(sale.discount>0){
    const sub=sale.subtotal!=null?sale.subtotal:sale.total+sale.discount;
    lines.push({type:'row',left:'Subtotal',right:moneyPlain(sub),t:padRow('Subtotal',moneyPlain(sub),width)});
    lines.push({type:'row',left:'Diskon',right:`-${moneyPlain(sale.discount)}`,t:padRow('Diskon',`-${moneyPlain(sale.discount)}`,width)});
  }
  lines.push({type:'row',left:'TOTAL',right:`Rp ${moneyPlain(sale.total)}`,bold:true,t:padRow('TOTAL',`Rp ${moneyPlain(sale.total)}`,width)});
  lines.push({type:'row',left:'Pembayaran',right:sale.payment,t:padRow('Pembayaran',sale.payment,width)});
  if(sale.payment==='CASH'){
    lines.push({type:'row',left:'Tunai',right:`Rp ${moneyPlain(sale.paid)}`,t:padRow('Tunai',`Rp ${moneyPlain(sale.paid)}`,width)});
    lines.push({type:'row',left:'Kembali',right:`Rp ${moneyPlain(sale.change)}`,t:padRow('Kembali',`Rp ${moneyPlain(sale.change)}`,width)});
  }
  lines.push({type:'div',t:div});
  if(sale.cancelled){
    lines.push({type:'text',t:'*** DIBATALKAN ***',align:'center',bold:true,big:true});
    lines.push({type:'blank',t:''});
  }
  lines.push({type:'text',t:'Struk Bukti Pembayaran',align:'center'});
  lines.push({type:'text',t:'Terima Kasih!',align:'center',bold:true});
  return {lines,width};
}
function buildEscPos(sale,settings){
  const {lines,width}=buildReceiptLines(sale,settings);
  const bytes=[];
  const enc=s=>bytes.push(...new TextEncoder().encode(s));
  const ESC=0x1B, GS=0x1D;
  bytes.push(ESC,0x40);
  let curAlign=null, curBold=null, curBig=null;
  lines.forEach(l=>{
    const align=l.align||'left', bold=!!l.bold, big=!!l.big;
    if(align!==curAlign){ bytes.push(ESC,0x61,align==='center'?1:align==='right'?2:0); curAlign=align; }
    if(bold!==curBold){ bytes.push(ESC,0x45,bold?1:0); curBold=bold; }
    if(big!==curBig){ bytes.push(GS,0x21,big?0x11:0x00); curBig=big; }
    enc(l.t+'\n');
  });
  bytes.push(GS,0x21,0x00); bytes.push(ESC,0x45,0); bytes.push(ESC,0x61,0);
  enc('\n\n\n');
  bytes.push(GS,0x56,0x42,0x00);
  return new Uint8Array(bytes);
}

const BT_PRINTER_CANDIDATES = [
  {service:'000018f0-0000-1000-8000-00805f9b34fb', characteristic:'00002af1-0000-1000-8000-00805f9b34fb'},
  {service:'49535343-fe7d-4ae5-8fa9-9fafd205e455', characteristic:'49535343-8841-43f4-a8d4-ecbe34729bb3'},
];
async function printEscPosBluetooth(bytes,onStatus){
  if(!navigator.bluetooth) throw new Error('Web Bluetooth tidak didukung di browser/perangkat ini. Pakai Chrome di Android, atau gunakan tombol "Cetak (Print biasa)".');
  onStatus?.('Pilih printer Bluetooth…');
  const device = await navigator.bluetooth.requestDevice({acceptAllDevices:true, optionalServices: BT_PRINTER_CANDIDATES.map(c=>c.service)});
  onStatus?.('Menghubungkan ke '+(device.name||'printer')+'…');
  const server = await device.gatt.connect();
  let writeChar=null;
  for(const cand of BT_PRINTER_CANDIDATES){
    try{ const svc=await server.getPrimaryService(cand.service); writeChar=await svc.getCharacteristic(cand.characteristic); break; }catch(e){}
  }
  if(!writeChar){
    try{
      const services=await server.getPrimaryServices();
      for(const svc of services){
        const chars=await svc.getCharacteristics();
        const found=chars.find(c=>c.properties.write||c.properties.writeWithoutResponse);
        if(found){writeChar=found;break;}
      }
    }catch(e){}
  }
  if(!writeChar){ device.gatt.disconnect(); throw new Error('Printer terhubung tapi tidak ditemukan channel cetak yang cocok (bukan printer ESC/POS?). Coba tombol "Cetak (Print biasa)".'); }
  onStatus?.('Mengirim data ke printer…');
  const CHUNK=180;
  for(let i=0;i<bytes.length;i+=CHUNK){
    const chunk=bytes.slice(i,i+CHUNK);
    if(writeChar.properties.writeWithoutResponse) await writeChar.writeValueWithoutResponse(chunk);
    else await writeChar.writeValue(chunk);
    await new Promise(r=>setTimeout(r,25));
  }
  onStatus?.('Struk terkirim ke printer.');
  try{device.gatt.disconnect();}catch(e){}
}

function wrapCanvasText(text,maxWidth,font){
  const tmp=document.createElement('canvas').getContext('2d');
  tmp.font=font;
  const words=String(text||'').split(' ').filter(Boolean);
  const lines=[]; let cur='';
  words.forEach(w=>{
    const test=cur?cur+' '+w:w;
    if(tmp.measureText(test).width>maxWidth && cur){ lines.push(cur); cur=w; } else cur=test;
  });
  if(cur) lines.push(cur);
  return lines.slice(0,2);
}
async function renderLabelCanvas({product,settings,mode,showName,showPrice}){
  const dotWidth = settings.paperWidth===58?384:576;
  const scale = dotWidth/384;
  const codeCanvas=document.createElement('canvas');
  const sku=String(product.sku||product.name||'');
  if(mode==='qr'){
    if(typeof window.qrcode!=='function') throw new Error('Library QR Code belum termuat. Muat ulang halaman.');
    if(!sku) throw new Error('SKU/nama produk kosong, tidak bisa membuat QR.');
    const qr=window.qrcode(0,'M');
    qr.addData(sku);
    qr.make();
    const count=qr.getModuleCount();
    const marginModules=2;
    const targetSize=Math.round(150*scale);
    const cell=Math.max(1,Math.floor(targetSize/(count+marginModules*2)));
    const size=cell*(count+marginModules*2);
    codeCanvas.width=size; codeCanvas.height=size;
    const qctx=codeCanvas.getContext('2d');
    qctx.fillStyle='#fff'; qctx.fillRect(0,0,size,size);
    qctx.fillStyle='#000';
    for(let r=0;r<count;r++){
      for(let c=0;c<count;c++){
        if(qr.isDark(r,c)) qctx.fillRect((c+marginModules)*cell,(r+marginModules)*cell,cell,cell);
      }
    }
  }else{
    if(!window.JsBarcode) throw new Error('Library Barcode belum termuat. Cek koneksi internet lalu buka ulang halaman.');
    JsBarcode(codeCanvas, sku, {format:'CODE128', width:Math.max(1,Math.round(2*scale)), height:Math.round(60*scale), displayValue:true, fontSize:Math.round(13*scale), margin:4, background:'#ffffff'});
  }
  const padding=Math.round(10*scale);
  const nameFont=`bold ${Math.round(15*scale)}px sans-serif`;
  const priceFont=`bold ${Math.round(20*scale)}px sans-serif`;
  const nameLines = showName ? wrapCanvasText(product.name,dotWidth-2*padding,nameFont) : [];
  const lineH=Math.round(19*scale), priceH=showPrice?Math.round(24*scale):0;
  const topH = padding + nameLines.length*lineH + priceH + Math.round(6*scale);
  const canvas=document.createElement('canvas');
  canvas.width=dotWidth; canvas.height=topH+codeCanvas.height+padding;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='#000'; ctx.textAlign='center';
  let y=padding;
  if(showName){
    ctx.font=nameFont;
    nameLines.forEach(line=>{ y+=lineH; ctx.fillText(line, canvas.width/2, y); });
  }
  if(showPrice){
    ctx.font=priceFont; y+=priceH;
    ctx.fillText(money(product.price), canvas.width/2, y);
  }
  ctx.drawImage(codeCanvas, Math.round((canvas.width-codeCanvas.width)/2), topH);
  return canvas;
}
function canvasToEscPosRaster(canvas){
  const ctx=canvas.getContext('2d');
  const w=canvas.width, h=canvas.height;
  const img=ctx.getImageData(0,0,w,h).data;
  const bytesPerRow=Math.ceil(w/8);
  const data=new Uint8Array(bytesPerRow*h);
  for(let y=0;y<h;y++){
    for(let xByte=0;xByte<bytesPerRow;xByte++){
      let byte=0;
      for(let bit=0;bit<8;bit++){
        const x=xByte*8+bit;
        let on=0;
        if(x<w){
          const i=(y*w+x)*4;
          const lum=img[i]*0.299+img[i+1]*0.587+img[i+2]*0.114;
          on = (img[i+3]>10 && lum<160) ? 1:0;
        }
        byte |= on<<(7-bit);
      }
      data[y*bytesPerRow+xByte]=byte;
    }
  }
  const xL=bytesPerRow&0xFF, xH=(bytesPerRow>>8)&0xFF, yL=h&0xFF, yH=(h>>8)&0xFF;
  return new Uint8Array([0x1D,0x76,0x30,0x00,xL,xH,yL,yH,...data]);
}

function qrSvgMarkup(qr,quiet,logo){
  const n=qr.getModuleCount();
  const q=quiet==null?2:quiet;
  const size=n+q*2;
  let rects='';
  for(let r=0;r<n;r++){
    for(let c=0;c<n;c++){
      if(qr.isDark(r,c)) rects+='<rect x="'+(c+q)+'" y="'+(r+q)+'" width="1" height="1"/>';
    }
  }
  let logoMarkup='', xlink='';
  if(logo){
    const logoSize=size*0.22, pad=logoSize*0.14;
    const bgPos=(size-logoSize)/2-pad, bgSize=logoSize+pad*2, imgPos=(size-logoSize)/2;
    logoMarkup='<rect x="'+bgPos+'" y="'+bgPos+'" width="'+bgSize+'" height="'+bgSize+'" rx="'+(bgSize*0.12)+'" fill="#fff"/>'
      +'<image href="'+logo+'" xlink:href="'+logo+'" x="'+imgPos+'" y="'+imgPos+'" width="'+logoSize+'" height="'+logoSize+'" preserveAspectRatio="xMidYMid slice"/>';
    xlink=' xmlns:xlink="http://www.w3.org/1999/xlink"';
  }
  return '<svg xmlns="http://www.w3.org/2000/svg"'+xlink+' viewBox="0 0 '+size+' '+size+'" shape-rendering="crispEdges">'
    +'<rect width="'+size+'" height="'+size+'" fill="#fff"/><g fill="#000">'+rects+'</g>'+logoMarkup+'</svg>';
}

function LoginScreen({settings,onSkip}){

  const [password,setPassword]=useState('');
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState('');
  const submit=async()=>{
    if(!email||!password){ setErr('Isi email dan password.'); return; }
    setBusy(true); setErr('');
    try{ await signIn(email.trim(),password); }
    catch(e){ setErr(String(e.message||e)); }
    finally{ setBusy(false); }
  };
  return <div className="min-h-screen bg-slate-950 text-white flex items-center justify-center p-6">
    <div className="w-full max-w-sm">

        <input type="password" autoComplete="current-password" value={password} onChange={e=>setPassword(e.target.value)} onKeyDown={e=>{ if(e.key==='Enter') submit(); }} placeholder="Password" className="w-full rounded-xl bg-white/10 border border-white/10 px-4 py-3 text-sm outline-none focus:border-white/40"/>
        {err && <div className="text-xs text-red-300 bg-red-500/10 rounded-xl px-3 py-2">{err}</div>}
        <button type="button" onClick={submit} disabled={busy} className="w-full rounded-xl bg-white text-slate-900 font-bold py-3 text-sm disabled:opacity-60">{busy?'Masuk…':'Masuk'}</button>

      </div>
    </div>
  </div>;
}
function App(){

    // favicon disamakan dengan R-Shop & R-Staff: PNG 64x64 transparan (logo muat penuh, di tengah) + apple-touch-icon 180x180 latar putih
    const link=document.getElementById('app-favicon');
    const touch=document.getElementById('app-touch-icon');
    if(!link) return;
    if(!settings.storeIcon){ link.href='data:,'; if(touch) touch.removeAttribute('href'); return; }
    let dead=false;
    const img=new Image();
    img.onload=()=>{
      if(dead) return;
      const draw=(n,pad,bg)=>{
        const c=document.createElement('canvas'); c.width=n; c.height=n;
        const x=c.getContext('2d');
        if(bg){ x.fillStyle=bg; x.fillRect(0,0,n,n); }
        const box=n*(1-2*pad), r=Math.min(box/img.naturalWidth,box/img.naturalHeight);
        const w=img.naturalWidth*r, h=img.naturalHeight*r;
        x.imageSmoothingQuality='high';
        x.drawImage(img,(n-w)/2,(n-h)/2,w,h);
        return c.toDataURL('image/png');
      };
      try{
        link.href=draw(64,0,null);
        if(touch) touch.href=draw(180,0.1,'#ffffff');
      }catch(e){ link.href=settings.storeIcon; }
    };
    img.onerror=()=>{ if(!dead) link.href=settings.storeIcon; };
    img.src=settings.storeIcon;
    return ()=>{ dead=true; };
  },[settings.storeIcon]);
  const [session,setSession]=useState(null);
  const [authChecked,setAuthChecked]=useState(false);
  const [offlineSkip,setOfflineSkip]=useState(false);
  const cloudConfigured = !!session;
  // Total produk terjual → shop_settings.stats, dibaca R-Shop (tampil di atas katalog)
  const soldPushed=useRef(null);
  useEffect(()=>{
    if(!session||!sb||!products.length) return;
    const n=products.filter(p=>p.status==='sold'&&!p.lost&&!p.deleted).length;
    if(soldPushed.current===n) return;
    const t=setTimeout(async()=>{
      try{
        const {error}=await sb.from('shop_settings').upsert({key:'stats',value:{sold:n},updated_at:Date.now()});
        if(!error) soldPushed.current=n;
      }catch(e){}
    },2500);
    return ()=>clearTimeout(t);
  },[products,session]);

  // `only` = daftar store yang perlu dibaca ulang (mis. ['products','sales']). null = baca semua.
  // Aksi biasa (simpan/jual/hapus) cukup memuat ulang store yang berubah, bukan seluruh database.
  const reload=useCallback(async(initial=false,pushSummaryNow=false,only=null)=>{
    const want=n=>!only||only.includes(n);
    try{
      const [p,s,e,st,set]=await Promise.all([
        want('products')?dbAll('products'):null,
        want('sales')?dbAll('sales'):null,
        want('expenses')?dbAll('expenses'):null,
        want('stocktakes')?dbAll('stocktakes'):null,
        want('settings')?dbAll('settings'):null
      ]);
      if(p!==null) setProducts(Array.isArray(p)?p:[]);
      if(s!==null) setSales(Array.isArray(s)?s:[]);
      if(e!==null) setExpenses(Array.isArray(e)?e:[]);
      if(st!==null) setStocktakes(Array.isArray(st)?st:[]);
      let storeName='R-Studio';
      if(set!==null && Array.isArray(set) && set[0]){
        const merged = withSyncDefaults(set[0]);
        if(merged.storeName==='R-Preloved') merged.storeName='R-Studio'; // nama bawaan lama diganti otomatis; nama buatan sendiri tidak disentuh
        setSettings(merged);
        storeName=merged.storeName||storeName;
        syncSettings = {cloudName:merged.cloudName, uploadPreset:merged.uploadPreset, extraAccounts:merged.extraAccounts};
      }
      if(!idbSupported) setToast('Penyimpanan permanen tidak tersedia di sini — data hanya tersimpan sementara selama sesi ini.');
      // Reload penuh saja yang memicu flush; reload parsial sudah ditangani enqueueSync() di dbPut/dbDelete.
      if(!only){ refreshPendingCount(); flushSyncQueue(); }
    }catch(err){
      console.error('R-Preloved storage error:',err);
      setToast('Gagal memuat data terbaru. Data lama tetap ditampilkan.');
    }finally{
      setLoading(false);
    }
  },[]);
  const lastPullAtRef = useRef(0);
  const pullNow=async(force=false)=>{
    if(!(await ensureSession())) return;
    const now=Date.now();
    if(!force && now-lastPullAtRef.current<10000) return;
    lastPullAtRef.current=now;
    try{ await flushSyncQueue(); await pullAll(); await reload(false,true); }
    catch(err){ console.warn('R-Preloved: sync 2 arah gagal.',err); }
  };
  const cleanupGhostSales = async () => {
    try{
      const rows = await dbAll('sales');
      const bad = rows.filter(r=>!r.cancelled && !isValidSyncedRecord('sales',r));
      for(const r of bad){ await dbDelete('sales', r.id); }
      if(bad.length){ await flushSyncQueue(); await reload(false,false,['sales']); }
    }catch(err){ console.warn('R-Preloved: gagal membersihkan transaksi korup.', err); }
  };
  useEffect(()=>{reload(true).then(()=>pullNow(true)).then(()=>cleanupGhostSales())},[]);
  useEffect(()=>{
    const onVisible=()=>{ if(!document.hidden) pullNow(false); };
    const onOnline=()=>pullNow(false);
    document.addEventListener('visibilitychange',onVisible);
    window.addEventListener('online',onOnline);
    return ()=>{ document.removeEventListener('visibilitychange',onVisible); window.removeEventListener('online',onOnline); };
  },[]);
  useEffect(()=>{
    if(!sb){ setAuthChecked(true); return; }
    let alive=true;
    ensureSession().then(ss=>{ if(alive){ setSession(ss); setAuthChecked(true); } });
    const {data:{subscription}} = sb.auth.onAuthStateChange((event,ss)=>{
      if(!alive) return;
      setSession(ss);
      // jangan await panggilan supabase di dalam callback ini
      if(event==='SIGNED_IN') setTimeout(()=>pullNow(false),0);
    });
    return ()=>{ alive=false; subscription.unsubscribe(); };
  },[]);
  useEffect(()=>{
    const unlock=()=>{unlockAudio()};
    document.addEventListener('click',unlock,{once:true});
    document.addEventListener('touchstart',unlock,{once:true});
    return ()=>{document.removeEventListener('click',unlock);document.removeEventListener('touchstart',unlock);};
  },[]);
  useEffect(()=>{if(toast){const t=setTimeout(()=>setToast(''),2600);return()=>clearTimeout(t)}},[toast]);

  const stats=useMemo(()=>{
    const validSales=sales.filter(s=>!s.cancelled);
    const sold=validSales.reduce((a,s)=>a+s.total,0);
    const cogs=validSales.reduce((a,s)=>a+s.costTotal,0);
    const exp=expenses.reduce((a,e)=>a+e.amount,0);
    const stock=products.filter(p=>p.status!=='sold');
    return {sold,cogs,exp,profit:sold-cogs-exp,stockValue:stock.reduce((a,p)=>a+p.cost,0),stockCount:stock.length,soldCount:validSales.reduce((a,s)=>a+s.items.length,0)};
  },[products,sales,expenses]);

  const saveProduct=useCallback(async(data)=>{
    try{
      await dbPut('products',{...data,id:data.id||uid(),createdAt:data.createdAt||Date.now()});
      await reload(false,false,['products']);setModal(afterProductRef.current?{type:'stocktake'}:null);afterProductRef.current=false;setToast(data.id?'Produk diperbarui':'Produk berhasil ditambahkan');
    }catch(err){console.error(err);setToast('Gagal menyimpan produk. Coba lagi.')}
  },[reload]);
  const removeProduct=useCallback(async(id)=>{if(!confirm('Hapus produk ini?'))return;try{await dbDelete('products',id);await reload(false,false,['products']);setToast('Produk dihapus')}catch(err){console.error(err);setToast('Gagal menghapus produk.')}},[reload]);
  const saveExpense=useCallback(async(data)=>{try{await dbPut('expenses',{...data,id:data.id||uid(),date:data.date||Date.now()});await reload(false,false,['expenses']);setModal(null);setToast('Pengeluaran tersimpan')}catch(err){console.error(err);setToast('Gagal menyimpan pengeluaran.')}},[reload]);
  const sell=useCallback(async(items,payment,paid,discount)=>{
    try{
      const now=Date.now(), subtotal=items.reduce((a,i)=>a+i.price,0), disc=Math.min(Math.max(0,Number(discount)||0),subtotal), total=subtotal-disc, costTotal=items.reduce((a,i)=>a+i.cost,0);
      // Baca ulang dari database (bukan dari state React yang bisa kedaluwarsa) sebelum menulis apa pun.
      const fresh=await dbAll('products');
      const freshById=new Map(fresh.map(x=>[x.id,x]));
      const unavailable=items.filter(i=>{const p=freshById.get(i.id);return !p||p.status==='sold'});
      if(unavailable.length){
        beep('error');
        const names=unavailable.map(i=>`"${i.name}"`).join(', ');
        setToast(`Transaksi dibatalkan: ${names} sudah terjual atau tidak ada lagi. Hapus dari keranjang lalu coba lagi.`);
        await reload(false,false,['products']);
        return;
      }
      const sale={id:uid(),date:now,items,subtotal,discount:disc,total,costTotal,payment,paid:Number(paid)||0,change:Math.max(0,(Number(paid)||0)-total)};
      await dbPut('sales',sale);
      for(const i of items){const p=freshById.get(i.id);await dbPut('products',{...p,status:'sold',soldAt:now,saleId:sale.id});}
      await reload(false,false,['products','sales']);setModal({type:'receipt',data:sale});setToast(`Penjualan ${money(total)} berhasil`);
    }catch(err){console.error(err);setToast('Gagal menyimpan penjualan. Coba lagi.')}
  },[reload]);
  const exportBackup=async()=>{
    try{
      const [p,s,e,st,set]=await Promise.all([dbAll('products'),dbAll('sales'),dbAll('expenses'),dbAll('stocktakes'),dbAll('settings')]);
      const backup={app:'r-preloved',version:1,exportedAt:new Date().toISOString(),data:{products:p,sales:s,expenses:e,stocktakes:st,settings:set}};
      const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      const stamp=new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
      a.href=url; a.download=`r-preloved-backup-${stamp}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),2000);
      setToast('Backup berhasil diunduh');
    }catch(err){console.error(err);setToast('Gagal membuat file backup.')}
  };
  const importBackup=async(file)=>{
    try{
      const text=await file.text();
      const json=JSON.parse(text);
      const data=json?.data||json;
      if(!data || typeof data!=='object') throw new Error('Format file tidak dikenali.');
      const stores=['products','sales','expenses','stocktakes','settings'];
      const counts={};
      let total=0;
      stores.forEach(st=>{ const n=Array.isArray(data[st])?data[st].length:0; counts[st]=n; total+=n; });
      if(!total){ setToast('File backup kosong / formatnya tidak dikenali.'); return; }
      if(!confirm(`Import backup ini?\n\n${stores.map(st=>`${st}: ${counts[st]} data`).join('\n')}\n\nData dengan ID yang sama akan DITIMPA, data lain ditambahkan. Tindakan ini tidak bisa dibatalkan.`)) return;
      for(const store of stores){
        const rows=Array.isArray(data[store])?data[store]:[];
        for(const row of rows){ if(row && row.id!=null){ await dbPutRaw(store,SYNCABLE_STORES.includes(store)?{...row,updatedAt:Date.now()}:row); if(SYNCABLE_STORES.includes(store)) enqueueSync(store,'upsert',row.id); } }
      }
      await reload();
      setToast('Backup berhasil dipulihkan');
    }catch(err){console.error(err);setToast('Gagal membaca file backup: '+(err.message||err))}
  };
  const cancelSale=useCallback(async(sale)=>{
    if(sale.cancelled) return;
    if(!confirm(`Batalkan transaksi ini (${money(sale.total)})? Produk yang terjual akan dikembalikan ke status "Tersedia".`)) return;
    try{
      await dbPut('sales',{...sale,cancelled:true,cancelledAt:Date.now()});
      for(const i of sale.items){
        const p=products.find(x=>x.id===i.id);
        if(p && p.status==='sold' && p.saleId===sale.id){
          const {soldAt,saleId,...rest}=p;
          await dbPut('products',{...rest,status:'available'});
        }
      }
      await reload(false,false,['products','sales']);setToast('Transaksi dibatalkan & stok dikembalikan');
    }catch(err){console.error(err);setToast('Gagal membatalkan transaksi.')}
  },[products,reload]);
  const doStocktake=useCallback(async(entries,unknown=[])=>{
    try{
      // Status dibaca ulang dari database supaya barang yang laku saat opname berlangsung tidak tertimpa.
      const fresh=new Map((await dbAll('products')).map(x=>[x.id,x]));
      const allSales=await dbAll('sales');
      const now=Date.now(), out=[], notes=[];
      for(const e of entries){
        const p=fresh.get(e.id); let result=e.result;
        if(!p) continue;
        if(result==='missing_sold'||result==='missing_lost'){
          if(p.status==='sold') result='already_sold';
          else if(result==='missing_sold'){
            const sale={id:uid(),date:now,items:[{id:p.id,sku:p.sku,name:p.name,price:p.price,cost:p.cost}],subtotal:p.price,discount:0,total:p.price,costTotal:p.cost,payment:'LAINNYA',paid:p.price,change:0,note:'Dicatat dari stock opname'};
            await dbPut('sales',sale);
            await dbPut('products',{...p,status:'sold',soldAt:now,saleId:sale.id});
          }else{
            if((Number(p.cost)||0)>0) await dbPut('expenses',{id:uid(),date:now,name:`Barang hilang: ${p.name} (${p.sku})`,category:'Barang Hilang',amount:Number(p.cost)});
            await dbPut('products',{...p,status:'sold',soldAt:now,lost:true});
          }
        }else if(result==='sold_found_restored'){
          if(p.status!=='sold') result='found';
          else{
            const sale=p.saleId?allSales.find(x=>x.id===p.saleId&&!x.cancelled):null;
            if(sale&&sale.items.length>1){result='sold_found_ignored';notes.push(`"${p.name}" ada di transaksi multi-barang, batalkan lewat menu Penjualan.`)}
            else{
              if(sale) await dbPut('sales',{...sale,cancelled:true,cancelledAt:now});
              const {soldAt,saleId,lost,...rest}=p;
              await dbPut('products',{...rest,status:'available'});
            }
          }
        }
        out.push({id:p.id,sku:p.sku,name:p.name,cost:Number(p.cost)||0,result});
      }
      unknown.forEach(c=>out.push({id:'unk-'+c,sku:c,name:'SKU tidak dikenal',cost:0,result:'unknown'}));
      await dbPut('stocktakes',{id:uid(),date:now,entries:out});
      clearStocktakeDraft();
      await reload(false,false,['products','sales','expenses','stocktakes']);setModal(null);setToast(notes.length?notes[0]:'Stock opname tersimpan');
    }catch(err){console.error(err);setToast('Gagal menyimpan stock opname.')}
  },[reload]);

  const openAddProduct=useCallback(()=>setModal({type:'product'}),[]);
  const openEditProduct=useCallback(p=>setModal({type:'product',data:p}),[]);
  const openSellProduct=useCallback(p=>setModal({type:'sale',data:p}),[]);
  const openLabelProduct=useCallback(p=>setModal({type:'label',data:p}),[]);
  const openBadgeProduct=useCallback(p=>setModal({type:'badge',data:p}),[]);
  const saveBadge=useCallback(async(id,fields)=>{
    try{
      const cur=await dbGet('products',id);
      if(!cur){setToast('Produk tidak ditemukan.');return}
      await dbPut('products',{...cur,...fields});
      await reload(false,false,['products']);setModal(null);setToast(fields.badge?'Badge disimpan':'Badge dihapus');
    }catch(err){console.error(err);setToast('Gagal menyimpan badge. Coba lagi.')}
  },[reload]);
  const openBarcodeGen=useCallback(()=>setModal({type:'barcodegen'}),[]);
  const openStocktake=useCallback(()=>setModal({type:'stocktake'}),[]);
  const openSale=useCallback(()=>setModal({type:'sale'}),[]);
  const openScanner=useCallback(()=>{unlockAudio();setModal({type:'scanner'})},[]);
  const openReceipt=useCallback(s=>setModal({type:'receipt',data:s}),[]);
  const openExpense=useCallback(()=>setModal({type:'expense'}),[]);
  const goFinance=useCallback(()=>setTab('finance'),[]);

  const nav=[
    ['dashboard','Dashboard','grid'],['products','Produk','shirt'],['sales','Penjualan','cart'],['finance','Keuangan','wallet']
  ];
  const navDesktop=[...nav,['staff','Karyawan','users']]; // menu Karyawan hanya di sidebar desktop (bottom-nav mobile tetap memakai `nav`)
  if(loading) return <div className="min-h-screen bg-slate-950 text-white flex items-center justify-center p-6"><div className="text-center">{settings.storeIcon && <div className="mx-auto mb-4 h-12 w-auto max-w-[140px] flex items-center justify-center overflow-hidden"><img src={settings.storeIcon} className="h-full w-auto object-contain block"/></div>}<div className="font-black text-xl">{settings.storeName||'R-Studio'}</div><div className="text-sm text-slate-400 mt-1">Menyiapkan aplikasi…</div></div></div>;
  if(authChecked && !session && !offlineSkip) return <LoginScreen settings={settings} onSkip={()=>setOfflineSkip(true)}/>;

  return <div className="min-h-screen">
    <aside className="hidden md:flex fixed left-0 top-0 bottom-0 desktop-sidebar bg-slate-950 text-white flex-col p-4 z-30">
      <div className="px-3 py-4 mb-4 flex items-center gap-3">{settings.storeIcon && <div className="h-[34px] min-w-[34px] max-w-[110px] flex items-center justify-center overflow-hidden shrink-0"><img src={settings.storeIcon} className="h-full w-auto object-contain block"/></div>}<div className="min-w-0"><div className="font-black text-[21px] leading-[21px] tracking-tight truncate">{settings.storeName||'R-Studio'}</div><div className="text-[11px] leading-[11px] text-slate-400 mt-1.5">Risaren</div></div></div>
      <nav className="space-y-1">
        {navDesktop.map(([id,label,icon])=><button key={id} onClick={()=>setTab(id)} className={`w-full flex items-center gap-3 px-3 py-3 rounded-xl text-sm font-semibold ${tab===id?'bg-white text-slate-900':'text-slate-300 hover:bg-white/10'}`}><Icon name={icon}/>{label}</button>)}
      </nav>
      <div className="mt-auto"><button onClick={()=>setModal({type:'settings'})} className="w-full flex items-center gap-3 px-3 py-3 rounded-xl text-sm text-slate-300 hover:bg-white/10"><Icon name="settings"/>Pengaturan</button></div>
    </aside>

    <main className="desktop-content min-h-screen pb-24 md:pb-8">
      <header className="sticky top-0 z-20 bg-white/90 backdrop-blur border-b border-slate-100">
        <div className="max-w-7xl mx-auto px-4 md:px-7 h-16 flex items-center justify-between">
          <div className="flex items-center gap-2 md:block">{settings.storeIcon && <div className="md:hidden h-[30px] min-[521px]:h-[34px] min-w-[30px] max-w-[110px] flex items-center justify-center overflow-hidden shrink-0"><img src={settings.storeIcon} className="h-full w-auto object-contain block"/></div>}<div className="md:hidden min-w-0"><div className="font-black text-[19px] leading-[19px] tracking-tight truncate">{settings.storeName||'R-Studio'}</div><div className="text-[10px] leading-[10px] text-slate-500 mt-1">Risaren</div></div><div className="hidden md:block text-sm text-slate-500">{navDesktop.find(x=>x[0]===tab)?.[1]}</div></div>
          <div className="flex items-center gap-2">
            {cloudConfigured && <button type="button" onClick={()=>{ if(confirm('Keluar dari akun sinkron? Data lokal tetap aman.')) signOut(); }} title="Keluar (akun sinkron)" aria-label="Keluar" className="w-10 h-10 shrink-0 flex items-center justify-center text-slate-500 hover:text-slate-800 active:scale-95"><Icon name="logout" size={20}/></button>}
            <Button variant="soft" className="hidden md:inline-flex px-3" aria-label="Scan SKU" onClick={()=>{unlockAudio();setModal({type:'scanner'})}}><Icon name="scan" size={18}/><span className="hidden sm:inline">Scan SKU</span></Button>
          </div>
        </div>
      </header>
      {cloudConfigured && sync.lastError && <div className="max-w-7xl mx-auto px-4 md:px-7 pt-3"><div className="bg-amber-50 text-amber-700 text-xs font-semibold px-3.5 py-2.5 rounded-xl">⚠ Sync gagal: {sync.lastError}</div></div>}
      <div className="max-w-7xl mx-auto px-4 md:px-7 py-5">
        {tab==='dashboard' && <MemoDashboard stats={stats} products={products} sales={sales} onSell={openSale} onScan={openScanner} onAddProduct={openAddProduct} onReport={goFinance} />}
        {tab==='products' && <Products products={products} search={search} setSearch={setSearch} onAdd={openAddProduct} onEdit={openEditProduct} onDelete={removeProduct} onSell={openSellProduct} onBadge={openBadgeProduct} onBarcode={openBarcodeGen} stocktakes={stocktakes} onRunStocktake={openStocktake} />}
        {tab==='sales' && <MemoSales sales={sales} onSell={openSale} onPrint={openReceipt} onCancel={cancelSale} />}
        {tab==='staff' && isDesktop && <StaffPage products={products} cloud={cloudConfigured} setToast={setToast} />}
        {tab==='finance' && <MemoFinance stats={stats} expenses={expenses} onExpense={openExpense} />}
      </div>
    </main>

    <nav className="md:hidden fixed bottom-0 left-0 right-0 z-40 bg-white/95 backdrop-blur border-t border-slate-200 safe-bottom">
      <div className="grid grid-cols-5 h-16">
        {nav.slice(0,2).map(([id,label,icon,short])=><button key={id} onClick={()=>setTab(id)} className={`flex flex-col items-center justify-center gap-1 text-[10px] font-bold leading-none px-1 active:scale-95 transition ${tab===id?'text-indigo-600':'text-slate-400'}`}><Icon name={icon} size={20}/><span className="truncate max-w-[70px]">{short||label}</span></button>)}
        <div className="flex flex-col items-center justify-center">
          <button type="button" aria-label="Scan SKU" onClick={()=>{unlockAudio();setModal({type:'scanner'})}} className="w-12 h-12 -mt-5 rounded-full bg-indigo-600 text-white shadow-lg shadow-indigo-600/40 ring-4 ring-white flex items-center justify-center active:scale-95 transition hover:bg-indigo-500">
            <Icon name="scan" size={20}/>
          </button>
          <span className="mt-1 text-[10px] font-bold leading-none text-indigo-600">Scan</span>
        </div>
        {nav.slice(2).map(([id,label,icon,short])=><button key={id} onClick={()=>setTab(id)} className={`flex flex-col items-center justify-center gap-1 text-[10px] font-bold leading-none px-1 active:scale-95 transition ${tab===id?'text-indigo-600':'text-slate-400'}`}><Icon name={icon} size={20}/><span className="truncate max-w-[70px]">{short||label}</span></button>)}
      </div>
    </nav>

    {modal?.type==='product' && <ProductModal data={modal.data} prefill={modal.prefill} onClose={()=>{setModal(afterProductRef.current?{type:'stocktake'}:null);afterProductRef.current=false}} onSave={saveProduct}/>}
    {modal?.type==='sale' && <SaleModal products={products} initial={modal.data} onClose={()=>setModal(null)} onSell={sell}/>}
    {modal?.type==='scanner' && <ScannerModal products={products} onClose={()=>setModal(null)} onFound={p=>{setModal({type:'sale',data:p})}} />}
    {modal?.type==='expense' && <ExpenseModal onClose={()=>setModal(null)} onSave={saveExpense}/>}
    {modal?.type==='stocktake' && <StocktakeModal products={products} onClose={()=>setModal(null)} onSave={doStocktake} onAddProduct={sku=>{afterProductRef.current=true;setModal({type:'product',prefill:{sku}})}}/>}
    {modal?.type==='settings' && <SettingsModal settings={settings} onClose={()=>setModal(null)} onSave={async s=>{try{await dbPut('settings',{...s,id:settings.id||1});await reload(false,false,['settings']);setModal(null);setToast('Pengaturan disimpan')}catch(err){console.error(err);setToast('Gagal menyimpan pengaturan.')}}} onExportBackup={exportBackup} onImportBackup={importBackup}/>}
    {modal?.type==='receipt' && <ReceiptModal sale={modal.data} settings={settings} onClose={()=>setModal(null)}/>}
    {modal?.type==='label' && <LabelModal product={modal.data} settings={settings} onClose={()=>setModal(null)}/>}
    {modal?.type==='badge' && <BadgeModal product={modal.data} onSave={saveBadge} onLabel={()=>openLabelProduct(modal.data)} onClose={()=>setModal(null)}/>}
    {modal?.type==='barcodegen' && <Modal title="Barcode & QR Massal" onClose={()=>setModal(null)} wide><BarcodeGen/></Modal>}
    {toast && <div className="fixed z-[70] bottom-20 md:bottom-6 left-1/2 -translate-x-1/2 bg-slate-950 text-white px-4 py-3 rounded-2xl shadow-xl text-sm font-semibold fade-in">{toast}</div>}
  </div>
}

      <div className="flex items-center justify-between mb-4"><div><h2 className="font-extrabold">Stok aktif</h2><p className="text-xs text-slate-400 mt-1">{stats.stockCount} produk belum terjual</p></div><span className="text-xs font-bold text-slate-400">Modal {money(stats.stockValue)}</span></div>
      {available.length===0?<Empty text="Belum ada stok aktif."/>:<div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3">{available.map(p=><ProductCard key={p.id} p={p}/>)}</div>}
    </section>
    <section className="bg-white border border-slate-100 rounded-3xl p-5 shadow-soft">
      <div className="flex items-center justify-between mb-4"><h2 className="font-extrabold">Transaksi terbaru</h2><span className="text-xs text-slate-400">{sales.length} transaksi</span></div>

      {!sales.length&&<Empty text="Belum ada transaksi."/>}
    </section>
  </div>
}

/* ===== Thumbnail foto: daftar/kartu memakai versi kecil (di-cache), bukan foto 1600px penuh ===== */
const THUMB_MEM=new Map();
function thumbKey(src,max){ return max+':'+src.length+':'+src.slice(40,80)+':'+src.slice(-60); }
function thumbDB(){
  return thumbDB.p||(thumbDB.p=new Promise((res,rej)=>{
    try{ const r=indexedDB.open('rs-wms-thumbs',1); r.onupgradeneeded=()=>r.result.createObjectStore('t'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }catch(e){ rej(e); }
  }));
}
function thumbIdbGet(k){ return thumbDB().then(db=>new Promise(res=>{ const q=db.transaction('t').objectStore('t').get(k); q.onsuccess=()=>res(q.result||null); q.onerror=()=>res(null); })).catch(()=>null); }
function thumbIdbPut(k,v){ return thumbDB().then(db=>new Promise(res=>{ const tx=db.transaction('t','readwrite'); const st=tx.objectStore('t'); st.put(v,k); const c=st.count(); c.onsuccess=()=>{ if(c.result>4000) st.clear(); }; tx.oncomplete=()=>res(true); tx.onerror=()=>res(false); })).catch(()=>false); }
let THUMB_Q=Promise.resolve();
function makeThumb(src,key,max){
  const job=THUMB_Q.then(async()=>{
    const hit=await thumbIdbGet(key); if(hit){ THUMB_MEM.set(key,hit); return hit; }
    const out=await new Promise(res=>{
      const im=new Image(); im.decoding='async';
      im.onload=()=>{ try{
        const k=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));
        const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(im.naturalWidth*k)); c.height=Math.max(1,Math.round(im.naturalHeight*k));
        const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(im,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg',0.78));
      }catch(e){ res(null); } };
      im.onerror=()=>res(null); im.src=src;
    });
    if(out){ THUMB_MEM.set(key,out); thumbIdbPut(key,out); }
    return out;
  }).catch(()=>null);
  THUMB_Q=job.then(()=>{},()=>{}); // antrean satu-satu supaya layar tidak tersendat
  return job;
}
function Thumb({src,className,max=320}){
  const big=typeof src==='string'&&src.startsWith('data:image/')&&src.length>60000&&!src.startsWith('data:image/gif');
  const key=big?thumbKey(src,max):'';
  const [t,setT]=useState(()=>big?(THUMB_MEM.get(key)||null):src);
  useEffect(()=>{
    if(!big){ setT(src); return; }
    const m=THUMB_MEM.get(key); if(m){ setT(m); return; }
    setT(null); let dead=false;
    makeThumb(src,key,max).then(v=>{ if(!dead) setT(v||src); });
    return ()=>{ dead=true; };
  },[src,key,big,max]);
  if(!t) return <div className={`${className||''} bg-slate-100 animate-pulse`}/>;
  return <img src={t} alt="" decoding="async" className={`${className||''} thumb-in`}/>;
}

function useIsDesktop(){
  const query='(min-width: 768px)';
  const [v,setV]=useState(()=>window.matchMedia(query).matches);
  useEffect(()=>{
    const m=window.matchMedia(query);
    const h=e=>setV(e.matches);
    setV(m.matches);
    if(m.addEventListener) m.addEventListener('change',h); else m.addListener(h);
    return ()=>{ if(m.removeEventListener) m.removeEventListener('change',h); else m.removeListener(h); };
  },[]);
  return v;
}
const PRODUCT_PAGE_SIZE=30;
// Label status produk (sama dengan badge di ProductRow) supaya bisa dicari: "baru", "10 hari lalu", "terjual", "hilang".
function productStatusLabel(p,today){
  if(p.lost) return 'hilang';
  if(p.status==='sold') return 'terjual';
  const age=Number(p.createdAt)>0?Math.max(0,Math.round((today-new Date(Number(p.createdAt)).setHours(0,0,0,0))/86400000)):null;
  return age===null?'aktif':age===0?'baru':`${age} hari lalu`;
}
function Products({products,search,setSearch,onAdd,onEdit,onDelete,onSell,onBadge,onBarcode,onRunStocktake,stocktakes}){
  const [view,setView]=useState('list');
  const dsearch=useDeferredValue(search); // daftar difilter di prioritas rendah, kolom ketik tetap responsif
  const today=useMemo(()=>new Date().setHours(0,0,0,0),[]);
  // Urutan default: yang terakhir di-upload atau terakhir diedit tampil paling atas.
  const sortedProducts=useMemo(()=>{
    const stamp=p=>Math.max(Number(p.updatedAt)||0,Number(p.createdAt)||0);
    return products.slice().sort((a,b)=>stamp(b)-stamp(a));
  },[products]);
  const list=useMemo(()=>{
    const term=dsearch.trim().toLowerCase().replace(/\s+/g,' ');
    if(!term) return sortedProducts;
    const tryStatus=term.length>=3;
    return sortedProducts.filter(p=>{
      if((p.name+' '+p.sku+' '+(p.category||'')).toLowerCase().includes(term)) return true;
      if(!tryStatus) return false;
      const st=productStatusLabel(p,today);
      return st.startsWith(term) || (st.endsWith('hari lalu') && 'hari lalu'.startsWith(term));
    });
  },[sortedProducts,dsearch,today]);
  const activeCount=useMemo(()=>products.reduce((n,p)=>n+(p.status!=='sold'?1:0),0),[products]);
  const isDesktop=useIsDesktop();
  // Tampilkan bertahap: 30 baris dulu, sisanya dimuat saat scroll mendekati bawah.
  const [visible,setVisible]=useState(PRODUCT_PAGE_SIZE);
  useEffect(()=>{ setVisible(PRODUCT_PAGE_SIZE); },[dsearch]);
  const shown=useMemo(()=>list.length>visible?list.slice(0,visible):list,[list,visible]);
  const sentinelRef=useRef(null);
  useEffect(()=>{
    const el=sentinelRef.current;
    if(!el || visible>=list.length) return;
    if(!('IntersectionObserver' in window)) return;
    const io=new IntersectionObserver(es=>{ if(es[0].isIntersecting) setVisible(v=>v+PRODUCT_PAGE_SIZE); },{rootMargin:'400px'});
    io.observe(el);
    return ()=>io.disconnect();
  },[visible,list.length,view]);
  if(view==='stocktake') return <Stocktake products={products} stocktakes={stocktakes} onRun={onRunStocktake} onBack={()=>setView('list')}/>;
  return <div className="space-y-4">
    <div className="flex flex-col sm:flex-row gap-3 sm:items-center justify-between"><div><h1 className="text-2xl font-black">Produk & Stok</h1><p className="text-sm text-slate-500">{activeCount} aktif • {products.length-activeCount} terjual</p></div>
      <div className="flex flex-col gap-2 sm:w-auto w-full">
        <div className="grid grid-cols-2 gap-2">
          <Button variant="outline" onClick={()=>setView('stocktake')}><Icon name="box" size={18}/><span>Stock Opname</span></Button>
          <Button variant="outline" onClick={onBarcode}><Icon name="barcode" size={18}/><span>Barcode Massal</span></Button>
        </div>
        <Button onClick={onAdd}><Icon name="plus" size={18}/><span>Tambah Produk</span></Button>
      </div>
    </div>
    <SearchInput value={search} onChange={e=>setSearch(e.target.value)} placeholder="Cari SKU, nama, kategori…" className="h-12 rounded-2xl"/>
    <div className="bg-white rounded-3xl border border-slate-100 shadow-soft overflow-hidden">
      <div className="hidden md:grid grid-cols-[64px_1.5fr_1fr_110px_110px_140px] gap-3 px-5 py-3 bg-slate-50 text-xs font-bold text-slate-500"><span></span><span>Produk</span><span>SKU</span><span>Modal</span><span>Harga</span><span>Status</span></div>
      {shown.map(p=><ProductRow key={p.id} p={p} onEdit={onEdit} onSell={onSell} onDelete={onDelete} onBadge={onBadge} isDesktop={isDesktop} today={today}/>)}
      {!list.length&&<Empty text="Produk tidak ditemukan."/>}
      {list.length>shown.length&&<div ref={sentinelRef} className="p-4 text-center"><button type="button" onClick={()=>setVisible(v=>v+PRODUCT_PAGE_SIZE)} className="text-xs font-bold text-indigo-600 active:scale-95 transition">Menampilkan {shown.length} dari {list.length} • Muat lebih banyak</button></div>}
    </div>
  </div>
}

function ProductModal({data,prefill,onClose,onSave}){

  const withImgs=o=>({...o,images:Array.isArray(o.images)&&o.images.length?o.images:(o.image?[o.image]:[])});
  const [f,setF]=useState(withImgs(data?(initDm?{...data,price:Number(data.normalPrice)||(initDm.mode==='rp'?(Number(data.price)||0)+initDm.val:Math.round((Number(data.price)||0)/(1-initDm.val/100)))}:data):{sku:'RP-'+String(Date.now()).slice(-6),name:'',category:'',size:'',color:'',cost:'',price:'',status:'available',image:null,images:[],...(prefill||{})}));
  const [showDisc,setShowDisc]=useState(!!initDm);
  const [discMode,setDiscMode]=useState(initDm?initDm.mode:'persen');
  const [discValue,setDiscValue]=useState(initDm?initDm.val:0);
  const basePrice=Number(f.price)||0;
  const discAmt=discMode==='persen'?Math.round(basePrice*Math.min(99,Math.max(0,Number(discValue)||0))/100):Math.min(Math.max(0,Number(discValue)||0),Math.max(0,basePrice-1));
  const discPct=basePrice>0?Math.min(99,Math.round(discAmt/basePrice*100)):0;
  const finalPrice=basePrice-discAmt;
  const hasDisc=discAmt>0&&discPct>=1;
  const switchDiscMode=m=>{setDiscMode(m);setDiscValue(0)};
  const [saving,setSaving]=useState(false);
  const [showMore,setShowMore]=useState(!!(data&&(data.category||data.size||data.color)));
  const [scanning,setScanning]=useState(false);
  const cameraRef=useRef(null), galleryRef=useRef(null);
  const change=(k,v)=>setF(x=>({...x,[k]:v}));
  const MAX_PHOTOS=8;
  const photo=async e=>{
    const files=[...(e.target.files||[])]; e.target.value='';
    if(!files.length) return;
    const room=MAX_PHOTOS-(f.images||[]).length;
    if(room<=0){ alert('Maksimal '+MAX_PHOTOS+' foto per barang.'); return; }
    if(files.length>room) alert('Hanya '+room+' foto lagi yang muat (maksimal '+MAX_PHOTOS+').');
    const added=[];
    for(const x of files.slice(0,room)){
      if(/^video\//.test(x.type)){
        if(!/^video\/(mp4|webm|quicktime)$/.test(x.type)){ alert(x.name+': format video harus MP4, WebM, atau MOV.'); continue; }
        if(x.size>30*1024*1024){ alert(x.name+': ukuran video lebih dari 30 MB.'); continue; }
        try{ added.push(await imgData(x)); }catch(err){ alert('Gagal membaca '+x.name); }
      } else { const d=await imgScaled(x); if(d) added.push(d); }
    }
    setF(x=>({...x,images:[...(x.images||[]),...added].slice(0,MAX_PHOTOS)}));
  };
  const rmPhoto=i=>setF(x=>({...x,images:(x.images||[]).filter((_,j)=>j!==i)}));
  const coverPhoto=i=>setF(x=>{const a=[...(x.images||[])];const [m]=a.splice(i,1);a.unshift(m);return {...x,images:a}});
  const submit=async e=>{e.preventDefault();if(!f.name||!f.sku)return;setSaving(true);try{const out={...f,cost:Number(f.cost)||0,price:basePrice,images:f.images||[],image:firstImage(f.images)};
    if(hasDisc){out.price=finalPrice;out.normalPrice=basePrice;out.badge=discMode==='rp'?`Diskon Rp ${formatThousand(discAmt)}`:`Diskon ${discPct}%`;if(!initDm||!out.badgeColor){out.badgeColor=BADGE_WHITE;out.badgeInk='dark'}}
    else if(initDm){out.badge='';out.badgeColor='';out.badgeInk='';out.normalPrice=0}
    await onSave(out)}finally{setSaving(false)}};
  return <Modal title={data?'Edit Produk':'Tambah Produk'} onClose={onClose}>
    <form onSubmit={submit} className="space-y-4">
      <div className="space-y-3">
        {(f.images||[]).length?<div className="grid grid-cols-3 gap-2">{f.images.map((src,i)=><div key={i} className="relative aspect-square rounded-xl overflow-hidden bg-slate-100">
          {isVideoSrc(src)?<><video src={src} muted playsInline preload="metadata" className="w-full h-full object-cover"/><span className="absolute inset-0 flex items-center justify-center pointer-events-none"><span className="w-8 h-8 rounded-full bg-slate-900/60 text-white flex items-center justify-center text-xs">▶</span></span></>:<img src={src} className="w-full h-full object-cover"/>}

          <button type="button" aria-label="Hapus media" onClick={()=>rmPhoto(i)} className="absolute right-1 top-1 w-6 h-6 rounded-full bg-slate-900/70 text-white flex items-center justify-center"><Icon name="x" size={13}/></button>
        </div>)}</div>:<div className="flex justify-center"><div className="w-24 h-24 rounded-2xl bg-slate-100 flex items-center justify-center"><Icon name="shirt" size={30}/></div></div>}
        <div className="text-xs text-slate-400 text-center">{(f.images||[]).length}/8 foto &amp; video · yang pertama jadi sampul di toko</div>

      {data&&<button type="button" onClick={()=>setShowDisc(s=>!s)} className="w-full flex items-center justify-between gap-2 px-3.5 h-11 rounded-xl bg-slate-50 hover:bg-slate-100 transition text-sm font-semibold text-slate-600">
        <span className="flex items-center gap-2"><Icon name="tag" size={16}/><span>Diskon{hasDisc?` — ${discMode==='rp'?money(discAmt):discPct+'%'} (${money(finalPrice)})`:' (opsional)'}</span></span>
        <Icon name={showDisc?'x':'plus'} size={16}/>
      </button>}
      {data&&showDisc&&<div className="space-y-1.5 fade-in">
        <div className="flex items-center justify-between">
          <span className="block text-xs font-bold text-slate-500">Jenis diskon</span>
          <div className="flex bg-slate-100 rounded-lg p-0.5">
            <button type="button" onClick={()=>switchDiscMode('rp')} className={`px-3 h-7 rounded-md text-xs font-bold transition ${discMode==='rp'?'bg-white shadow text-slate-900':'text-slate-500'}`}>Rp</button>
            <button type="button" onClick={()=>switchDiscMode('persen')} className={`px-3 h-7 rounded-md text-xs font-bold transition ${discMode==='persen'?'bg-white shadow text-slate-900':'text-slate-500'}`}>%</button>
          </div>

        <div className="relative">
          {discMode==='rp'&&<span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm">Rp</span>}
          <input type="text" inputMode="numeric" value={discMode==='rp'?formatThousand(discValue):(discValue||'')} onChange={e=>{const raw=parseNum(e.target.value);setDiscValue(discMode==='rp'?Math.min(raw,Math.max(0,basePrice-1)):Math.min(99,raw))}} placeholder="0" className={`w-full h-11 rounded-xl border border-slate-200 bg-white outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 ${discMode==='rp'?'pl-8 pr-3':'pl-3 pr-8 text-right'}`}/>

function SkuScanModal({onClose,onDetected}){
  const videoRef=useRef(null), streamRef=useRef(null), timerRef=useRef(null);
  const [status,setStatus]=useState('Menyiapkan kamera…');
  const [manual,setManual]=useState('');
  const activeRef=useRef(true), doneRef=useRef(false);

  const detected=(code)=>{
    if(doneRef.current) return;
    const clean=String(code).trim();
    if(!clean) return;
    doneRef.current=true;
    beep('success');
    cleanup();
    onDetected(clean);
  };
  const cleanup=()=>{activeRef.current=false;if(timerRef.current)cancelAnimationFrame(timerRef.current);streamRef.current?.getTracks().forEach(t=>t.stop())};
  useEffect(()=>{
    activeRef.current=true;
    (async()=>{
      try{
        if(!navigator.mediaDevices?.getUserMedia) throw new Error('Kamera tidak didukung browser');
        const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
        if(!activeRef.current)return;s.getTracks().forEach(t=>t.enabled=true);streamRef.current=s;videoRef.current.srcObject=s;await videoRef.current.play();
        if('BarcodeDetector' in window){
          const formats=await BarcodeDetector.getSupportedFormats();
          const detector=new BarcodeDetector({formats:formats.filter(f=>['code_128','code_39','ean_13','ean_8','upc_a','upc_e','qr_code'].includes(f))});
          const scan=async()=>{if(!activeRef.current||doneRef.current)return;try{const codes=await detector.detect(videoRef.current);if(codes.length){detected(codes[0].rawValue)}}catch(e){}if(!doneRef.current)timerRef.current=requestAnimationFrame(scan)};
          timerRef.current=requestAnimationFrame(scan);setStatus('Arahkan barcode ke kotak pemindai.');
        }else setStatus('BarcodeDetector belum tersedia. Ketik SKU manual.');
      }catch(e){setStatus('Kamera tidak dapat diakses. Cek izin kamera atau ketik SKU manual.')}
    })();
    return cleanup;
  },[]);
  return <Modal title="Scan Barcode untuk SKU" onClose={()=>{cleanup();onClose()}}>
    <div className="space-y-4">
      <div className="relative rounded-2xl overflow-hidden bg-slate-950 aspect-video flex items-center justify-center"><video ref={videoRef} playsInline muted className="w-full h-full object-cover"/><div className="absolute inset-1/4 scan-box rounded-2xl pointer-events-none"></div><div className="absolute bottom-3 left-0 right-0 text-center text-xs font-semibold text-white drop-shadow px-3">{status}</div></div>
      <div className="flex gap-2"><input autoFocus value={manual} onChange={e=>setManual(e.target.value)} onKeyDown={e=>e.key==='Enter'&&detected(manual)} placeholder="Ketik / scan SKU (auto Enter)…" className="flex-1 min-w-0 h-11 px-3 rounded-xl border border-slate-200 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"/><Button onClick={()=>detected(manual)} className="shrink-0">Pakai</Button></div>
      <div className="text-xs text-slate-400 text-center">Barcode fisik (label baju/kemasan) atau alat scanner USB/Bluetooth juga bisa langsung diketik ke kolom di atas.</div>
    </div>
  </Modal>
}

 text-sm text-right outline-none focus:border-indigo-500"/>{da>0&&<button type="button" onClick={()=>{setItemDisc(x=>{const n={...x};delete n[p.id];return n});setOpenDisc(null)}} className="text-xs font-bold text-slate-400 hover:text-red-600 shrink-0">Hapus</button>}</div>}</div>})}{!items.length&&<Empty text="Belum ada barang. Cari SKU atau scan barcode."/>}</div>

        <button type="button" onClick={()=>setShowDiscount(s=>!s)} className="w-full flex items-center justify-between gap-2 px-3.5 h-11 rounded-xl bg-white hover:bg-slate-100 border border-slate-200 transition text-sm font-semibold text-slate-600">
          <span className="flex items-center gap-2"><Icon name="tag" size={16}/><span>Diskon transaksi{discountClamped>0?` — ${money(discountClamped)}`:' (opsional)'}</span></span>

function ScannerModal({products,onClose,onFound,title='Scan Barcode',finishLabel='Lanjut ke Pembayaran',finishIcon='cart'}){
  const videoRef=useRef(null), streamRef=useRef(null), timerRef=useRef(null);
  const [status,setStatus]=useState('Menyiapkan kamera…');
  const [manual,setManual]=useState('');
  const [cart,setCart]=useState([]);
  const activeRef=useRef(true), cooldownRef=useRef(false);
  const cartRef=useRef(cart); cartRef.current=cart;

  const find=(code)=>{
    if(cooldownRef.current) return;
    const clean=String(code).trim();
    if(!clean) return;
    const p=products.find(x=>String(x.sku).toLowerCase()===clean.toLowerCase());
    if(!p){ beep('error'); setStatus(`SKU "${clean}" tidak ditemukan.`); return; }
    if(p.status==='sold'){ beep('error'); setStatus(`"${p.name}" sudah terjual sebelumnya.`); return; }
    if(cartRef.current.some(x=>x.id===p.id)){ beep('error'); setStatus(`"${p.name}" sudah ada di keranjang.`); return; }
    beep('success');
    setCart(x=>[...x,p]);
    setStatus(`✓ Ditambahkan: ${p.name}`);
    setManual('');
    cooldownRef.current=true;
    setTimeout(()=>{ cooldownRef.current=false; if(activeRef.current) setStatus('Arahkan barcode berikutnya ke kotak pemindai.'); },900);
  };
  const removeFromCart=id=>setCart(x=>x.filter(p=>p.id!==id));
  const cleanup=()=>{activeRef.current=false;if(timerRef.current)cancelAnimationFrame(timerRef.current);streamRef.current?.getTracks().forEach(t=>t.stop())};
  useEffect(()=>{
    activeRef.current=true;
    (async()=>{
      try{
        if(!navigator.mediaDevices?.getUserMedia) throw new Error('Kamera tidak didukung browser');
        const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
        if(!activeRef.current)return;s.getTracks().forEach(t=>t.enabled=true);streamRef.current=s;videoRef.current.srcObject=s;await videoRef.current.play();
        if('BarcodeDetector' in window){
          const formats=await BarcodeDetector.getSupportedFormats();
          const detector=new BarcodeDetector({formats:formats.filter(f=>['code_128','code_39','ean_13','ean_8','upc_a','upc_e','qr_code'].includes(f))});
          const scan=async()=>{if(!activeRef.current)return;try{const codes=await detector.detect(videoRef.current);if(codes.length){find(codes[0].rawValue)}}catch(e){}timerRef.current=requestAnimationFrame(scan)};
          timerRef.current=requestAnimationFrame(scan);setStatus('Arahkan barcode ke kotak pemindai.');
        }else setStatus('BarcodeDetector belum tersedia. Masukkan SKU manual.');
      }catch(e){setStatus('Kamera tidak dapat diakses. Cek izin kamera atau gunakan SKU manual.')}
    })();
    return cleanup;
  },[]);
  const total=cart.reduce((a,p)=>a+p.price,0);
  const finish=()=>{ if(!cart.length) return; cleanup(); onFound(cart); };
  return <Modal title={title} onClose={()=>{cleanup();onClose()}}>
    <div className="space-y-4">
      <div className="relative rounded-2xl overflow-hidden bg-slate-950 aspect-video flex items-center justify-center"><video ref={videoRef} playsInline muted className="w-full h-full object-cover"/><div className="absolute inset-1/4 scan-box rounded-2xl pointer-events-none"></div><div className="absolute bottom-3 left-0 right-0 text-center text-xs font-semibold text-white drop-shadow px-3">{status}</div></div>
      <div className="flex gap-2"><input autoFocus value={manual} onChange={e=>setManual(e.target.value)} onKeyDown={e=>e.key==='Enter'&&find(manual)} placeholder="Ketik / scan SKU (auto Enter)…" className="flex-1 min-w-0 h-11 px-3 rounded-xl border border-slate-200 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"/><Button onClick={()=>find(manual)} className="shrink-0">Tambah</Button></div>
      <div className="flex items-center justify-between"><div className="text-xs font-bold text-slate-500">Keranjang scan ({cart.length})</div>{cart.length>0 && <div className="text-sm font-black">{money(total)}</div>}</div>
      <div className="border border-slate-100 rounded-2xl overflow-hidden max-h-48 overflow-y-auto">
        {cart.map(p=><div key={p.id} className="flex items-center gap-3 p-3 border-b last:border-0"><div className="w-9 h-9 rounded-lg bg-slate-100 flex items-center justify-center shrink-0">{p.image?<img src={p.image} className="w-9 h-9 rounded-lg object-cover"/>:<Icon name="shirt" size={16}/>}</div><div className="flex-1 min-w-0"><b className="text-sm block truncate">{p.name}</b><div className="text-xs text-slate-400 truncate">{p.sku}</div></div><b className="shrink-0 text-sm">{money(p.price)}</b><button type="button" onClick={()=>removeFromCart(p.id)} aria-label="Hapus dari keranjang" className="p-1.5 text-red-500 shrink-0 active:scale-95 transition"><Icon name="x" size={16}/></button></div>)}
        {!cart.length&&<div className="p-4 text-xs text-slate-400 text-center">Scan barcode tiap barang satu per satu, kamera tidak akan tertutup. Ketika sudah selesai, klik "{finishLabel}".</div>}
      </div>
      <Button disabled={!cart.length} onClick={finish} className="w-full" variant="green"><Icon name={finishIcon} size={18}/><span>{finishLabel}{cart.length?` (${cart.length} barang)`:''}</span></Button>
    </div>
  </Modal>
}

function ReceiptLines({lines,width}){

  });
}

        <b>Cetak langsung Bluetooth</b> mengirim data mentah (ESC/POS) langsung ke printer thermal lewat Web Bluetooth — hanya jalan di Chrome/Edge Android dan printer yang kompatibel BLE. Karena mode ini teks murni, logo tidak ikut tercetak, tapi nama toko &amp; tulisan LUNAS/DIBATALKAN tetap tercetak besar/tebal.

}


const BADGE_TONES=[['coral','Coral','#e8715a'],['red','Merah','#d64545'],['amber','Kuning','#d89a1c'],['green','Hijau','#2f8f5b'],['blue','Biru','#2f6fdb'],['purple','Ungu','#7c4dcc'],['pink','Pink','#d9528f'],['dark','Gelap','#1f2f29']];
const BADGE_PRESETS=['Diskon','Limited','Baru','Sale'];
// "Diskon 20%" (persen) atau "Diskon Rp 15.000" (nominal)
function parseDiskonBadge(b){const t=String(b||'').trim();let m=t.match(/^Diskon\s+(\d{1,2})%$/i);if(m)return{mode:'persen',val:Number(m[1])};m=t.match(/^Diskon\s+Rp\s?([\d.]+)$/i);if(m){const v=Number(m[1].replace(/\./g,''));if(v>0)return{mode:'rp',val:v}}return null}
const BADGE_HEX=/^#[0-9a-f]{6}([0-9a-f]{2})?$/i;
const BADGE_WHITE='#ffffffe6'; // putih 90% + teks gelap, sama seperti label BARU otomatis
function badgeCss(color,inkPref){
  if(color===BADGE_WHITE)return{background:'rgba(255,255,255,.9)',color:'#17231f'};
  let bg='#e8715a',a=1;
  const t=BADGE_TONES.find(x=>x[0]===color);
  if(t)bg=t[2];else if(BADGE_HEX.test(color||'')){bg='#'+color.slice(1,7);a=color.length===9?parseInt(color.slice(7),16)/255:1}
  const n=parseInt(bg.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;
  const lum=(0.299*r+0.587*g+0.114*b)/255;
  const ink=(inkPref==='dark'||inkPref==='light')?inkPref:(a>=0.5&&lum>0.62?'dark':'light');
  const inkHex=ink==='dark'?'#1f2f29':'#ffffff';
  const st={background:`rgba(${r},${g},${b},${Math.round(a*100)/100})`,color:inkHex};
  if(a<0.3)st.border=`1px solid ${inkHex}`;
  if(ink==='light'&&a<0.6)st.textShadow='0 1px 3px rgba(0,0,0,.6)';
  return st;
}
