const {useEffect, useMemo, useRef, useState} = React;

const DB_NAME = 'r-preloved-db';
const DB_VERSION = 2;
const STORES = ['products','sales','expenses','settings','stocktakes','syncQueue'];

let dbPromise = null;
function getDB(){
  if(dbPromise) return dbPromise;
  dbPromise = new Promise((resolve,reject)=>{
    if(!window.indexedDB){ reject(new Error('IndexedDB tidak didukung browser ini')); return; }
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      STORES.forEach(s => {
        if(!db.objectStoreNames.contains(s)) db.createObjectStore(s,{keyPath:'id',autoIncrement:true});
      });
    };
    req.onblocked = () => console.warn('R-Preloved: IndexedDB blocked (kemungkinan ada tab lain terbuka).');
    req.onsuccess = () => {
      const db = req.result;
      db.onversionchange = () => { db.close(); dbPromise = null; };
      db.onclose = () => { dbPromise = null; };
      resolve(db);
    };
    req.onerror = () => reject(req.error || new Error('IndexedDB unavailable'));
  });
  dbPromise.catch(()=>{ dbPromise = null; });
  return dbPromise;
}
let idbSupported = true;
const memStore = {products:[],sales:[],expenses:[],stocktakes:[],settings:[]};
async function idbOp(fn){
  const db = await getDB();
  return await fn(db);
}
async function dbAll(store){
  try{
    const rows = await idbOp(db=>new Promise((resolve,reject)=>{
      const tx=db.transaction(store,'readonly'), req=tx.objectStore(store).getAll();
      req.onsuccess=()=>resolve(req.result||[]);
      req.onerror=()=>reject(req.error);
    }));
    idbSupported = true;
    return rows;
  }catch(err){
    console.warn('R-Preloved: gagal membaca dari IndexedDB, memakai penyimpanan sementara.', err);
    idbSupported = false;
    return memStore[store]||(memStore[store]=[]);
  }
}

  const record = {...value, id: value.id||uid()};

    await idbOp(db=>new Promise((resolve,reject)=>{
      const tx=db.transaction(store,'readwrite'), req=tx.objectStore(store).put(record);
      req.onsuccess=()=>resolve(req.result); req.onerror=()=>reject(req.error);
    }));
    idbSupported = true;
    enqueueSync(store,'upsert',record.id);
    return record.id;
  }catch(err){
    console.warn('R-Preloved: gagal menyimpan ke IndexedDB, memakai penyimpanan sementara.', err);
    idbSupported = false;
    const list=memStore[store]||(memStore[store]=[]);
    const idx=list.findIndex(x=>x.id===record.id);
    if(idx>=0) list[idx]=record; else list.push(record);
    return record.id;
  }

      || (Number(a.seq)||0)-(Number(b.seq)||0)

  if(!SYNCABLE_STORES.includes(store)) return;
  dbPutRaw('syncQueue',{store,action,recordId,ts:Date.now(),seq:++syncSeq})
    .then(refreshPendingCount)
    .then(()=>flushSyncQueue())
    .catch(err=>{ console.warn('R-Preloved: gagal mencatat antrian sync.',err); syncState={...syncState,lastError:String(err.message||err)}; emitSyncState(); });
}

  const json = await res.json().catch(()=>null);
  if(!res.ok || !json?.secure_url) throw new Error(json?.error?.message || 'Upload ke Cloudinary gagal');

}

async function pushUpsert(store,recordId){
  const url = syncSettings.backendUrls[store];
  if(!url) throw new Error(`URL backend untuk "${store}" belum diisi di Pengaturan.`);
  const rows = await dbAll(store);
  const record = rows.find(r=>String(r.id)===String(recordId));
  if(!record) return;
  let next=record, patched=false;
  if(store==='products' && next.image && String(next.image).startsWith('data:')){
    next={...next, image: await uploadToCloudinary(next.image)}; patched=true;
  }
  if(store==='sales' && next.receipt && String(next.receipt).startsWith('data:')){
    next={...next, receipt: await uploadToCloudinary(next.receipt)}; patched=true;
  }
  if(patched) await dbPutRaw(store,next);
  const payload = flattenForSheet(store,next);
  await postToBackend(url, {_action:'upsert', _id:recordId, data:payload});
  knownRemoteIds[store]?.add(String(recordId));
}

const SUMMARY_MIN_GAP_MS = 25000;
let summaryDebounceTimer = null;
let summaryPendingPayload = null;
let lastSummaryPushAt = 0;
function schedulePushSummary(payload){
  if(!syncSettings.backendUrls.summary) return;
  summaryPendingPayload = payload;
  if(summaryDebounceTimer) clearTimeout(summaryDebounceTimer);
  const sinceLast = Date.now()-lastSummaryPushAt;
  const wait = Math.max(4000, SUMMARY_MIN_GAP_MS-sinceLast>0 ? SUMMARY_MIN_GAP_MS-sinceLast : 4000);
  summaryDebounceTimer = setTimeout(()=>{
    summaryDebounceTimer=null;
    const p=summaryPendingPayload; summaryPendingPayload=null;
    lastSummaryPushAt=Date.now();
    pushSummary(p);
  }, wait);
}

let flushing = false;
async function flushSyncQueue(){
  if(flushing) return;
  if(!navigator.onLine) return;
  flushing=true; syncState={...syncState,syncing:true}; emitSyncState();
  try{
    while(true){
      const queue=await dbAll('syncQueue');
      queue.sort(syncQueueCompare);
      const item=queue[0];
      if(!item){ syncState={...syncState,lastError:''}; break; }
      try{
        if(item.action==='delete') await pushDelete(item.store,item.recordId);
        else await pushUpsert(item.store,item.recordId);
        await dbDeleteRaw('syncQueue',item.id);
      }catch(err){
        console.warn('R-Preloved sync: gagal, akan dicoba lagi nanti.',err);
        syncState={...syncState,lastError:String(err.message||err)};
        break;
      }
      await refreshPendingCount();
    }
  }finally{
    flushing=false; syncState={...syncState,syncing:false}; emitSyncState();
    await refreshPendingCount();
  }
}

function isTruthyFlag(v){ return v===true || v==='TRUE' || v==='true' || v===1 || v==='1'; }
function isValidSyncedRecord(store, r){

function unflattenFromSheet(store,raw){
  const r={...raw};
  if(store==='sales' && typeof r.items==='string'){ try{ r.items=JSON.parse(r.items)||[]; }catch(e){ r.items=[]; } }
  if(store==='stocktakes' && typeof r.entries==='string'){ try{ r.entries=JSON.parse(r.entries)||[]; }catch(e){ r.entries=[]; } }
  (NUMERIC_FIELDS[store]||[]).forEach(f=>{

  });

    if(raw.cancelledAt===undefined || raw.cancelledAt==='') r.cancelledAt=undefined; else r.cancelledAt=Number(raw.cancelledAt);

function jsonpFetch(url, timeoutMs=20000){
  return new Promise((resolve,reject)=>{
    const cbName = '__gasCb_' + Math.random().toString(36).slice(2);
    const script = document.createElement('script');
    const cleanup = ()=>{ delete window[cbName]; script.remove(); };
    const timer = setTimeout(()=>{ cleanup(); reject(new Error('Timeout mengambil data dari backend')); }, timeoutMs);
    window[cbName] = (data)=>{ clearTimeout(timer); cleanup(); resolve(data); };
    script.onerror = ()=>{ clearTimeout(timer); cleanup(); reject(new Error('Gagal memuat data dari backend')); };
    script.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cbName;
    document.head.appendChild(script);
  });
}
async function pullStore(store){
  const url = syncSettings.backendUrls[store];
  if(!url) return;
  const rows = await jsonpFetch(url);
  if(!Array.isArray(rows)) return;
  const local = await dbAll(store);
  const localById = new Map(local.map(r=>[String(r.id),r]));
  for(const raw of rows){
    if(!raw || !raw.id) continue;
    const remote = unflattenFromSheet(store,raw);
    knownRemoteIds[store]?.add(String(remote.id));
    const localRec = localById.get(String(remote.id));
    if(remote.deleted){
      if(localRec) await dbDeleteRaw(store,localRec.id);
      continue;
    }
    if(!isValidSyncedRecord(store,remote)) continue;
    const remoteTs = Number(remote.updatedAt)||0;
    const localTs = localRec ? (Number(localRec.updatedAt)||0) : -1;
    if(!localRec || remoteTs>localTs){
      await dbPutRaw(store,{...remote,id:localRec?localRec.id:remote.id});
    }
  }
}

  if(!navigator.onLine) return;

}

function beep(kind='success'){
  try{
    const Ctx = window.AudioContext||window.webkitAudioContext;
    if(!Ctx) return;
    if(!sharedAudioCtx) sharedAudioCtx = new Ctx();
    const ctx = sharedAudioCtx;
    if(ctx.state==='suspended') ctx.resume();
    const now = ctx.currentTime;
    const tone=(freq,start,dur,type='sine',vol=0.4)=>{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type=type; o.frequency.setValueAtTime(freq, now+start);
      g.gain.setValueAtTime(0, now+start);
      g.gain.linearRampToValueAtTime(vol, now+start+0.006);
      g.gain.exponentialRampToValueAtTime(0.001, now+start+dur);
      o.connect(g); g.connect(ctx.destination);
      o.start(now+start); o.stop(now+start+dur+0.03);
    };
    if(kind==='success'){
      tone(1318.5, 0, 0.1, 'sine', 0.5);
      tone(1975.5, 0.08, 0.16, 'sine', 0.45);
    }else{

    }
  }catch(e){}
}

function wrapLine(s,width){
  s=String(s||'');
  const out=[];
  while(s.length>width){ out.push(s.slice(0,width)); s=s.slice(width); }
  out.push(s);
  return out;
}
function padRow(left,right,width){
  left=String(left||''); right=String(right||'');
  if(left.length+right.length+1>width) left=left.slice(0,Math.max(0,width-right.length-1));
  const spaces=Math.max(1,width-left.length-right.length);
  return left+' '.repeat(spaces)+right;
}

function buildReceiptLines(sale,settings){
  const width = settings.paperWidth===58?32:48;
  const div = decoDivider(width);
  const lines=[];
  lines.push({type:'text',t:(settings.storeName||'Toko').toUpperCase(),align:'center',bold:true,big:true});
  if(settings.storeAddress) wrapLine(settings.storeAddress,width).forEach(l=>lines.push({type:'text',t:l,align:'center'}));
  if(settings.storePhone) lines.push({type:'text',t:settings.storePhone,align:'center'});
  lines.push({type:'div',t:div});
  lines.push({type:'text',t:dateText(sale.date),align:'center'});
  lines.push({type:'text',t:`No. Transaksi #${String(sale.id).slice(0,8).toUpperCase()}`,align:'center'});
  lines.push({type:'div',t:div});
  sale.items.forEach((it,idx)=>{
    const left=it.name, right=moneyPlain(it.price);
    lines.push({type:'row',left,right,t:padRow(left,right,width)});
    lines.push({type:'text',t:`• ${it.sku||'-'}`});
    if(idx<sale.items.length-1) lines.push({type:'blank',t:''});
  });
  lines.push({type:'div',t:div});
  if(sale.discount>0){
    const sub=sale.subtotal!=null?sale.subtotal:sale.total+sale.discount;
    lines.push({type:'row',left:'Subtotal',right:moneyPlain(sub),t:padRow('Subtotal',moneyPlain(sub),width)});
    lines.push({type:'row',left:'Diskon',right:`-${moneyPlain(sale.discount)}`,t:padRow('Diskon',`-${moneyPlain(sale.discount)}`,width)});
  }
  lines.push({type:'row',left:'TOTAL',right:`Rp ${moneyPlain(sale.total)}`,bold:true,t:padRow('TOTAL',`Rp ${moneyPlain(sale.total)}`,width)});
  lines.push({type:'row',left:'Pembayaran',right:sale.payment,t:padRow('Pembayaran',sale.payment,width)});
  if(sale.payment==='CASH'){
    lines.push({type:'row',left:'Tunai',right:`Rp ${moneyPlain(sale.paid)}`,t:padRow('Tunai',`Rp ${moneyPlain(sale.paid)}`,width)});
    lines.push({type:'row',left:'Kembali',right:`Rp ${moneyPlain(sale.change)}`,t:padRow('Kembali',`Rp ${moneyPlain(sale.change)}`,width)});
  }
  lines.push({type:'div',t:div});
  if(sale.cancelled){
    lines.push({type:'text',t:'*** DIBATALKAN ***',align:'center',bold:true,big:true});
    lines.push({type:'blank',t:''});
  }
  lines.push({type:'text',t:'Struk Bukti Pembayaran',align:'center'});
  lines.push({type:'text',t:'Terima Kasih!',align:'center',bold:true});
  return {lines,width};
}
function buildEscPos(sale,settings){
  const {lines,width}=buildReceiptLines(sale,settings);
  const bytes=[];
  const enc=s=>bytes.push(...new TextEncoder().encode(s));
  const ESC=0x1B, GS=0x1D;
  bytes.push(ESC,0x40);
  let curAlign=null, curBold=null, curBig=null;
  lines.forEach(l=>{
    const align=l.align||'left', bold=!!l.bold, big=!!l.big;
    if(align!==curAlign){ bytes.push(ESC,0x61,align==='center'?1:align==='right'?2:0); curAlign=align; }
    if(bold!==curBold){ bytes.push(ESC,0x45,bold?1:0); curBold=bold; }
    if(big!==curBig){ bytes.push(GS,0x21,big?0x11:0x00); curBig=big; }
    enc(l.t+'\n');
  });
  bytes.push(GS,0x21,0x00); bytes.push(ESC,0x45,0); bytes.push(ESC,0x61,0);
  enc('\n\n\n');
  bytes.push(GS,0x56,0x42,0x00);
  return new Uint8Array(bytes);
}

const BT_PRINTER_CANDIDATES = [
  {service:'000018f0-0000-1000-8000-00805f9b34fb', characteristic:'00002af1-0000-1000-8000-00805f9b34fb'},
  {service:'49535343-fe7d-4ae5-8fa9-9fafd205e455', characteristic:'49535343-8841-43f4-a8d4-ecbe34729bb3'},

async function printEscPosBluetooth(bytes,onStatus){
  if(!navigator.bluetooth) throw new Error('Web Bluetooth tidak didukung di browser/perangkat ini. Pakai Chrome di Android, atau gunakan tombol "Cetak (Print biasa)".');
  onStatus?.('Pilih printer Bluetooth…');
  const device = await navigator.bluetooth.requestDevice({acceptAllDevices:true, optionalServices: BT_PRINTER_CANDIDATES.map(c=>c.service)});
  onStatus?.('Menghubungkan ke '+(device.name||'printer')+'…');
  const server = await device.gatt.connect();
  let writeChar=null;
  for(const cand of BT_PRINTER_CANDIDATES){
    try{ const svc=await server.getPrimaryService(cand.service); writeChar=await svc.getCharacteristic(cand.characteristic); break; }catch(e){}
  }
  if(!writeChar){
    try{
      const services=await server.getPrimaryServices();
      for(const svc of services){
        const chars=await svc.getCharacteristics();
        const found=chars.find(c=>c.properties.write||c.properties.writeWithoutResponse);
        if(found){writeChar=found;break;}
      }
    }catch(e){}
  }
  if(!writeChar){ device.gatt.disconnect(); throw new Error('Printer terhubung tapi tidak ditemukan channel cetak yang cocok (bukan printer ESC/POS?). Coba tombol "Cetak (Print biasa)".'); }
  onStatus?.('Mengirim data ke printer…');
  const CHUNK=180;
  for(let i=0;i<bytes.length;i+=CHUNK){
    const chunk=bytes.slice(i,i+CHUNK);
    if(writeChar.properties.writeWithoutResponse) await writeChar.writeValueWithoutResponse(chunk);
    else await writeChar.writeValue(chunk);
    await new Promise(r=>setTimeout(r,25));
  }
  onStatus?.('Struk terkirim ke printer.');
  try{device.gatt.disconnect();}catch(e){}
}

function wrapCanvasText(text,maxWidth,font){

  const lines=[]; let cur='';
  words.forEach(w=>{

    if(tmp.measureText(test).width>maxWidth && cur){ lines.push(cur); cur=w; } else cur=test;
  });

}
async function renderLabelCanvas({product,settings,mode,showName,showPrice}){
  const dotWidth = settings.paperWidth===58?384:576;
  const scale = dotWidth/384;
  const codeCanvas=document.createElement('canvas');
  const sku=String(product.sku||product.name||'');
  if(mode==='qr'){
    if(typeof window.qrcode!=='function') throw new Error('Library QR Code belum termuat. Muat ulang halaman.');
    if(!sku) throw new Error('SKU/nama produk kosong, tidak bisa membuat QR.');
    const qr=window.qrcode(0,'M');
    qr.addData(sku);
    qr.make();
    const count=qr.getModuleCount();
    const marginModules=2;
    const targetSize=Math.round(150*scale);
    const cell=Math.max(1,Math.floor(targetSize/(count+marginModules*2)));
    const size=cell*(count+marginModules*2);
    codeCanvas.width=size; codeCanvas.height=size;
    const qctx=codeCanvas.getContext('2d');
    qctx.fillStyle='#fff'; qctx.fillRect(0,0,size,size);
    qctx.fillStyle='#000';
    for(let r=0;r<count;r++){
      for(let c=0;c<count;c++){
        if(qr.isDark(r,c)) qctx.fillRect((c+marginModules)*cell,(r+marginModules)*cell,cell,cell);
      }
    }
  }else{
    if(!window.JsBarcode) throw new Error('Library Barcode belum termuat. Cek koneksi internet lalu buka ulang halaman.');
    JsBarcode(codeCanvas, sku, {format:'CODE128', width:Math.max(1,Math.round(2*scale)), height:Math.round(60*scale), displayValue:true, fontSize:Math.round(13*scale), margin:4, background:'#ffffff'});
  }
  const padding=Math.round(10*scale);
  const nameFont=`bold ${Math.round(15*scale)}px sans-serif`;
  const priceFont=`bold ${Math.round(20*scale)}px sans-serif`;
  const nameLines = showName ? wrapCanvasText(product.name,dotWidth-2*padding,nameFont) : [];
  const lineH=Math.round(19*scale), priceH=showPrice?Math.round(24*scale):0;
  const topH = padding + nameLines.length*lineH + priceH + Math.round(6*scale);
  const canvas=document.createElement('canvas');
  canvas.width=dotWidth; canvas.height=topH+codeCanvas.height+padding;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='#000'; ctx.textAlign='center';
  let y=padding;
  if(showName){
    ctx.font=nameFont;
    nameLines.forEach(line=>{ y+=lineH; ctx.fillText(line, canvas.width/2, y); });
  }
  if(showPrice){
    ctx.font=priceFont; y+=priceH;
    ctx.fillText(money(product.price), canvas.width/2, y);
  }
  ctx.drawImage(codeCanvas, Math.round((canvas.width-codeCanvas.width)/2), topH);
  return canvas;
}
function canvasToEscPosRaster(canvas){
  const ctx=canvas.getContext('2d');
  const w=canvas.width, h=canvas.height;
  const img=ctx.getImageData(0,0,w,h).data;
  const bytesPerRow=Math.ceil(w/8);
  const data=new Uint8Array(bytesPerRow*h);
  for(let y=0;y<h;y++){
    for(let xByte=0;xByte<bytesPerRow;xByte++){
      let byte=0;
      for(let bit=0;bit<8;bit++){
        const x=xByte*8+bit;
        let on=0;
        if(x<w){
          const i=(y*w+x)*4;
          const lum=img[i]*0.299+img[i+1]*0.587+img[i+2]*0.114;
          on = (img[i+3]>10 && lum<160) ? 1:0;
        }
        byte |= on<<(7-bit);
      }
      data[y*bytesPerRow+xByte]=byte;
    }
  }
  const xL=bytesPerRow&0xFF, xH=(bytesPerRow>>8)&0xFF, yL=h&0xFF, yH=(h>>8)&0xFF;
  return new Uint8Array([0x1D,0x76,0x30,0x00,xL,xH,yL,yH,...data]);
}

    camera:<><path d="M3 8a2 2 0 0 1 2-2h3l1.5-2h5L16 6h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><circle cx="12" cy="12.5" r="3.5"/></>,
    plus:<><path d="M12 5v14M5 12h14"/></>,
    search:<><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></>,
    x:<><path d="m6 6 12 12M18 6 6 18"/></>,
    check:<path d="m5 12 4 4L19 6"/>,
    trash:<><path d="M4 7h16M10 11v6M14 11v6"/><path d="M6 7l1 14h10l1-14M9 7V4h6v3"/></>,
    edit:<><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></>,
    receipt:<><path d="M5 3h14v18l-3-2-4 2-4-2-3 2Z"/><path d="M8 8h8M8 12h8M8 16h5"/></>,
    trend:<><path d="m3 17 6-6 4 4 8-9"/><path d="M15 6h6v6"/></>,
    box:<><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 8 9 5 9-5M3 8v8l9 5 9-5V8"/></>,
    settings:<><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-1.8 1.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5v.2h-2.6v-.2a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1-1.8-1.8.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H6.3v-2.6h.2a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1 1.8-1.8.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.5v-.2H15v.2a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1 1.8 1.8-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.5 1h.2v2.6h-.2a1.7 1.7 0 0 0-1.5 1Z"/></>,
    menu:<><path d="M4 6h16M4 12h16M4 18h16"/></>,
    download:<><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></>,
    upload:<><path d="M12 21V9M7 14l5-5 5 5M5 3h14"/></>,
    calendar:<><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 9h18"/></>,
    printer:<><path d="M6 9V3h12v6"/><path d="M6 18H4a1 1 0 0 1-1-1v-6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v6a1 1 0 0 1-1 1h-2"/><path d="M6 14h12v7H6Z"/></>,
    bluetooth:<path d="m6.5 6.5 11 11L12 23V1l5.5 5.5-11 11"/>,
    tag:<><path d="M20.59 13.41 11 3.83A2 2 0 0 0 9.59 3H4a1 1 0 0 0-1 1v5.59a2 2 0 0 0 .83 1.41l9.58 9.58a2 2 0 0 0 2.83 0l4.35-4.35a2 2 0 0 0 0-2.82Z"/><circle cx="7.5" cy="7.5" r="1.3" fill="currentColor" stroke="none"/></>,
    percent:<><path d="M19 5 5 19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></>,
    backup:<><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 21h16"/></>,
    refresh:<><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/><path d="M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></>,
    barcode:<path d="M3 4v16M7 4v16M10 4v16M12.5 4v16M16 4v16M19 4v16M21 4v16"/>,
    qrcode:<><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3z"/><path d="M19 14v3M14 19h2M19 19h2"/></>,
    chevronLeft:<path d="M15 18l-6-6 6-6"/>
  };
  return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={stroke} strokeLinecap="round" strokeLinejoin="round" className={`shrink-0 ${className}`}>{paths[name]}</svg>
}

function Button({children,variant='primary',className='',...p}){
  const c={primary:'bg-slate-900 text-white hover:bg-slate-800',soft:'bg-slate-100 text-slate-800 hover:bg-slate-200',outline:'border border-slate-200 bg-white hover:bg-slate-50 text-slate-800',danger:'bg-red-50 text-red-600 hover:bg-red-100',green:'bg-emerald-600 text-white hover:bg-emerald-700'}[variant];
  return <button {...p} className={`inline-flex items-center justify-center gap-2 whitespace-nowrap min-h-[42px] px-4 rounded-xl font-semibold text-sm transition active:scale-[.98] disabled:opacity-50 disabled:pointer-events-none ${c} ${className}`}>{children}</button>
}
function Field({label,...p}){return <label className="block"><span className="block text-xs font-bold text-slate-500 mb-1.5">{label}</span><input {...p} className={`w-full h-11 px-3 rounded-xl border border-slate-200 bg-white outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 ${p.className||''}`}/></label>}
function NumberField({label,value,onChange,placeholder,required,prefix}){
  return <label className="block">
    <span className="block text-xs font-bold text-slate-500 mb-1.5">{label}</span>
    <div className="relative">
      {prefix&&<span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm">{prefix}</span>}
      <input type="text" inputMode="numeric" value={formatThousand(value)} onChange={e=>onChange(parseNum(e.target.value))} placeholder={placeholder} required={required} className={`w-full h-11 px-3 rounded-xl border border-slate-200 bg-white outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 ${prefix?'pl-8':''}`}/>
    </div>
  </label>
}
function SearchInput({className='',...p}){
  return <div className="relative">
    <Icon name="search" size={18} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"/>
    <input {...p} className={`w-full h-11 pl-10 pr-3 rounded-xl border border-slate-200 bg-white outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 ${className}`}/>
  </div>
}
function Modal({title,onClose,children,wide=false}){
  return <div className="fixed inset-0 z-50 bg-slate-950/50 backdrop-blur-sm flex items-end md:items-center justify-center p-0 md:p-6">
    <div className={`w-full ${wide?'max-w-3xl':'max-w-lg'} max-h-[94vh] overflow-auto bg-white rounded-t-3xl md:rounded-3xl shadow-2xl fade-in`}>
      <div className="sticky top-0 z-10 bg-white/95 backdrop-blur px-5 py-4 border-b border-slate-100 flex items-center justify-between">
        <h2 className="font-extrabold text-lg truncate pr-3">{title}</h2><button onClick={onClose} aria-label="Tutup" className="p-2 rounded-full hover:bg-slate-100 active:scale-95 transition shrink-0"><Icon name="x"/></button>
      </div>
      <div className="p-5">{children}</div>
    </div>
  </div>
}

function App(){
  const [tab,setTab]=useState('dashboard');
  const [products,setProducts]=useState([]);
  const [sales,setSales]=useState([]);
  const [expenses,setExpenses]=useState([]);
  const [stocktakes,setStocktakes]=useState([]);
  const [settings,setSettings]=useState(withSyncDefaults({storeName:'R-Preloved',storeIcon:'',storeAddress:'',storePhone:'',paperWidth:80}));
  const [loading,setLoading]=useState(true);
  const [modal,setModal]=useState(null);
  const afterProductRef=useRef(false); // true = setelah produk disimpan/ditutup, kembali ke Stock Opname
  const [toast,setToast]=useState('');
  const [search,setSearch]=useState('');
  const [sync,setSync]=useState({pending:0,syncing:false,lastError:''});
  useEffect(()=>onSyncStateChange(setSync),[]);
  useEffect(()=>{ document.title=(settings.storeName||'R-Preloved')+' — Inventory & Finance'; },[settings.storeName]);
  useEffect(()=>{
    const link=document.getElementById('app-favicon');
    if(link) link.href=settings.storeIcon||'data:,';
  },[settings.storeIcon]);
  const cloudConfigured = Object.values(settings.backendUrls||{}).some(Boolean);

  const reload=async(initial=false,pushSummaryNow=false)=>{
    try{
      const [p,s,e,st,set]=await Promise.all([
        dbAll('products'),dbAll('sales'),dbAll('expenses'),dbAll('stocktakes'),dbAll('settings')
      ]);
      setProducts(Array.isArray(p)?p:[]);
      setSales(Array.isArray(s)?s:[]);
      setExpenses(Array.isArray(e)?e:[]);
      setStocktakes(Array.isArray(st)?st:[]);
      let storeName='R-Preloved';
      if(Array.isArray(set) && set[0]){
        const merged = withSyncDefaults(set[0]);
        setSettings(merged);
        storeName=merged.storeName||storeName;
        syncSettings = {cloudName:merged.cloudName, uploadPreset:merged.uploadPreset, backendUrls:merged.backendUrls};
      }
      if(!idbSupported) setToast('Penyimpanan permanen tidak tersedia di sini — data hanya tersimpan sementara selama sesi ini.');
      refreshPendingCount();
      flushSyncQueue();
      if(pushSummaryNow){
        const validS=(Array.isArray(s)?s:[]).filter(x=>!x.cancelled);
        const soldP=validS.reduce((a,x)=>a+x.total,0);
        const cogsP=validS.reduce((a,x)=>a+x.costTotal,0);
        const expP=Array.isArray(e)?e.reduce((a,x)=>a+x.amount,0):0;
        const stockP=(Array.isArray(p)?p:[]).filter(x=>x.status!=='sold');
        schedulePushSummary({
          storeName,
          penjualan: soldP,
          modalTerjual: cogsP,
          pengeluaran: expP,
          labaBersih: soldP-cogsP-expP,
          stokAktif: stockP.length,
          nilaiModalStok: stockP.reduce((a,x)=>a+x.cost,0),
          totalTransaksi: validS.length
        });
      }
    }catch(err){
      console.error('R-Preloved storage error:',err);
      setToast('Gagal memuat data terbaru. Data lama tetap ditampilkan.');
    }finally{
      setLoading(false);
    }
  };
  const lastPullAtRef = useRef(0);
  const pullNow=async(force=false)=>{
    if(!Object.values(syncSettings.backendUrls||{}).some(Boolean)) return;
    const now=Date.now();
    if(!force && now-lastPullAtRef.current<10000) return;
    lastPullAtRef.current=now;
    try{ await flushSyncQueue(); await pullAll(); await reload(false,true); }
    catch(err){ console.warn('R-Preloved: sync 2 arah gagal.',err); }
  };
  const cleanupGhostSales = async () => {
    try{
      const rows = await dbAll('sales');
      const bad = rows.filter(r=>!r.cancelled && !isValidSyncedRecord('sales',r));
      for(const r of bad){ await dbDelete('sales', r.id); }
      if(bad.length){ await flushSyncQueue(); await reload(); }
    }catch(err){ console.warn('R-Preloved: gagal membersihkan transaksi korup.', err); }
  };
  useEffect(()=>{reload(true).then(()=>pullNow(true)).then(()=>cleanupGhostSales())},[]);
  useEffect(()=>{
    const unlock=()=>{unlockAudio()};
    document.addEventListener('click',unlock,{once:true});
    document.addEventListener('touchstart',unlock,{once:true});
    return ()=>{document.removeEventListener('click',unlock);document.removeEventListener('touchstart',unlock);};
  },[]);
  useEffect(()=>{if(toast){const t=setTimeout(()=>setToast(''),2600);return()=>clearTimeout(t)}},[toast]);

  const stats=useMemo(()=>{
    const validSales=sales.filter(s=>!s.cancelled);
    const sold=validSales.reduce((a,s)=>a+s.total,0);
    const cogs=validSales.reduce((a,s)=>a+s.costTotal,0);
    const exp=expenses.reduce((a,e)=>a+e.amount,0);
    const stock=products.filter(p=>p.status!=='sold');
    return {sold,cogs,exp,profit:sold-cogs-exp,stockValue:stock.reduce((a,p)=>a+p.cost,0),stockCount:stock.length,soldCount:validSales.reduce((a,s)=>a+s.items.length,0)};
  },[products,sales,expenses]);

  const saveProduct=async(data)=>{
    try{
      await dbPut('products',{...data,id:data.id||uid(),createdAt:data.createdAt||Date.now()});
      await reload();setModal(afterProductRef.current?{type:'stocktake'}:null);afterProductRef.current=false;setToast(data.id?'Produk diperbarui':'Produk berhasil ditambahkan');
    }catch(err){console.error(err);setToast('Gagal menyimpan produk. Coba lagi.')}
  };
  const removeProduct=async(id)=>{if(!confirm('Hapus produk ini?'))return;try{await dbDelete('products',id);await reload();setToast('Produk dihapus')}catch(err){console.error(err);setToast('Gagal menghapus produk.')}};
  const saveExpense=async(data)=>{try{await dbPut('expenses',{...data,id:data.id||uid(),date:data.date||Date.now()});await reload();setModal(null);setToast('Pengeluaran tersimpan')}catch(err){console.error(err);setToast('Gagal menyimpan pengeluaran.')}};
  const sell=async(items,payment,paid,discount)=>{
    try{
      const now=Date.now(), subtotal=items.reduce((a,i)=>a+i.price,0), disc=Math.min(Math.max(0,Number(discount)||0),subtotal), total=subtotal-disc, costTotal=items.reduce((a,i)=>a+i.cost,0);
      // Baca ulang dari database (bukan dari state React yang bisa kedaluwarsa) sebelum menulis apa pun.
      const fresh=await dbAll('products');
      const freshById=new Map(fresh.map(x=>[x.id,x]));
      const unavailable=items.filter(i=>{const p=freshById.get(i.id);return !p||p.status==='sold'});
      if(unavailable.length){
        beep('error');
        const names=unavailable.map(i=>`"${i.name}"`).join(', ');
        setToast(`Transaksi dibatalkan: ${names} sudah terjual atau tidak ada lagi. Hapus dari keranjang lalu coba lagi.`);
        await reload();
        return;
      }
      const sale={id:uid(),date:now,items,subtotal,discount:disc,total,costTotal,payment,paid:Number(paid)||0,change:Math.max(0,(Number(paid)||0)-total)};
      await dbPut('sales',sale);
      for(const i of items){const p=freshById.get(i.id);await dbPut('products',{...p,status:'sold',soldAt:now,saleId:sale.id});}
      await reload();setModal({type:'receipt',data:sale});setToast(`Penjualan ${money(total)} berhasil`);
    }catch(err){console.error(err);setToast('Gagal menyimpan penjualan. Coba lagi.')}
  };
  const exportBackup=async()=>{
    try{
      const [p,s,e,st,set]=await Promise.all([dbAll('products'),dbAll('sales'),dbAll('expenses'),dbAll('stocktakes'),dbAll('settings')]);
      const backup={app:'r-preloved',version:1,exportedAt:new Date().toISOString(),data:{products:p,sales:s,expenses:e,stocktakes:st,settings:set}};
      const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      const stamp=new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
      a.href=url; a.download=`r-preloved-backup-${stamp}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),2000);
      setToast('Backup berhasil diunduh');
    }catch(err){console.error(err);setToast('Gagal membuat file backup.')}
  };
  const importBackup=async(file)=>{
    try{
      const text=await file.text();
      const json=JSON.parse(text);
      const data=json?.data||json;
      if(!data || typeof data!=='object') throw new Error('Format file tidak dikenali.');
      const stores=['products','sales','expenses','stocktakes','settings'];
      const counts={};
      let total=0;
      stores.forEach(st=>{ const n=Array.isArray(data[st])?data[st].length:0; counts[st]=n; total+=n; });
      if(!total){ setToast('File backup kosong / formatnya tidak dikenali.'); return; }
      if(!confirm(`Import backup ini?\n\n${stores.map(st=>`${st}: ${counts[st]} data`).join('\n')}\n\nData dengan ID yang sama akan DITIMPA, data lain ditambahkan. Tindakan ini tidak bisa dibatalkan.`)) return;
      for(const store of stores){
        const rows=Array.isArray(data[store])?data[store]:[];
        for(const row of rows){ if(row && row.id!=null) await dbPutRaw(store,row); }
      }
      await reload();
      setToast('Backup berhasil dipulihkan');
    }catch(err){console.error(err);setToast('Gagal membaca file backup: '+(err.message||err))}
  };
  const cancelSale=async(sale)=>{
    if(sale.cancelled) return;
    if(!confirm(`Batalkan transaksi ini (${money(sale.total)})? Produk yang terjual akan dikembalikan ke status "Tersedia".`)) return;
    try{
      await dbPut('sales',{...sale,cancelled:true,cancelledAt:Date.now()});
      for(const i of sale.items){
        const p=products.find(x=>x.id===i.id);
        if(p && p.status==='sold' && p.saleId===sale.id){
          const {soldAt,saleId,...rest}=p;
          await dbPut('products',{...rest,status:'available'});
        }
      }
      await reload();setToast('Transaksi dibatalkan & stok dikembalikan');
    }catch(err){console.error(err);setToast('Gagal membatalkan transaksi.')}
  };
  const doStocktake=async(entries,unknown=[])=>{
    try{
      // Status dibaca ulang dari database supaya barang yang laku saat opname berlangsung tidak tertimpa.
      const fresh=new Map((await dbAll('products')).map(x=>[x.id,x]));
      const allSales=await dbAll('sales');
      const now=Date.now(), out=[], notes=[];
      for(const e of entries){
        const p=fresh.get(e.id); let result=e.result;
        if(!p) continue;
        if(result==='missing_sold'||result==='missing_lost'){
          if(p.status==='sold') result='already_sold';
          else if(result==='missing_sold'){
            const sale={id:uid(),date:now,items:[{id:p.id,sku:p.sku,name:p.name,price:p.price,cost:p.cost}],subtotal:p.price,discount:0,total:p.price,costTotal:p.cost,payment:'LAINNYA',paid:p.price,change:0,note:'Dicatat dari stock opname'};
            await dbPut('sales',sale);
            await dbPut('products',{...p,status:'sold',soldAt:now,saleId:sale.id});
          }else{
            if((Number(p.cost)||0)>0) await dbPut('expenses',{id:uid(),date:now,name:`Barang hilang: ${p.name} (${p.sku})`,category:'Barang Hilang',amount:Number(p.cost)});
            await dbPut('products',{...p,status:'sold',soldAt:now,lost:true});
          }
        }else if(result==='sold_found_restored'){
          if(p.status!=='sold') result='found';
          else{
            const sale=p.saleId?allSales.find(x=>x.id===p.saleId&&!x.cancelled):null;
            if(sale&&sale.items.length>1){result='sold_found_ignored';notes.push(`"${p.name}" ada di transaksi multi-barang, batalkan lewat menu Penjualan.`)}
            else{
              if(sale) await dbPut('sales',{...sale,cancelled:true,cancelledAt:now});
              const {soldAt,saleId,lost,...rest}=p;
              await dbPut('products',{...rest,status:'available'});
            }
          }
        }
        out.push({id:p.id,sku:p.sku,name:p.name,cost:Number(p.cost)||0,result});
      }
      unknown.forEach(c=>out.push({id:'unk-'+c,sku:c,name:'SKU tidak dikenal',cost:0,result:'unknown'}));
      await dbPut('stocktakes',{id:uid(),date:now,entries:out});
      clearStocktakeDraft();
      await reload();setModal(null);setToast(notes.length?notes[0]:'Stock opname tersimpan');
    }catch(err){console.error(err);setToast('Gagal menyimpan stock opname.')}
  };

  const nav=[
    ['dashboard','Dashboard','grid'],['sales','Penjualan','cart'],['products','Produk','shirt'],['finance','Keuangan','wallet']
  ];
  if(loading) return <div className="min-h-screen bg-slate-950 text-white flex items-center justify-center p-6"><div className="text-center">{settings.storeIcon && <div className="mx-auto mb-4 w-12 h-12 rounded-2xl bg-white/10 flex items-center justify-center overflow-hidden"><img src={settings.storeIcon} className="w-full h-full object-contain p-1.5"/></div>}<div className="font-black text-xl">{settings.storeName||'R-Preloved'}</div><div className="text-sm text-slate-400 mt-1">Menyiapkan aplikasi…</div></div></div>;

  return <div className="min-h-screen">
    <aside className="hidden md:flex fixed left-0 top-0 bottom-0 desktop-sidebar bg-slate-950 text-white flex-col p-4 z-30">
      <div className="px-3 py-4 mb-4 flex items-center gap-3">{settings.storeIcon && <div className="w-9 h-9 rounded-xl bg-white/10 flex items-center justify-center overflow-hidden shrink-0"><img src={settings.storeIcon} className="w-full h-full object-contain p-1"/></div>}<div><div className="font-black text-xl leading-tight">{settings.storeName||'R-Preloved'}</div><div className="text-xs text-slate-400">Inventory • Sales • Finance</div></div></div>
      <nav className="space-y-1">
        {nav.map(([id,label,icon])=><button key={id} onClick={()=>setTab(id)} className={`w-full flex items-center gap-3 px-3 py-3 rounded-xl text-sm font-semibold ${tab===id?'bg-white text-slate-900':'text-slate-300 hover:bg-white/10'}`}><Icon name={icon}/>{label}</button>)}
      </nav>
      <div className="mt-auto"><button onClick={()=>setModal({type:'settings'})} className="w-full flex items-center gap-3 px-3 py-3 rounded-xl text-sm text-slate-300 hover:bg-white/10"><Icon name="settings"/>Pengaturan</button></div>
    </aside>

    <main className="desktop-content min-h-screen pb-24 md:pb-8">
      <header className="sticky top-0 z-20 bg-white/90 backdrop-blur border-b border-slate-100">
        <div className="max-w-7xl mx-auto px-4 md:px-7 h-16 flex items-center justify-between">
          <div className="flex items-center gap-2 md:block">{settings.storeIcon && <div className="md:hidden w-8 h-8 rounded-lg bg-slate-100 flex items-center justify-center overflow-hidden shrink-0"><img src={settings.storeIcon} className="w-full h-full object-contain p-1"/></div>}<div className="md:hidden font-black">{settings.storeName||'R-Preloved'}</div><div className="hidden md:block text-sm text-slate-500">{nav.find(x=>x[0]===tab)?.[1]}</div></div>
          <div className="flex items-center gap-2">

function ProductRow({p,onEdit,onSell,onDelete,onLabel}){
  // Umur barang di stok (hari) dihitung dari createdAt. <30 hari hijau, 30-59 kuning, >=60 merah (kandidat markdown).
  const ageDays=(p.status!=='sold'&&!p.lost&&Number(p.createdAt)>0)?Math.max(0,Math.floor((Date.now()-Number(p.createdAt))/86400000)):null;
  const ageTone=ageDays===null?'bg-emerald-50 text-emerald-700':ageDays>=60?'bg-red-50 text-red-600':ageDays>=30?'bg-amber-50 text-amber-700':'bg-emerald-50 text-emerald-700';
  const badge=<span className={`px-2.5 py-1 rounded-full text-[10px] font-extrabold shrink-0 whitespace-nowrap ${p.lost?'bg-red-50 text-red-600':p.status==='sold'?'bg-slate-100 text-slate-500':ageTone}`}>{p.lost?'HILANG':p.status==='sold'?'TERJUAL':ageDays===null?'AKTIF':ageDays===0?'AKTIF HARI INI':`AKTIF ${ageDays} HARI`}</span>;
  const thumb=p.image?<img src={p.image} className="w-14 h-14 rounded-xl object-cover shrink-0"/>:<div className="w-14 h-14 rounded-xl bg-slate-100 flex items-center justify-center shrink-0"><Icon name="shirt" size={22}/></div>;

  const actions=<div className="flex gap-1 shrink-0">
    <button onClick={()=>onLabel(p)} aria-label="Cetak label harga & barcode" title="Cetak label" className="p-2 rounded-lg bg-indigo-50 hover:bg-indigo-100 active:scale-95 transition text-indigo-600"><Icon name="tag" size={16}/></button>
    <button onClick={()=>onDelete(p.id)} aria-label="Hapus produk" title="Hapus" className="p-2 rounded-lg bg-red-50 hover:bg-red-100 active:scale-95 transition text-red-600"><Icon name="trash" size={16}/></button>
    {p.status!=='sold'&&<button onClick={()=>onSell(p)} aria-label="Jual produk" title="Jual" className="p-2 rounded-lg bg-emerald-50 hover:bg-emerald-100 active:scale-95 transition text-emerald-700"><Icon name="cart" size={16}/></button>}
  </div>;
  return <>
    <div className="md:hidden flex gap-3 p-4 border-b last:border-0 border-slate-100">

      <div className="flex-1 min-w-0">
        <div className="flex items-start justify-between gap-2"><div className="font-bold truncate">{nameWithEdit}</div>{badge}</div>
        <div className="text-xs text-slate-400 mt-0.5 truncate">{p.category||'Uncategorized'} • {p.size||'-'} • {p.color||'-'}</div>
        <div className="font-mono text-[11px] text-slate-400 mt-1 truncate">{p.sku}</div>
        <div className="flex items-end justify-between mt-2 gap-2">
          <div className="min-w-0"><div className="text-xs text-slate-400">Modal {money(p.cost)}</div><div className="font-extrabold text-sm truncate">{money(p.price)}</div></div>
          {actions}
        </div>
      </div>
    </div>
    <div className="hidden md:grid grid-cols-[64px_1.5fr_1fr_110px_110px_140px] gap-3 items-center px-5 py-3 border-b last:border-0 border-slate-100">
      {thumb}
      <div className="min-w-0"><div className="font-bold truncate">{nameWithEdit}</div><div className="text-xs text-slate-400 mt-0.5 truncate">{p.category||'Uncategorized'} • {p.size||'-'} • {p.color||'-'}</div></div>
      <div className="font-mono text-xs truncate">{p.sku}</div>
      <div className="text-sm">{money(p.cost)}</div>

function SkuScanModal({onClose,onDetected}){
  const videoRef=useRef(null), streamRef=useRef(null), timerRef=useRef(null);
  const [status,setStatus]=useState('Menyiapkan kamera…');
  const [manual,setManual]=useState('');
  const activeRef=useRef(true), doneRef=useRef(false);

  const detected=(code)=>{
    if(doneRef.current) return;
    const clean=String(code).trim();
    if(!clean) return;
    doneRef.current=true;
    beep('success');
    cleanup();
    onDetected(clean);
  };
  const cleanup=()=>{activeRef.current=false;if(timerRef.current)cancelAnimationFrame(timerRef.current);streamRef.current?.getTracks().forEach(t=>t.stop())};
  useEffect(()=>{
    activeRef.current=true;
    (async()=>{
      try{
        if(!navigator.mediaDevices?.getUserMedia) throw new Error('Kamera tidak didukung browser');
        const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
        if(!activeRef.current)return;s.getTracks().forEach(t=>t.enabled=true);streamRef.current=s;videoRef.current.srcObject=s;await videoRef.current.play();
        if('BarcodeDetector' in window){
          const formats=await BarcodeDetector.getSupportedFormats();
          const detector=new BarcodeDetector({formats:formats.filter(f=>['code_128','code_39','ean_13','ean_8','upc_a','upc_e','qr_code'].includes(f))});
          const scan=async()=>{if(!activeRef.current||doneRef.current)return;try{const codes=await detector.detect(videoRef.current);if(codes.length){detected(codes[0].rawValue)}}catch(e){}if(!doneRef.current)timerRef.current=requestAnimationFrame(scan)};
          timerRef.current=requestAnimationFrame(scan);setStatus('Arahkan barcode ke kotak pemindai.');
        }else setStatus('BarcodeDetector belum tersedia. Ketik SKU manual.');
      }catch(e){setStatus('Kamera tidak dapat diakses. Cek izin kamera atau ketik SKU manual.')}
    })();
    return cleanup;
  },[]);
  return <Modal title="Scan Barcode untuk SKU" onClose={()=>{cleanup();onClose()}}>
    <div className="space-y-4">
      <div className="relative rounded-2xl overflow-hidden bg-slate-950 aspect-video flex items-center justify-center"><video ref={videoRef} playsInline muted className="w-full h-full object-cover"/><div className="absolute inset-1/4 scan-box rounded-2xl pointer-events-none"></div><div className="absolute bottom-3 left-0 right-0 text-center text-xs font-semibold text-white drop-shadow px-3">{status}</div></div>
      <div className="flex gap-2"><input autoFocus value={manual} onChange={e=>setManual(e.target.value)} onKeyDown={e=>e.key==='Enter'&&detected(manual)} placeholder="Ketik / scan SKU (auto Enter)…" className="flex-1 min-w-0 h-11 px-3 rounded-xl border border-slate-200 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"/><Button onClick={()=>detected(manual)} className="shrink-0">Pakai</Button></div>
      <div className="text-xs text-slate-400 text-center">Barcode fisik (label baju/kemasan) atau alat scanner USB/Bluetooth juga bisa langsung diketik ke kolom di atas.</div>
    </div>
  </Modal>
}

function SaleModal({products,initial,onClose,onSell}){
  const active=products.filter(p=>p.status!=='sold');
  const initialItems=Array.isArray(initial)?initial:(initial?[initial]:[]);
  const [items,setItems]=useState(initialItems);
  const [payment,setPayment]=useState('CASH');
  const [paid,setPaid]=useState('');
  const [showDiscount,setShowDiscount]=useState(false);
  const [discountMode,setDiscountMode]=useState('rp');
  const [discountValue,setDiscountValue]=useState(0);
  const [q,setQ]=useState('');
  const [scanning,setScanning]=useState(false);
  const subtotal=items.reduce((a,p)=>a+p.price,0);
  const discountClamped = discountMode==='persen'
    ? Math.round(subtotal*(Math.min(100,Math.max(0,Number(discountValue)||0))/100))
    : Math.min(Math.max(0,Number(discountValue)||0),subtotal);
  const total=Math.max(0,subtotal-discountClamped), change=Math.max(0,(Number(paid)||0)-total);
  const switchDiscountMode=m=>{setDiscountMode(m);setDiscountValue(0)};
  const add=p=>{if(!items.some(x=>x.id===p.id))setItems(x=>[...x,p]);setQ('')};
  const addMany=list=>{setItems(x=>[...x,...list.filter(p=>!x.some(y=>y.id===p.id))]);setScanning(false)};
  const remove=id=>setItems(x=>x.filter(p=>p.id!==id));
  const submit=async()=>{if(!items.length)return; if(payment==='CASH'&&(Number(paid)||0)<total){alert('Uang diterima kurang dari total.');return} await onSell(items,payment,paid,discountClamped)};
  const filtered=active.filter(p=>(p.sku+' '+p.name).toLowerCase().includes(q.toLowerCase())).slice(0,8);
  return <Modal title="Penjualan Baru" onClose={onClose} wide>
    <div className="grid lg:grid-cols-[1.25fr_.75fr] gap-5">
      <div className="space-y-3">
        <div className="flex gap-2">
          <div className="relative flex-1 min-w-0">
            <Icon name="search" size={18} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"/>
            <input autoFocus value={q} onChange={e=>setQ(e.target.value)} placeholder="Cari SKU / nama produk…" className="w-full h-11 pl-10 pr-3 rounded-xl border border-slate-200 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"/>
            {q&&<div className="absolute z-20 left-0 right-0 top-[calc(100%+6px)] bg-white border border-slate-200 rounded-xl shadow-xl overflow-hidden max-h-64 overflow-y-auto">
              {filtered.length?filtered.map(p=><button type="button" key={p.id} onClick={()=>add(p)} className="w-full flex items-center gap-3 p-3 text-left hover:bg-slate-50 border-b last:border-0 border-slate-100">{p.image?<img src={p.image} className="w-10 h-10 rounded-lg object-cover shrink-0"/>:<div className="w-10 h-10 bg-slate-100 rounded-lg flex items-center justify-center shrink-0"><Icon name="shirt" size={16}/></div>}<span className="min-w-0 flex-1"><b className="block truncate">{p.name}</b><small className="block text-slate-400 truncate">{p.sku}</small></span><b className="shrink-0">{money(p.price)}</b></button>):<div className="p-3 text-sm text-slate-400 text-center">Tidak ditemukan</div>}
            </div>}
          </div>
          <Button type="button" variant="outline" className="shrink-0 px-3" onClick={()=>{unlockAudio();setScanning(true)}}><Icon name="scan" size={18}/><span className="hidden sm:inline">Scan</span></Button>
        </div>
        <div className="border border-slate-100 rounded-2xl overflow-hidden">{items.map(p=><div key={p.id} className="flex items-center gap-3 p-3 border-b last:border-0">{p.image?<img src={p.image} className="w-12 h-12 rounded-xl object-cover shrink-0"/>:<div className="w-12 h-12 bg-slate-100 rounded-xl flex items-center justify-center shrink-0"><Icon name="shirt"/></div>}<div className="flex-1 min-w-0"><b className="text-sm block truncate">{p.name}</b><div className="text-xs text-slate-400 truncate">{p.sku} • modal {money(p.cost)}</div></div><b className="shrink-0">{money(p.price)}</b><button type="button" onClick={()=>remove(p.id)} aria-label="Hapus" className="p-2 text-red-500 shrink-0 active:scale-95 transition"><Icon name="x" size={17}/></button></div>)}{!items.length&&<Empty text="Belum ada barang. Cari SKU atau scan barcode."/>}</div>
      </div>
      <div className="bg-slate-50 rounded-2xl p-4 h-fit space-y-4">
        <div className="space-y-1.5">
          {discountClamped>0 && <div className="flex justify-between items-center text-sm text-slate-500"><span>Subtotal</span><span>{money(subtotal)}</span></div>}
          {discountClamped>0 && <div className="flex justify-between items-center text-sm text-red-500"><span>Diskon</span><span>-{money(discountClamped)}</span></div>}
          <div className="flex justify-between items-center"><span className="text-sm text-slate-500">Total</span><span className="text-2xl font-black">{money(total)}</span></div>
        </div>
        <button type="button" onClick={()=>setShowDiscount(s=>!s)} className="w-full flex items-center justify-between gap-2 px-3.5 h-11 rounded-xl bg-white hover:bg-slate-100 border border-slate-200 transition text-sm font-semibold text-slate-600">
          <span className="flex items-center gap-2"><Icon name="tag" size={16}/><span>Diskon transaksi{discountClamped>0?` — ${money(discountClamped)}`:' (opsional)'}</span></span>
          <Icon name={showDiscount?'x':'plus'} size={16}/>
        </button>
        {showDiscount && <div className="space-y-1.5 fade-in">
          <div className="flex items-center justify-between">
            <span className="block text-xs font-bold text-slate-500">Jenis diskon</span>
            <div className="flex bg-slate-100 rounded-lg p-0.5">
              <button type="button" onClick={()=>switchDiscountMode('rp')} className={`px-3 h-7 rounded-md text-xs font-bold transition ${discountMode==='rp'?'bg-white shadow text-slate-900':'text-slate-500'}`}>Rp</button>
              <button type="button" onClick={()=>switchDiscountMode('persen')} className={`px-3 h-7 rounded-md text-xs font-bold transition ${discountMode==='persen'?'bg-white shadow text-slate-900':'text-slate-500'}`}>%</button>
            </div>
          </div>
          <div className="relative">
            {discountMode==='rp' && <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm">Rp</span>}
            <input type="text" inputMode="numeric"
              value={discountMode==='rp'?formatThousand(discountValue):(discountValue||'')}
              onChange={e=>{const raw=parseNum(e.target.value);setDiscountValue(discountMode==='rp'?Math.min(raw,subtotal):Math.min(100,raw))}}
              placeholder="0"
              className={`w-full h-11 rounded-xl border border-slate-200 bg-white outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 ${discountMode==='rp'?'pl-8 pr-3':'pl-3 pr-8 text-right'}`}/>
            {discountMode==='persen' && <span className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm">%</span>}
          </div>
          {discountMode==='persen' && discountValue>0 && <div className="text-xs text-slate-400 text-right">= {money(discountClamped)}</div>}
        </div>}
        <div><div className="text-xs font-bold text-slate-500 mb-2">Metode pembayaran</div><div className="grid grid-cols-2 gap-2">{['CASH','QRIS'].map(x=><button type="button" key={x} onClick={()=>setPayment(x)} className={`h-11 rounded-xl font-bold text-sm ${payment===x?'bg-slate-900 text-white':'bg-white border border-slate-200'}`}>{x}</button>)}</div></div>
        {payment==='CASH'&&<><NumberField label="Uang Diterima" prefix="Rp" value={paid} onChange={v=>setPaid(v)}/><div className="flex justify-between rounded-xl bg-emerald-50 text-emerald-700 p-3"><span className="font-semibold">Kembalian</span><b>{money(change)}</b></div></>}
        <div className="rounded-xl bg-white border border-dashed border-slate-300 p-3 flex items-center gap-2.5 text-xs text-slate-500"><Icon name="receipt" size={16} className="shrink-0 text-slate-400"/><span>Struk dibuat otomatis setelah transaksi dikonfirmasi — bisa langsung dicetak lewat printer thermal/Bluetooth.</span></div>
        <Button disabled={!items.length} onClick={submit} className="w-full" variant="green"><Icon name="check" size={18}/><span>Konfirmasi Terjual</span></Button>
      </div>
    </div>
    {scanning && <ScannerModal products={active.filter(p=>!items.some(x=>x.id===p.id))} onClose={()=>setScanning(false)} onFound={addMany}/>}
  </Modal>
}

function ScannerModal({products,onClose,onFound}){
  const videoRef=useRef(null), streamRef=useRef(null), timerRef=useRef(null);
  const [status,setStatus]=useState('Menyiapkan kamera…');
  const [manual,setManual]=useState('');
  const [cart,setCart]=useState([]);
  const activeRef=useRef(true), cooldownRef=useRef(false);
  const cartRef=useRef(cart); cartRef.current=cart;

  const find=(code)=>{
    if(cooldownRef.current) return;
    const clean=String(code).trim();
    if(!clean) return;
    const p=products.find(x=>String(x.sku).toLowerCase()===clean.toLowerCase());
    if(!p){ beep('error'); setStatus(`SKU "${clean}" tidak ditemukan.`); return; }
    if(p.status==='sold'){ beep('error'); setStatus(`"${p.name}" sudah terjual sebelumnya.`); return; }
    if(cartRef.current.some(x=>x.id===p.id)){ beep('error'); setStatus(`"${p.name}" sudah ada di keranjang.`); return; }
    beep('success');
    setCart(x=>[...x,p]);
    setStatus(`✓ Ditambahkan: ${p.name}`);
    setManual('');
    cooldownRef.current=true;
    setTimeout(()=>{ cooldownRef.current=false; if(activeRef.current) setStatus('Arahkan barcode berikutnya ke kotak pemindai.'); },900);
  };
  const removeFromCart=id=>setCart(x=>x.filter(p=>p.id!==id));
  const cleanup=()=>{activeRef.current=false;if(timerRef.current)cancelAnimationFrame(timerRef.current);streamRef.current?.getTracks().forEach(t=>t.stop())};
  useEffect(()=>{
    activeRef.current=true;
    (async()=>{
      try{
        if(!navigator.mediaDevices?.getUserMedia) throw new Error('Kamera tidak didukung browser');
        const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
        if(!activeRef.current)return;s.getTracks().forEach(t=>t.enabled=true);streamRef.current=s;videoRef.current.srcObject=s;await videoRef.current.play();
        if('BarcodeDetector' in window){
          const formats=await BarcodeDetector.getSupportedFormats();
          const detector=new BarcodeDetector({formats:formats.filter(f=>['code_128','code_39','ean_13','ean_8','upc_a','upc_e','qr_code'].includes(f))});
          const scan=async()=>{if(!activeRef.current)return;try{const codes=await detector.detect(videoRef.current);if(codes.length){find(codes[0].rawValue)}}catch(e){}timerRef.current=requestAnimationFrame(scan)};
          timerRef.current=requestAnimationFrame(scan);setStatus('Arahkan barcode ke kotak pemindai.');
        }else setStatus('BarcodeDetector belum tersedia. Masukkan SKU manual.');
      }catch(e){setStatus('Kamera tidak dapat diakses. Cek izin kamera atau gunakan SKU manual.')}
    })();
    return cleanup;
  },[]);
  const total=cart.reduce((a,p)=>a+p.price,0);
  const finish=()=>{ if(!cart.length) return; cleanup(); onFound(cart); };
  return <Modal title="Scan Barcode" onClose={()=>{cleanup();onClose()}}>
    <div className="space-y-4">
      <div className="relative rounded-2xl overflow-hidden bg-slate-950 aspect-video flex items-center justify-center"><video ref={videoRef} playsInline muted className="w-full h-full object-cover"/><div className="absolute inset-1/4 scan-box rounded-2xl pointer-events-none"></div><div className="absolute bottom-3 left-0 right-0 text-center text-xs font-semibold text-white drop-shadow px-3">{status}</div></div>
      <div className="flex gap-2"><input autoFocus value={manual} onChange={e=>setManual(e.target.value)} onKeyDown={e=>e.key==='Enter'&&find(manual)} placeholder="Ketik / scan SKU (auto Enter)…" className="flex-1 min-w-0 h-11 px-3 rounded-xl border border-slate-200 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"/><Button onClick={()=>find(manual)} className="shrink-0">Tambah</Button></div>
      <div className="flex items-center justify-between"><div className="text-xs font-bold text-slate-500">Keranjang scan ({cart.length})</div>{cart.length>0 && <div className="text-sm font-black">{money(total)}</div>}</div>
      <div className="border border-slate-100 rounded-2xl overflow-hidden max-h-48 overflow-y-auto">
        {cart.map(p=><div key={p.id} className="flex items-center gap-3 p-3 border-b last:border-0"><div className="w-9 h-9 rounded-lg bg-slate-100 flex items-center justify-center shrink-0">{p.image?<img src={p.image} className="w-9 h-9 rounded-lg object-cover"/>:<Icon name="shirt" size={16}/>}</div><div className="flex-1 min-w-0"><b className="text-sm block truncate">{p.name}</b><div className="text-xs text-slate-400 truncate">{p.sku}</div></div><b className="shrink-0 text-sm">{money(p.price)}</b><button type="button" onClick={()=>removeFromCart(p.id)} aria-label="Hapus dari keranjang" className="p-1.5 text-red-500 shrink-0 active:scale-95 transition"><Icon name="x" size={16}/></button></div>)}
        {!cart.length&&<div className="p-4 text-xs text-slate-400 text-center">Scan barcode tiap barang satu per satu, kamera tidak akan tertutup. Ketika sudah selesai, klik "Lanjut ke Pembayaran".</div>}
      </div>
      <Button disabled={!cart.length} onClick={finish} className="w-full" variant="green"><Icon name="cart" size={18}/><span>Lanjut ke Pembayaran{cart.length?` (${cart.length} barang)`:''}</span></Button>
    </div>
  </Modal>
}

function ReceiptLines({lines,width}){
  return lines.map((l,i)=>{
    if(l.type==='row'){
      return <div key={i} className="flex justify-between gap-3" style={{fontWeight:l.bold?800:400}}>
        <span>{l.left}</span>
        <span style={{textDecoration:l.underline?'underline':'none'}}>{l.right}</span>
      </div>;
    }
    return <div key={i} style={{fontWeight:l.bold?800:400,fontSize:l.big?'1.3em':undefined,letterSpacing:l.big?'.03em':undefined,textAlign:l.align==='center'?'center':'left'}}>{l.t||'\u00A0'}</div>;
  });
}
function ReceiptModal({sale,settings,onClose}){
  const {lines,width}=useMemo(()=>buildReceiptLines(sale,settings),[sale,settings]);
  const [status,setStatus]=useState('');
  const [busy,setBusy]=useState(false);
  const printBrowser=()=>{ window.print(); };
  const printBluetooth=async()=>{
    setBusy(true); setStatus('');
    try{
      const bytes=buildEscPos(sale,settings);
      await printEscPosBluetooth(bytes,setStatus);
    }catch(err){ console.error(err); setStatus(err.message||'Gagal mencetak ke printer Bluetooth.'); }
    finally{ setBusy(false); }
  };
  return <Modal title="Struk" onClose={onClose}>
    <div className="space-y-4">
      <div className="rounded-2xl bg-slate-950 p-4 overflow-x-auto">
        <div className="receipt-sheet">
          {settings.storeIcon && <div className="receipt-logo"><img src={settings.storeIcon} alt=""/></div>}
          <div className="receipt-lines font-mono text-[11px] leading-[1.35] text-emerald-300 whitespace-pre" style={{width:'max-content',maxWidth:'100%'}}>
            <ReceiptLines lines={lines} width={width}/>
          </div>
        </div>
      </div>
      {status && <div className="text-xs font-semibold text-slate-500 text-center">{status}</div>}
      <div className="grid grid-cols-1 gap-2">
        <Button onClick={printBrowser} className="w-full"><Icon name="printer" size={18}/><span>Cetak (Print biasa / printer terpasang)</span></Button>
        <Button onClick={printBluetooth} disabled={busy} variant="outline" className="w-full"><Icon name="bluetooth" size={18}/><span>{busy?'Mencetak…':'Cetak Langsung ke Printer Bluetooth (ESC/POS)'}</span></Button>
      </div>
      <div className="text-xs text-slate-400 leading-relaxed">
        <b>Cetak biasa</b> memakai dialog print browser — cocok kalau printer thermal/Bluetooth kamu sudah terpasang sebagai printer di HP/laptop (mis. lewat app driver seperti RawBT/PrintHand). Logo toko ikut tercetak di sini.<br/>
        <b>Cetak langsung Bluetooth</b> mengirim data mentah (ESC/POS) langsung ke printer thermal lewat Web Bluetooth — hanya jalan di Chrome/Edge Android dan printer yang kompatibel BLE. Karena mode ini teks murni, logo tidak ikut tercetak, tapi nama toko &amp; tulisan LUNAS/DIBATALKAN tetap tercetak besar/tebal.
      </div>
      <Button variant="soft" onClick={onClose} className="w-full">Tutup</Button>
    </div>
    <div id="print-receipt" className="print-area">
      <div className="receipt-sheet">
        {settings.storeIcon && <div className="receipt-logo"><img src={settings.storeIcon} alt=""/></div>}
        <div className="receipt-lines" style={{fontFamily:'monospace',fontSize:'11px',lineHeight:1.35,whiteSpace:'pre',width:'max-content',maxWidth:'100%'}}>
          <ReceiptLines lines={lines} width={width}/>
        </div>
      </div>
    </div>
  </Modal>
}


function LabelModal({product,settings,onClose}){
  const [mode,setMode]=useState('barcode');
  const [qty,setQty]=useState(1);
  const [showName,setShowName]=useState(true);
  const [showPrice,setShowPrice]=useState(true);
  const [dataUrl,setDataUrl]=useState('');
  const [status,setStatus]=useState('');
  const [busy,setBusy]=useState(false);

  useEffect(()=>{
    let cancelled=false;
    setStatus('');
    (async()=>{
      try{
        const canvas=await renderLabelCanvas({product,settings,mode,showName,showPrice});
        if(!cancelled) setDataUrl(canvas.toDataURL('image/png'));
      }catch(e){ console.error(e); if(!cancelled){ setDataUrl(''); setStatus(e.message||'Gagal membuat barcode/QR.'); } }
    })();
    return ()=>{cancelled=true};
  },[mode,showName,showPrice,product.id,settings.paperWidth]);

  const printBrowser=()=>{ if(dataUrl) window.print(); };
  const printBluetooth=async()=>{
    setBusy(true); setStatus('');
    try{
      const canvas=await renderLabelCanvas({product,settings,mode,showName,showPrice});
      const raster=canvasToEscPosRaster(canvas);
      const feed=new TextEncoder().encode('\n\n');
      const one=new Uint8Array(raster.length+feed.length);
      one.set(raster,0); one.set(feed,raster.length);
      const n=Math.max(1,Number(qty)||1);
      const all=new Uint8Array(2+one.length*n+4);
      all.set([0x1B,0x40],0);
      for(let i=0;i<n;i++) all.set(one,2+i*one.length);
      all.set([0x1D,0x56,0x42,0x00],2+one.length*n);
      await printEscPosBluetooth(all,setStatus);
    }catch(err){ console.error(err); setStatus(err.message||'Gagal mencetak label ke printer Bluetooth.'); }
    finally{ setBusy(false); }
  };

  return <Modal title="Cetak Label Harga & Barcode" onClose={onClose}>
    <div className="space-y-4">
      <div className="flex items-center justify-center bg-slate-50 rounded-2xl p-4 min-h-[140px]">
        {dataUrl? <img src={dataUrl} alt="Preview label" className="max-w-full" style={{imageRendering:'pixelated'}}/> : <div className="text-xs text-slate-400">Menyiapkan preview…</div>}
      </div>
      <div className="grid grid-cols-2 gap-2">
        <button type="button" onClick={()=>setMode('barcode')} className={`h-11 rounded-xl font-bold text-sm ${mode==='barcode'?'bg-slate-900 text-white':'bg-white border border-slate-200'}`}>Barcode (Code128)</button>
        <button type="button" onClick={()=>setMode('qr')} className={`h-11 rounded-xl font-bold text-sm ${mode==='qr'?'bg-slate-900 text-white':'bg-white border border-slate-200'}`}>QR Code</button>
      </div>
      <div className="flex flex-wrap gap-4 text-sm">
        <label className="flex items-center gap-2"><input type="checkbox" checked={showName} onChange={e=>setShowName(e.target.checked)}/> Nama produk</label>
        <label className="flex items-center gap-2"><input type="checkbox" checked={showPrice} onChange={e=>setShowPrice(e.target.checked)}/> Harga</label>
      </div>
      <NumberField label="Jumlah label dicetak" value={qty} onChange={v=>setQty(Math.max(1,v||1))}/>
      {status && <div className="text-xs font-semibold text-slate-500 text-center">{status}</div>}
      <div className="grid grid-cols-1 gap-2">
        <Button onClick={printBrowser} disabled={!dataUrl} className="w-full"><Icon name="printer" size={18}/><span>Cetak (Print biasa / printer terpasang)</span></Button>
        <Button onClick={printBluetooth} disabled={busy||!dataUrl} variant="outline" className="w-full"><Icon name="bluetooth" size={18}/><span>{busy?'Mencetak…':`Cetak ${qty>1?qty+'x ':''}Langsung ke Printer Bluetooth (ESC/POS)`}</span></Button>
      </div>
      <div className="text-xs text-slate-400 leading-relaxed">
        Barcode/QR dibuat sendiri dari kolom <b>SKU</b> produk ini (offline, tidak ada layanan luar) — cocok ditempel di baju preloved yang tidak punya barcode asli. Hasil cetak bisa langsung dipindai lagi lewat menu <b>Scan SKU</b>.
      </div>
      <Button variant="soft" onClick={onClose} className="w-full">Tutup</Button>
    </div>
    <div className="print-area">
      <div style={{display:'flex',flexWrap:'wrap',gap:'2mm'}}>
        {Array.from({length:Math.max(1,Number(qty)||1)}).map((_,i)=><div key={i} className="label-tile">{dataUrl && <img src={dataUrl} style={{width:'100%',display:'block'}}/>}</div>)}
      </div>
    </div>
  </Modal>
}

function Sales({sales,onSell,onPrint,onCancel}){
  const [q,setQ]=useState('');
  const list=sales.filter(s=>s.items.some(i=>(i.name+' '+i.sku).toLowerCase().includes(q.toLowerCase())));

ck={()=>onCancel(s)} className="flex items-center justify-center gap-2 h-10 rounded-xl border border-red-200 bg-red-50 text-sm font-bold text-red-600 active:scale-[.98] transition"><Icon name="x" size={16}/>Batalkan</button></div>}</div>)}{!list.length&&<Empty text="Belum ada penjualan."/>}</div></div>

const STOCKTAKE_DRAFT_KEY='rp-stocktake-draft';
function loadStocktakeDraft(){try{return JSON.parse(localStorage.getItem(STOCKTAKE_DRAFT_KEY)||'null')}catch(e){return null}}
function saveStocktakeDraft(d){try{localStorage.setItem(STOCKTAKE_DRAFT_KEY,JSON.stringify(d))}catch(e){}}
function clearStocktakeDraft(){try{localStorage.removeItem(STOCKTAKE_DRAFT_KEY)}catch(e){}}
function stocktakeLine(s){
  const e=Array.isArray(s.entries)?s.entries:[];
  if(!e.some(x=>x.result)) return `${e.length} item diperiksa`;
  const f=e.filter(x=>/^found|^sold_found/.test(x.result)).length, m=e.filter(x=>/^missing/.test(x.result));
  const v=m.reduce((a,x)=>a+(Number(x.cost)||0),0);
  return `${f} ditemukan • ${m.length} tidak ditemukan${v?` • modal ${money(v)}`:''}`;
}
function useBarcodeCamera(onCode){
  const videoRef=useRef(null), cbRef=useRef(onCode); cbRef.current=onCode;
  const [camStatus,setCamStatus]=useState('Menyiapkan kamera…');
  useEffect(()=>{
    let alive=true, stream=null, raf=null;
    (async()=>{
      try{
        if(!navigator.mediaDevices?.getUserMedia) throw new Error('no camera');
        stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
        if(!alive){stream.getTracks().forEach(t=>t.stop());return}
        videoRef.current.srcObject=stream; await videoRef.current.play();
        if(!('BarcodeDetector' in window)){setCamStatus('BarcodeDetector belum tersedia. Masukkan SKU manual.');return}
        const formats=await BarcodeDetector.getSupportedFormats();
        const det=new BarcodeDetector({formats:formats.filter(f=>['code_128','code_39','ean_13','ean_8','upc_a','upc_e','qr_code'].includes(f))});
        setCamStatus('Arahkan barcode ke kotak pemindai.');
        const loop=async()=>{if(!alive)return;try{const c=await det.detect(videoRef.current);if(c.length)cbRef.current(c[0].rawValue)}catch(e){}raf=requestAnimationFrame(loop)};
        raf=requestAnimationFrame(loop);
      }catch(e){setCamStatus('Kamera tidak dapat diakses. Cek izin kamera atau gunakan SKU manual.')}
    })();
    return()=>{alive=false;if(raf)cancelAnimationFrame(raf);stream?.getTracks().forEach(t=>t.stop())};
  },[]);
  return {videoRef,camStatus};
}
function StocktakeCamera({onCode}){
  const {videoRef,camStatus}=useBarcodeCamera(onCode);
  return <div className="space-y-2"><div className="relative rounded-2xl overflow-hidden bg-slate-950 aspect-video flex items-center justify-center"><video ref={videoRef} playsInline muted className="w-full h-full object-cover"/><div className="absolute inset-1/4 scan-box rounded-2xl pointer-events-none"/></div><div className="text-xs text-slate-500 text-center">{camStatus}</div></div>;
}

function Choice({value,onChange,options}){
