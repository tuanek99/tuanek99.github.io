<div id="root"></div>

<script type="text/babel">
const {useEffect, useMemo, useRef, useState} = React;

const DB_NAME = 'r-preloved-db';
const DB_VERSION = 2; // naik dari 1 -> 2 karena nambah store 'syncQueue' buat antrian sync cloud
const STORES = ['products','sales','expenses','settings','stocktakes','syncQueue'];

// PENTING: koneksi IndexedDB dibuat SEKALI dan dipakai ulang (singleton),
// bukan dibuka baru setiap kali baca/tulis/hapus. Membuka banyak koneksi
// paralel (mis. saat reload() memanggil 5 store sekaligus) adalah penyebab
// utama IndexedDB gagal/blocked secara acak di perangkat mobile/WebView,
// yang tadinya membuat SELURUH data kelihatan hilang saat menghapus 1 produk.
let dbPromise = null;
function getDB(){
  if(dbPromise) return dbPromise;
  dbPromise = new Promise((resolve,reject)=>{
    if(!window.indexedDB){ reject(new Error('IndexedDB tidak didukung browser ini')); return; }
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      STORES.forEach(s => {
        if(!db.objectStoreNames.contains(s)) db.createObjectStore(s,{keyPath:'id',autoIncrement:true});
      });
    };
    req.onblocked = () => console.warn('R-Preloved: IndexedDB blocked (kemungkinan ada tab lain terbuka).');
    req.onsuccess = () => {
      const db = req.result;
      db.onversionchange = () => { db.close(); dbPromise = null; };
      db.onclose = () => { dbPromise = null; };
      resolve(db);
    };
    req.onerror = () => reject(req.error || new Error('IndexedDB unavailable'));
  });
  // Kalau gagal dibuka, jangan simpan promise yang reject selamanya —
  // izinkan percobaan lagi di panggilan berikutnya.
  dbPromise.catch(()=>{ dbPromise = null; });
  return dbPromise;
}
let idbSupported = true; // hanya jadi false kalau IndexedDB memang benar-benar tidak ada
const memStore = {products:[],sales:[],expenses:[],stocktakes:[],settings:[]};
async function idbOp(fn){
  const db = await getDB();
  return await fn(db);
}
async function dbAll(store){
  try{
    const rows = await idbOp(db=>new Promise((resolve,reject)=>{
      const tx=db.transaction(store,'readonly'), req=tx.objectStore(store).getAll();
      req.onsuccess=()=>resolve(req.result||[]);
      req.onerror=()=>reject(req.error);
    }));
    idbSupported = true;
    return rows;
  }catch(err){
    console.warn('R-Preloved: gagal membaca dari IndexedDB, memakai penyimpanan sementara.', err);
    idbSupported = false;
    return memStore[store]||(memStore[store]=[]);
  }
}
async function dbPut(store, value){
  const record = {...value, id: value.id||uid()};
  if(SYNCABLE_STORES.includes(store)) record.updatedAt = Date.now(); // dipakai buat menang/kalah saat pull-merge dari device lain
  try{
    await idbOp(db=>new Promise((resolve,reject)=>{
      const tx=db.transaction(store,'readwrite'), req=tx.objectStore(store).put(record);
      req.onsuccess=()=>resolve(req.result); req.onerror=()=>reject(req.error);
    }));
    idbSupported = true;
    enqueueSync(store,'upsert',record.id); // catat ke antrian sync cloud (aman kalau store nggak relevan / cloud belum diset)
    return record.id;
  }catch(err){
    console.warn('R-Preloved: gagal menyimpan ke IndexedDB, memakai penyimpanan sementara.', err);
    idbSupported = false;
    const list=memStore[store]||(memStore[store]=[]);
    const idx=list.findIndex(x=>x.id===record.id);
    if(idx>=0) list[idx]=record; else list.push(record);
    return record.id;
  }
}
async function dbDelete(store,id){
  try{
    await idbOp(db=>new Promise((resolve,reject)=>{
      const tx=db.transaction(store,'readwrite'), req=tx.objectStore(store).delete(id);
      req.onsuccess=()=>resolve(); req.onerror=()=>reject(req.error);
    }));
    idbSupported = true;
    enqueueSync(store,'delete',id);
  }catch(err){
    console.warn('R-Preloved: gagal menghapus di IndexedDB, memakai penyimpanan sementara.', err);
    idbSupported = false;
    const list=memStore[store]||(memStore[store]=[]);
    const idx=list.findIndex(x=>x.id===id);
    if(idx>=0) list.splice(idx,1);
  }
}
async function dbClear(store){
  try{
    await idbOp(db=>new Promise((resolve,reject)=>{
      const tx=db.transaction(store,'readwrite'), req=tx.objectStore(store).clear();
      req.onsuccess=()=>resolve(); req.onerror=()=>reject(req.error);
    }));
  }catch(err){
    memStore[store]=[];
  }
}

// ================= SYNC CLOUD (SheetDB + Cloudinary) =================
// IndexedDB tetap yang dibaca UI (offline-first). Tiap kali dbPut/dbDelete
// berhasil, satu baris dicatat ke 'syncQueue' lalu di-PUSH ke SheetDB di
// background kalau online (lokal -> cloud).
//
// DUA ARAH: selain push, app ini juga PULL data dari SheetDB secara berkala
// (saat dibuka, tiap ~20 detik, saat online lagi, saat tab difokuskan lagi)
// lalu menggabungkannya ke IndexedDB lokal — supaya HP lain yang pakai
// SheetDB URL yang sama ikut menerima perubahan.
// - Konflik ditentukan oleh field "updatedAt" (data dengan updatedAt lebih
//   baru yang menang), makanya SETIAP record syncable disetel ulang
//   updatedAt-nya tiap kali disimpan lewat dbPut.
// - Hapus data memakai SOFT DELETE: baris di Sheets ditandai deleted=true
//   (bukan dihapus beneran), supaya perangkat lain yang sudah pernah
//   menarik baris itu tahu untuk ikut menghapusnya juga saat pull
//   berikutnya (kalau baris beneran dihapus, perangkat lain akan
//   menganggapnya baris itu belum pernah dibuat, bukan "sudah dihapus").
// PENTING buat kamu yang sudah punya Google Sheet lama: tambahkan 2 kolom
// baru di HEADER tiap sheet (products/sales/expenses/stocktakes): "updatedAt"
// dan "deleted". Tanpa 2 kolom ini, SheetDB akan diam-diam mengabaikan nilai
// tersebut dan sync 2 arah tidak akan akurat.
const SYNCABLE_STORES = ['products','sales','expenses','stocktakes'];
let syncSettings = {cloudName:'', uploadPreset:'', sheetdb:{products:'',sales:'',expenses:'',stocktakes:'',summary:''}};
let syncListeners = [];
let syncState = {pending:0, syncing:false, lastError:''};
function onSyncStateChange(fn){ syncListeners.push(fn); fn(syncState); return ()=>{ syncListeners=syncListeners.filter(f=>f!==fn) }; }
function emitSyncState(){ syncListeners.forEach(f=>f(syncState)); }

// Versi "mentah" dari operasi IndexedDB, TANPA memicu antrian sync lagi.
// Dipakai khusus untuk: (1) store 'syncQueue' itu sendiri, dan (2) nge-patch
// record dengan URL gambar hasil upload Cloudinary saat sedang diproses queue —
// supaya tidak muter-muter memicu sync baru dari dalam proses sync.
async function dbPutRaw(store,value){
  const record={...value,id:value.id||uid()};
  await idbOp(db=>new Promise((resolve,reject)=>{
    const tx=db.transaction(store,'readwrite'), req=tx.objectStore(store).put(record);
    req.onsuccess=()=>resolve(record.id); req.onerror=()=>reject(req.error);
  }));
  return record.id;
}
async function dbDeleteRaw(store,id){
  await idbOp(db=>new Promise((resolve,reject)=>{
    const tx=db.transaction(store,'readwrite'), req=tx.objectStore(store).delete(id);
    req.onsuccess=()=>resolve(); req.onerror=()=>reject(req.error);
  }));
}
async function refreshPendingCount(){
  try{ const q=await dbAll('syncQueue'); syncState={...syncState,pending:q.length}; emitSyncState(); }catch(e){}
}
function enqueueSync(store,action,recordId){
  if(!SYNCABLE_STORES.includes(store)) return;
  dbPutRaw('syncQueue',{store,action,recordId,ts:Date.now()})
    .then(refreshPendingCount)
    .then(()=>flushSyncQueue())
    .catch(err=>{ console.warn('R-Preloved: gagal mencatat antrian sync.',err); syncState={...syncState,lastError:String(err.message||err)}; emitSyncState(); });
}

async function uploadToCloudinary(dataUrl){
  if(!dataUrl || !String(dataUrl).startsWith('data:')) return dataUrl;
  // PENTING: kalau Cloudinary belum diisi, JANGAN kirim base64 mentah ke SheetDB.
  // Base64 foto bisa >50.000 karakter (batas 1 sel Google Sheets), jadi kalau
  // dikirim apa adanya, sel foto akan gagal/terpotong di Sheets TAPI item ini
  // tetap dianggap "berhasil" dan hilang dari antrian sync — hasilnya foto
  // permanen kosong di Sheets tanpa ada percobaan ulang. Lebih aman gagal
  // dengan jelas di sini supaya tetap masuk antrian & dicoba lagi.
  if(!syncSettings.cloudName || !syncSettings.uploadPreset) throw new Error('Cloudinary Cloud Name / Upload Preset belum diisi di Pengaturan — foto tidak bisa disync ke SheetDB.');
  const body = new FormData();
  body.append('file', dataUrl);
  body.append('upload_preset', syncSettings.uploadPreset);
  // pakai endpoint "auto" (bukan "image") supaya struk berformat PDF juga bisa
  // ke-upload, bukan cuma foto. Catatan: kalau upload preset di Cloudinary
  // membatasi tipe file "raw"/PDF untuk unsigned upload, aktifkan dulu di
  // Settings → Upload → Upload preset yang bersangkutan.
  const res = await fetch(`https://api.cloudinary.com/v1_1/${encodeURIComponent(syncSettings.cloudName)}/auto/upload`,{method:'POST',body});
  const json = await res.json().catch(()=>null);
  if(!res.ok || !json?.secure_url) throw new Error(json?.error?.message || 'Upload ke Cloudinary gagal');
  return json.secure_url;
}

// Sheets cuma nyaman untuk data flat (satu kolom = satu field). Field yang
// berupa array/object (items penjualan, entries stock opname) disimpan
// sebagai teks JSON di satu kolom saja.
function flattenForSheet(store,record){
  const r={...record};
  if(store==='sales' && Array.isArray(r.items)) r.items=JSON.stringify(r.items);
  if(store==='stocktakes' && Array.isArray(r.entries)) r.entries=JSON.stringify(r.entries);
  return r;
}

// SheetDB butuh path /id/{value} di depan tanda "?", bukan ditempel di
// belakang query string (misal ...?sheet=products). Helper ini masukin
// path tambahan di posisi yang benar biar URL-nya nggak rusak.
function withPath(url, extraPath){
  const [base, query] = url.split('?');
  return base.replace(/\/$/,'') + extraPath + (query ? '?' + query : '');
}

async function pushUpsert(store,recordId){
  const url = syncSettings.sheetdb[store];
  if(!url) throw new Error(`URL SheetDB untuk "${store}" belum diisi di Pengaturan.`);
  const rows = await dbAll(store);
  const record = rows.find(r=>String(r.id)===String(recordId));
  if(!record) return; // sudah kehapus lagi sebelum sempat sync, aman untuk diabaikan
  let next=record, patched=false;
  if(store==='products' && next.image && String(next.image).startsWith('data:')){
    next={...next, image: await uploadToCloudinary(next.image)}; patched=true;
  }
  if(store==='sales' && next.receipt && String(next.receipt).startsWith('data:')){
    next={...next, receipt: await uploadToCloudinary(next.receipt)}; patched=true;
  }
  if(patched) await dbPutRaw(store,next); // simpan URL hasil upload biar nggak diupload ulang tiap sync
  const payload = flattenForSheet(store,next);
  const patchRes = await fetch(withPath(url, `/id/${encodeURIComponent(recordId)}`),{
    method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify({data:payload})
  });
  if(patchRes.ok){
    const j = await patchRes.json().catch(()=>({}));
    if(j && j.updated) return; // baris sudah ada & berhasil diupdate
  }
  const postRes = await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:[payload]})});
  if(!postRes.ok) throw new Error(`SheetDB gagal membuat baris (${postRes.status})`);
}
async function pushDelete(store,recordId){
  const url = syncSettings.sheetdb[store];
  if(!url) throw new Error(`URL SheetDB untuk "${store}" belum diisi di Pengaturan.`);
  // SOFT DELETE: tandai baris "deleted" (bukan dihapus beneran dari Sheets).
  // Kalau baris beneran dihapus, device lain yang belum pernah menarik baris
  // ini akan menganggapnya baris itu tidak pernah ada (bukan "sudah dihapus"),
  // jadi delete tidak akan pernah ikut nyebar ke device lain.
  const patchRes = await fetch(withPath(url, `/id/${encodeURIComponent(recordId)}`),{
    method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify({data:{deleted:true, updatedAt:Date.now()}})
  });
  if(patchRes.ok){ const j=await patchRes.json().catch(()=>({})); if(j && j.updated) return; }
  if(patchRes.status===404) return; // baris memang belum pernah ke-push, aman diabaikan
  throw new Error(`SheetDB gagal menandai baris terhapus (${patchRes.status})`);
}

// Ringkasan Bisnis (Dashboard) bukan data mentah, jadi TIDAK ikut syncQueue
// seperti products/sales/expenses/stocktakes. Ini cuma satu baris (id:1) yang
// dihitung ulang & ditimpa tiap kali data berubah — kalau gagal sekali, tidak
// masalah karena percobaan berikutnya (reload berikutnya) selalu bawa angka
// yang sudah paling baru, bukan angka yang "ketinggalan" seperti record biasa.
// PENTING: sengaja HANYA kirim nama toko + angka hasil hitungan — cloudName/uploadPreset
// dan URL SheetDB lain (kredensial) tidak pernah ikut dikirim ke sini.
async function pushSummary(payload){
  const url = syncSettings.sheetdb.summary;
  if(!url) return;
  try{
    const body = {id:1, ...payload, updatedAt:new Date().toISOString()};
    const patchRes = await fetch(withPath(url, '/id/1'),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:body})});
    if(patchRes.ok){ const j=await patchRes.json().catch(()=>({})); if(j && j.updated) return; }
    const postRes = await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:[body]})});
    if(!postRes.ok) throw new Error(`SheetDB gagal menyimpan ringkasan (${postRes.status})`);
  }catch(err){
    console.warn('R-Preloved: gagal sync ringkasan bisnis, akan dicoba lagi di perubahan berikutnya.', err);
  }
}

let flushing = false;
async function flushSyncQueue(){
  if(flushing) return; // cegah beberapa flush jalan bareng & rebutan urutan
  if(!navigator.onLine) return;
  flushing=true; syncState={...syncState,syncing:true}; emitSyncState();
  try{
    while(true){
      const queue=await dbAll('syncQueue');
      queue.sort((a,b)=>a.id-b.id);
      const item=queue[0];
      if(!item){ syncState={...syncState,lastError:''}; break; } // antrian push kosong & tidak ada error tersisa
      try{
        if(item.action==='delete') await pushDelete(item.store,item.recordId);
        else await pushUpsert(item.store,item.recordId);
        await dbDeleteRaw('syncQueue',item.id);
      }catch(err){
        console.warn('R-Preloved sync: gagal, akan dicoba lagi nanti.',err);
        syncState={...syncState,lastError:String(err.message||err)};
        break; // hentikan dulu, sisa antrian dicoba lagi di trigger berikutnya (biar urutan tetap rapi)
      }
      await refreshPendingCount();
    }
  }finally{
    flushing=false; syncState={...syncState,syncing:false}; emitSyncState();
    await refreshPendingCount();
  }
}
window.addEventListener('online', ()=>flushSyncQueue());

// ---- PULL: tarik data dari SheetDB & gabungkan ke IndexedDB lokal ----
// Field yang perlu dikembalikan jadi Number (SheetDB/Google Sheets balikin
// semua kolom sebagai teks), dan field yang perlu di-parse balik dari JSON.
const NUMERIC_FIELDS = {
  products: ['price','cost','createdAt','updatedAt','soldAt'],
  sales: ['total','costTotal','paid','change','date','updatedAt'],
  expenses: ['amount','date','updatedAt'],
  stocktakes: ['date','updatedAt']
};
function isTruthyFlag(v){ return v===true || v==='TRUE' || v==='true' || v===1 || v==='1'; }
function unflattenFromSheet(store,raw){
  const r={...raw};
  if(store==='sales' && typeof r.items==='string'){ try{ r.items=JSON.parse(r.items)||[]; }catch(e){ r.items=[]; } }
  if(store==='stocktakes' && typeof r.entries==='string'){ try{ r.entries=JSON.parse(r.entries)||[]; }catch(e){ r.entries=[]; } }
  (NUMERIC_FIELDS[store]||[]).forEach(f=>{
    if(r[f]===undefined || r[f]==='') r[f]=undefined; else r[f]=Number(r[f]);
  });
  r.deleted = isTruthyFlag(r.deleted);
  return r;
}
async function pullStore(store){
  const url = syncSettings.sheetdb[store];
  if(!url) return;
  const res = await fetch(url);
  if(!res.ok) throw new Error(`Gagal menarik data "${store}" dari SheetDB (${res.status})`);
  const rows = await res.json().catch(()=>null);
  if(!Array.isArray(rows)) return;
  const local = await dbAll(store);
  const localById = new Map(local.map(r=>[String(r.id),r]));
  for(const raw of rows){
    if(!raw || !raw.id) continue;
    const remote = unflattenFromSheet(store,raw);
    const localRec = localById.get(String(remote.id));
    if(remote.deleted){
      if(localRec) await dbDeleteRaw(store,localRec.id); // ikut hapus, propagasi dari device lain
      continue;
    }
    const remoteTs = Number(remote.updatedAt)||0;
    const localTs = localRec ? (Number(localRec.updatedAt)||0) : -1;
    if(!localRec || remoteTs>localTs){
      await dbPutRaw(store,{...remote,id:localRec?localRec.id:remote.id}); // dbPutRaw = tidak memicu antrian push lagi
    }
  }
}
async function pullAll(){
  if(!navigator.onLine) return;
  let ok=true;
  for(const store of SYNCABLE_STORES){
    try{ await pullStore(store); }catch(err){ ok=false; console.warn('R-Preloved: gagal menarik data.',store,err); syncState={...syncState,lastError:String(err.message||err)}; emitSyncState(); }
  }
  if(ok){ syncState={...syncState,lastError:''}; emitSyncState(); }
}
const money = n => new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0);
const dateText = d => new Intl.DateTimeFormat('id-ID',{dateStyle:'medium',timeStyle:'short'}).format(new Date(d));
// UUID dipakai (bukan angka autoIncrement) supaya ID tetap unik walau
// dibuat dari device/HP keluarga yang berbeda-beda, sebelum sempat disync.
const uid = () => (window.crypto?.randomUUID ? crypto.randomUUID() : 'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10));
const parseNum = s => Number(String(s).replace(/[^\d]/g,''))||0;
const formatThousand = n => (n===''||n===null||n===undefined) ? '' : new Intl.NumberFormat('id-ID').format(n);
let sharedAudioCtx = null;
function unlockAudio(){
  try{
    const Ctx = window.AudioContext||window.webkitAudioContext;
    if(!Ctx) return;
    if(!sharedAudioCtx) sharedAudioCtx = new Ctx();
    if(sharedAudioCtx.state==='suspended') sharedAudioCtx.resume();
  }catch(e){}
}
function beep(kind='success'){
  try{
    const Ctx = window.AudioContext||window.webkitAudioContext;
    if(!Ctx) return;
    if(!sharedAudioCtx) sharedAudioCtx = new Ctx();
    const ctx = sharedAudioCtx;
    if(ctx.state==='suspended') ctx.resume();
    const now = ctx.currentTime;
    const tone=(freq,start,dur,type='sine',vol=0.4)=>{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type=type; o.frequency.setValueAtTime(freq, now+start);
      g.gain.setValueAtTime(0, now+start);
      g.gain.linearRampToValueAtTime(vol, now+start+0.006);
      g.gain.exponentialRampToValueAtTime(0.001, now+start+dur);
      o.connect(g); g.connect(ctx.destination);
      o.start(now+start); o.stop(now+start+dur+0.03);
    };
    if(kind==='success'){
      // chime dua nada naik, kesan "ding" checkout berhasil — bukan cuma satu "nit" datar
      tone(1318.5, 0, 0.1, 'sine', 0.5);   // E6
      tone(1975.5, 0.08, 0.16, 'sine', 0.45); // B6
    }else{
      // satu nada rendah tegas & agak panjang — jelas beda dari sukses, tidak berulang/spam
      tone(196, 0, 0.3, 'triangle', 0.45); // G3
    }
  }catch(e){}
}
const imgData = file => new Promise((resolve,reject)=>{
  if(!file) return resolve(null);
  const r=new FileReader(); r.onload=()=>resolve(r.result); r.onerror=reject; r.readAsDataURL(file);
});

// ===================== STRUK (RECEIPT) =====================
// Struk dibuat otomatis dari data transaksi (bukan upload foto bukti lagi).
// Bisa dicetak lewat (a) dialog print browser biasa (cocok kalau printer
// thermal/Bluetooth sudah terpasang sebagai printer di HP/laptop, mis. lewat
// app seperti RawBT/PrintHand), atau (b) langsung ke printer Bluetooth (ESC/POS)
// lewat Web Bluetooth — hanya didukung Chrome/Edge di Android, butuh printer
// thermal BLE yang kompatibel.

function wrapLine(s,width){
  s=String(s||'');
  const out=[];
  while(s.length>width){ out.push(s.slice(0,width)); s=s.slice(width); }
  out.push(s);
  return out;
}
function padRow(left,right,width){
  left=String(left||''); right=String(right||'');
  if(left.length+right.length+1>width) left=left.slice(0,Math.max(0,width-right.length-1));
  const spaces=Math.max(1,width-left.length-right.length);
  return left+' '.repeat(spaces)+right;
}
function buildReceiptLines(sale,settings){
  const width = settings.paperWidth===58?32:48;
  const div='-'.repeat(width);
  const lines=[];
  lines.push({t:settings.storeName||'Toko',align:'center',bold:true});
  if(settings.storeAddress) wrapLine(settings.storeAddress,width).forEach(l=>lines.push({t:l,align:'center'}));
  if(settings.storePhone) lines.push({t:settings.storePhone,align:'center'});
  lines.push({t:div});
  lines.push({t:dateText(sale.date)});
  lines.push({t:`No: ${String(sale.id).slice(0,20)}`});
  lines.push({t:div});
  sale.items.forEach(it=>{
    wrapLine(it.name,width).forEach(l=>lines.push({t:l}));
    lines.push({t:padRow(it.sku||'-',money(it.price),width)});
  });
  lines.push({t:div});
  lines.push({t:padRow('TOTAL',money(sale.total),width),bold:true});
  lines.push({t:padRow('Bayar',sale.payment,width)});
  if(sale.payment==='CASH'){
    lines.push({t:padRow('Tunai',money(sale.paid),width)});
    lines.push({t:padRow('Kembali',money(sale.change),width)});
  }
  lines.push({t:div});
  lines.push({t:'Terima kasih sudah belanja',align:'center'});
  lines.push({t:'Barang preloved sudah dicek',align:'center'});
  lines.push({t:'kondisinya sebelum dijual',align:'center'});
  return {lines,width};
}
function buildEscPos(sale,settings){
  const {lines,width}=buildReceiptLines(sale,settings);
  const bytes=[];
  const enc=s=>bytes.push(...new TextEncoder().encode(s));
  const ESC=0x1B, GS=0x1D;
  bytes.push(ESC,0x40); // reset printer
  let curAlign=null, curBold=null;
  lines.forEach(l=>{
    const align=l.align||'left', bold=!!l.bold;
    if(align!==curAlign){ bytes.push(ESC,0x61,align==='center'?1:align==='right'?2:0); curAlign=align; }
    if(bold!==curBold){ bytes.push(ESC,0x45,bold?1:0); curBold=bold; }
    enc(l.t+'\n');
  });
  bytes.push(ESC,0x45,0); bytes.push(ESC,0x61,0);
  enc('\n\n\n');
  bytes.push(GS,0x56,0x42,0x00); // feed + cut (diabaikan otomatis kalau printer tak punya pisau kertas)
  return new Uint8Array(bytes);
}

// UUID service/characteristic umum pada printer thermal Bluetooth Low Energy
// (banyak dipakai printer mini 58mm/80mm generik/Cina). Berbeda merk bisa beda.
const BT_PRINTER_CANDIDATES = [
  {service:'000018f0-0000-1000-8000-00805f9b34fb', characteristic:'00002af1-0000-1000-8000-00805f9b34fb'},
  {service:'49535343-fe7d-4ae5-8fa9-9fafd205e455', characteristic:'49535343-8841-43f4-a8d4-ecbe34729bb3'},
];
async function printEscPosBluetooth(bytes,onStatus){
  if(!navigator.bluetooth) throw new Error('Web Bluetooth tidak didukung di browser/perangkat ini. Pakai Chrome di Android, atau gunakan tombol "Cetak (Print biasa)".');
  onStatus?.('Pilih printer Bluetooth…');
  const device = await navigator.bluetooth.requestDevice({acceptAllDevices:true, optionalServices: BT_PRINTER_CANDIDATES.map(c=>c.service)});
  onStatus?.('Menghubungkan ke '+(device.name||'printer')+'…');
  const server = await device.gatt.connect();
  let writeChar=null;
  for(const cand of BT_PRINTER_CANDIDATES){
    try{ const svc=await server.getPrimaryService(cand.service); writeChar=await svc.getCharacteristic(cand.characteristic); break; }catch(e){}
  }
  if(!writeChar){
    try{
      const services=await server.getPrimaryServices();
      for(const svc of services){
        const chars=await svc.getCharacteristics();
        const found=chars.find(c=>c.properties.write||c.properties.writeWithoutResponse);
        if(found){writeChar=found;break;}
      }
    }catch(e){}
  }
  if(!writeChar){ device.gatt.disconnect(); throw new Error('Printer terhubung tapi tidak ditemukan channel cetak yang cocok (bukan printer ESC/POS?). Coba tombol "Cetak (Print biasa)".'); }
  onStatus?.('Mengirim data ke printer…');
  const CHUNK=180;
  for(let i=0;i<bytes.length;i+=CHUNK){
    const chunk=bytes.slice(i,i+CHUNK);
    if(writeChar.properties.writeWithoutResponse) await writeChar.writeValueWithoutResponse(chunk);
    else await writeChar.writeValue(chunk);
    await new Promise(r=>setTimeout(r,25));
  }
  onStatus?.('Struk terkirim ke printer.');
  try{device.gatt.disconnect();}catch(e){}
}

function Button({children,variant='primary',className='',...p}){
  const c={primary:'bg-slate-900 text-white hover:bg-slate-800',soft:'bg-slate-100 text-slate-800 hover:bg-slate-200',outline:'border border-slate-200 bg-white hover:bg-slate-50 text-slate-800',danger:'bg-red-50 text-red-600 hover:bg-red-100',green:'bg-emerald-600 text-white hover:bg-emerald-700'}[variant];
  return <button {...p} className={`inline-flex items-center justify-center gap-2 whitespace-nowrap min-h-[42px] px-4 rounded-xl font-semibold text-sm transition active:scale-[.98] disabled:opacity-50 disabled:pointer-events-none ${c} ${className}`}>{children}</button>
}
function Field({label,...p}){return <label className="block"><span className="block text-xs font-bold text-slate-500 mb-1.5">{label}</span><input {...p} className={`w-full h-11 px-3 rounded-xl border border-slate-200 bg-white outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 ${p.className||''}`}/></label>}
function NumberField({label,value,onChange,placeholder,required,prefix}){
  return <label className="block">
    <span className="block text-xs font-bold text-slate-500 mb-1.5">{label}</span>
    <div className="relative">
      {prefix&&<span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm">{prefix}</span>}
      <input type="text" inputMode="numeric" value={formatThousand(value)} onChange={e=>onChange(parseNum(e.target.value))} placeholder={placeholder} required={required} className={`w-full h-11 px-3 rounded-xl border border-slate-200 bg-white outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 ${prefix?'pl-8':''}`}/>
    </div>

}
function SearchInput({className='',...p}){

    <Icon name="search" size={18} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"/>

function Modal({title,onClose,children,wide=false}){
  return <div className="fixed inset-0 z-50 bg-slate-950/50 backdrop-blur-sm flex items-end md:items-center justify-center p-0 md:p-6">

function App(){
  const [tab,setTab]=useState('dashboard');
  const [products,setProducts]=useState([]);
  const [sales,setSales]=useState([]);
  const [expenses,setExpenses]=useState([]);
  const [stocktakes,setStocktakes]=useState([]);
  const [settings,setSettings]=useState({storeName:'R-Preloved',storeAddress:'',storePhone:'',paperWidth:80,cloudName:'',uploadPreset:'',sheetdb:{products:'',sales:'',expenses:'',stocktakes:'',summary:''}});
  const [loading,setLoading]=useState(true);
  const [modal,setModal]=useState(null);
  const [toast,setToast]=useState('');
  const [search,setSearch]=useState('');
  const [sync,setSync]=useState({pending:0,syncing:false,lastError:''});
  useEffect(()=>onSyncStateChange(setSync),[]);
  const cloudConfigured = Object.values(settings.sheetdb||{}).some(Boolean);

  const reload=async(initial=false)=>{
    try{
      const [p,s,e,st,set]=await Promise.all([
        dbAll('products'),dbAll('sales'),dbAll('expenses'),dbAll('stocktakes'),dbAll('settings')
      ]);
      setProducts(Array.isArray(p)?p:[]);
      setSales(Array.isArray(s)?s:[]);
      setExpenses(Array.isArray(e)?e:[]);
      setStocktakes(Array.isArray(st)?st:[]);
      let storeName='R-Preloved';
      if(Array.isArray(set) && set[0]){
        setSettings(set[0]);
        storeName=set[0].storeName||storeName;
        syncSettings = {cloudName:set[0].cloudName||'', uploadPreset:set[0].uploadPreset||'', sheetdb:set[0].sheetdb||{products:'',sales:'',expenses:'',stocktakes:'',summary:''}};
      }
      if(!idbSupported) setToast('Penyimpanan permanen tidak tersedia di sini — data hanya tersimpan sementara selama sesi ini.');
      refreshPendingCount();
      flushSyncQueue();
      // Hitung ulang Ringkasan Bisnis dari data TERBARU (p,s,e) yang barusan
      // dibaca, lalu kirim ke sheet Ringkasan kalau URL-nya sudah diisi.
      // Fire-and-forget: tidak menunggu, dan tidak memblok tampilan.
      const soldP=Array.isArray(s)?s.reduce((a,x)=>a+x.total,0):0;
      const cogsP=Array.isArray(s)?s.reduce((a,x)=>a+x.costTotal,0):0;
      const expP=Array.isArray(e)?e.reduce((a,x)=>a+x.amount,0):0;
      const stockP=(Array.isArray(p)?p:[]).filter(x=>x.status!=='sold');
      pushSummary({
        storeName,
        penjualan: soldP,
        modalTerjual: cogsP,
        pengeluaran: expP,
        labaBersih: soldP-cogsP-expP,
        stokAktif: stockP.length,
        nilaiModalStok: stockP.reduce((a,x)=>a+x.cost,0),
        totalTransaksi: Array.isArray(s)?s.length:0
      });
    }catch(err){
      console.error('R-Preloved storage error:',err);
      // Jangan hapus data yang sudah tampil di layar hanya karena satu kali baca gagal —
      // biarkan tampilan lama tetap ada, cukup beri tahu lewat toast.
      setToast('Gagal memuat data terbaru. Data lama tetap ditampilkan.');
    }finally{
      setLoading(false);
    }
  };
  // Sync 2 arah: push antrian lokal dulu, lalu tarik data dari SheetDB dan
  // gabungkan ke IndexedDB, lalu muat ulang tampilan. Dipanggil saat app
  // dibuka, tiap ~20 detik, saat tab difokuskan lagi, dan saat online lagi.
  const pullNow=async()=>{
    if(!Object.values(syncSettings.sheetdb||{}).some(Boolean)) return;
    try{ await flushSyncQueue(); await pullAll(); await reload(); }
    catch(err){ console.warn('R-Preloved: sync 2 arah gagal.',err); }
  };
  useEffect(()=>{reload(true).then(()=>pullNow())},[]);
  useEffect(()=>{
    const id=setInterval(pullNow,20000);
    const onFocus=()=>pullNow();
    const onOnline=()=>pullNow();
    window.addEventListener('focus',onFocus);
    window.addEventListener('online',onOnline);
    return ()=>{clearInterval(id);window.removeEventListener('focus',onFocus);window.removeEventListener('online',onOnline)};
  },[]);
  useEffect(()=>{
    const unlock=()=>{unlockAudio()};
    document.addEventListener('click',unlock,{once:true});
    document.addEventListener('touchstart',unlock,{once:true});
    return ()=>{document.removeEventListener('click',unlock);document.removeEventListener('touchstart',unlock);};
  },[]);
  useEffect(()=>{if(toast){const t=setTimeout(()=>setToast(''),2600);return()=>clearTimeout(t)}},[toast]);

  const stats=useMemo(()=>{
    const sold=sales.reduce((a,s)=>a+s.total,0);
    const cogs=sales.reduce((a,s)=>a+s.costTotal,0);
    const exp=expenses.reduce((a,e)=>a+e.amount,0);
    const stock=products.filter(p=>p.status!=='sold');
    return {sold,cogs,exp,profit:sold-cogs-exp,stockValue:stock.reduce((a,p)=>a+p.cost,0),stockCount:stock.length,soldCount:sales.reduce((a,s)=>a+s.items.length,0)};
  },[products,sales,expenses]);

  const saveProduct=async(data)=>{
    try{
      await dbPut('products',{...data,id:data.id||uid(),createdAt:data.createdAt||Date.now()});
      await reload();setModal(null);setToast(data.id?'Produk diperbarui':'Produk berhasil ditambahkan');
    }catch(err){console.error(err);setToast('Gagal menyimpan produk. Coba lagi.')}
  };
  const removeProduct=async(id)=>{if(!confirm('Hapus produk ini?'))return;try{await dbDelete('products',id);await reload();setToast('Produk dihapus')}catch(err){console.error(err);setToast('Gagal menghapus produk.')}};
  const saveExpense=async(data)=>{try{await dbPut('expenses',{...data,id:data.id||uid(),date:data.date||Date.now()});await reload();setModal(null);setToast('Pengeluaran tersimpan')}catch(err){console.error(err);setToast('Gagal menyimpan pengeluaran.')}};
  const sell=async(items,payment,paid)=>{
    try{
      const now=Date.now(), total=items.reduce((a,i)=>a+i.price,0), costTotal=items.reduce((a,i)=>a+i.cost,0);
      const sale={id:uid(),date:now,items,total,costTotal,payment,paid:Number(paid)||0,change:Math.max(0,(Number(paid)||0)-total)};
      await dbPut('sales',sale);
      for(const i of items){const p=products.find(x=>x.id===i.id);if(p) await dbPut('products',{...p,status:'sold',soldAt:now,saleId:sale.id});}
      await reload();setModal({type:'receipt',data:sale});setToast(`Penjualan ${money(total)} berhasil`);
    }catch(err){console.error(err);setToast('Gagal menyimpan penjualan. Coba lagi.')}
  };
  const doStocktake=async(entries)=>{
    try{
      await dbPut('stocktakes',{id:uid(),date:Date.now(),entries});
      for(const e of entries){const p=products.find(x=>x.id===e.id);if(p && e.status==='sold' && p.status!=='sold') await dbPut('products',{...p,status:'sold'}); if(p && e.status==='available' && p.status==='sold') await dbPut('products',{...p,status:'available'});}
      await reload();setModal(null);setToast('Stock opname tersimpan');
    }catch(err){console.error(err);setToast('Gagal menyimpan stock opname.')}
  };

  const nav=[
    ['dashboard','Dashboard','grid'],['products','Produk','shirt'],['sales','Penjualan','cart'],['finance','Keuangan','wallet'],['stocktake','Stock Opname','box','Opname']
  ];
  if(loading) return <div className="min-h-screen bg-slate-950 text-white flex items-center justify-center p-6"><div className="text-center"><div className="mx-auto mb-4 w-12 h-12 rounded-2xl bg-white/10 flex items-center justify-center"><Icon name="shirt" size={25}/></div><div className="font-black text-xl">R-Preloved</div><div className="text-sm text-slate-400 mt-1">Menyiapkan aplikasi…</div></div></div>;

  return <div className="min-h-screen">
    <aside className="hidden md:flex fixed left-0 top-0 bottom-0 desktop-sidebar bg-slate-950 text-white flex-col p-4 z-30">
      <div className="px-3 py-4 mb-4"><div className="font-black text-xl">R-Preloved</div><div className="text-xs text-slate-400 mt-1">Inventory • Sales • Finance</div></div>
      <nav className="space-y-1">
        {nav.map(([id,label,icon])=><button key={id} onClick={()=>setTab(id)} className={`w-full flex items-center gap-3 px-3 py-3 rounded-xl text-sm font-semibold ${tab===id?'bg-white text-slate-900':'text-slate-300 hover:bg-white/10'}`}><Icon name={icon}/>{label}</button>)}
      </nav>
      <div className="mt-auto"><button onClick={()=>setModal({type:'settings'})} className="w-full flex items-center gap-3 px-3 py-3 rounded-xl text-sm text-slate-300 hover:bg-white/10"><Icon name="settings"/>Pengaturan</button></div>
    </aside>

    <main className="desktop-content min-h-screen pb-24 md:pb-8">
      <header className="sticky top-0 z-20 bg-white/90 backdrop-blur border-b border-slate-100">
        <div className="max-w-7xl mx-auto px-4 md:px-7 h-16 flex items-center justify-between">
          <div><div className="md:hidden font-black">R-Preloved</div><div className="hidden md:block text-sm text-slate-500">{nav.find(x=>x[0]===tab)?.[1]}</div></div>
          <div className="flex items-center gap-2">
            {cloudConfigured && <button type="button" onClick={()=>pullNow()} title={sync.syncing?'Menyinkronkan…':sync.pending?`${sync.pending} menunggu sync`:(sync.lastError||'Tersinkron — tap untuk sync sekarang')} aria-label="Sinkron" className={`w-10 h-10 shrink-0 rounded-xl bg-white border border-slate-200 flex items-center justify-center transition active:scale-95 hover:bg-slate-50 ${sync.syncing?'text-indigo-600':sync.pending?'text-amber-600':'text-emerald-600'}`}>
              <Icon name={sync.syncing?'upload':sync.pending?'box':'check'} size={16}/>
            </button>}
            <Button variant="soft" className="px-3" aria-label="Scan SKU" onClick={()=>{unlockAudio();setModal({type:'scanner'})}}><Icon name="scan" size={18}/><span className="hidden sm:inline">Scan SKU</span></Button>
            <Button className="px-3" aria-label="Tambah Produk" onClick={()=>setModal({type:'product'})}><Icon name="plus" size={18}/><span className="hidden sm:inline">Produk</span></Button>
          </div>
        </div>
      </header>
      {cloudConfigured && sync.lastError && <div className="max-w-7xl mx-auto px-4 md:px-7 pt-3"><div className="bg-amber-50 text-amber-700 text-xs font-semibold px-3.5 py-2.5 rounded-xl">⚠ Sync gagal: {sync.lastError}</div></div>}
      <div className="max-w-7xl mx-auto px-4 md:px-7 py-5">
        {tab==='dashboard' && <Dashboard stats={stats} products={products} sales={sales} onSell={()=>setModal({type:'sale'})} onScan={()=>{unlockAudio();setModal({type:'scanner'})}} onAddProduct={()=>setModal({type:'product'})} onReport={()=>setTab('finance')} />}

// Scanner khusus buat ISI kolom SKU pas tambah/edit produk — beda dari
// ScannerModal (yang buat CARI produk yang SUDAH ADA saat jualan). Di sini
// kode hasil scan langsung dipakai apa adanya sebagai SKU baru, tidak
// dicocokkan ke daftar produk.
function SkuScanModal({onClose,onDetected}){
  const videoRef=useRef(null), streamRef=useRef(null), timerRef=useRef(null);
  const [status,setStatus]=useState('Menyiapkan kamera…');
  const [manual,setManual]=useState('');
  const activeRef=useRef(true), doneRef=useRef(false);

  const detected=(code)=>{
    if(doneRef.current) return; // cegah kepanggil dobel dari frame kamera berikutnya
    const clean=String(code).trim();
    if(!clean) return;
    doneRef.current=true;
    beep('success');
    cleanup();
    onDetected(clean);
  };
  const cleanup=()=>{activeRef.current=false;if(timerRef.current)cancelAnimationFrame(timerRef.current);streamRef.current?.getTracks().forEach(t=>t.stop())};
  useEffect(()=>{
    activeRef.current=true;
    (async()=>{
      try{
        if(!navigator.mediaDevices?.getUserMedia) throw new Error('Kamera tidak didukung browser');
        const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
        if(!activeRef.current)return;s.getTracks().forEach(t=>t.enabled=true);streamRef.current=s;videoRef.current.srcObject=s;await videoRef.current.play();
        if('BarcodeDetector' in window){
          const formats=await BarcodeDetector.getSupportedFormats();
          const detector=new BarcodeDetector({formats:formats.filter(f=>['code_128','code_39','ean_13','ean_8','upc_a','upc_e','qr_code'].includes(f))});
          const scan=async()=>{if(!activeRef.current||doneRef.current)return;try{const codes=await detector.detect(videoRef.current);if(codes.length){detected(codes[0].rawValue)}}catch(e){}if(!doneRef.current)timerRef.current=requestAnimationFrame(scan)};
          timerRef.current=requestAnimationFrame(scan);setStatus('Arahkan barcode ke kotak pemindai.');
        }else setStatus('BarcodeDetector belum tersedia. Ketik SKU manual.');
      }catch(e){setStatus('Kamera tidak dapat diakses. Cek izin kamera atau ketik SKU manual.')}
    })();
    return cleanup;
  },[]);
  return <Modal title="Scan Barcode untuk SKU" onClose={()=>{cleanup();onClose()}}>
    <div className="space-y-4">
      <div className="relative rounded-2xl overflow-hidden bg-slate-950 aspect-video flex items-center justify-center"><video ref={videoRef} playsInline muted className="w-full h-full object-cover"/><div className="absolute inset-1/4 scan-box rounded-2xl pointer-events-none"></div><div className="absolute bottom-3 left-0 right-0 text-center text-xs font-semibold text-white drop-shadow px-3">{status}</div></div>
      <div className="flex gap-2"><input autoFocus value={manual} onChange={e=>setManual(e.target.value)} onKeyDown={e=>e.key==='Enter'&&detected(manual)} placeholder="Ketik / scan SKU (auto Enter)…" className="flex-1 min-w-0 h-11 px-3 rounded-xl border border-slate-200 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"/><Button onClick={()=>detected(manual)} className="shrink-0">Pakai</Button></div>
      <div className="text-xs text-slate-400 text-center">Barcode fisik (label baju/kemasan) atau alat scanner USB/Bluetooth juga bisa langsung diketik ke kolom di atas.</div>
    </div>
  </Modal>
}

        <div><div className="text-xs font-bold text-slate-500 mb-2">Metode pembayaran</div><div className="grid grid-cols-2 gap-2">{['CASH','QRIS'].map(x=><button type="button" key={x} onClick={()=>setPayment(x)} className={`h-11 rounded-xl font-bold text-sm ${payment===x?'bg-slate-900 text-white':'bg-white border border-slate-200'}`}>{x}</button>)}</div></div>
        {payment==='CASH'&&<><NumberField label="Uang Diterima" prefix="Rp" value={paid} onChange={v=>setPaid(v)}/><div className="flex justify-between rounded-xl bg-emerald-50 text-emerald-700 p-3"><span className="font-semibold">Kembalian</span><b>{money(change)}</b></div></>}
        <div className="rounded-xl bg-white border border-dashed border-slate-300 p-3 flex items-center gap-2.5 text-xs text-slate-500"><Icon name="receipt" size={16} className="shrink-0 text-slate-400"/><span>Struk dibuat otomatis setelah transaksi dikonfirmasi — bisa langsung dicetak lewat printer thermal/Bluetooth.</span></div>
        <Button disabled={!items.length} onClick={submit} className="w-full" variant="green"><Icon name="check" size={18}/><span>Konfirmasi Terjual</span></Button>
      </div>
    </div>
    {scanning && <ScannerModal products={active.filter(p=>!items.some(x=>x.id===p.id))} onClose={()=>setScanning(false)} onFound={addMany}/>}
  </Modal>
}

function ScannerModal({products,onClose,onFound}){
  const videoRef=useRef(null), streamRef=useRef(null), timerRef=useRef(null);
  const [status,setStatus]=useState('Menyiapkan kamera…');
  const [manual,setManual]=useState('');
  const [cart,setCart]=useState([]);
  const activeRef=useRef(true), cooldownRef=useRef(false);
  const cartRef=useRef(cart); cartRef.current=cart;

  const find=(code)=>{
    if(cooldownRef.current) return;
    const clean=String(code).trim();
    if(!clean) return;
    const p=products.find(x=>String(x.sku).toLowerCase()===clean.toLowerCase());
    if(!p){ beep('error'); setStatus(`SKU "${clean}" tidak ditemukan.`); return; }
    if(p.status==='sold'){ beep('error'); setStatus(`"${p.name}" sudah terjual sebelumnya.`); return; }
    if(cartRef.current.some(x=>x.id===p.id)){ beep('error'); setStatus(`"${p.name}" sudah ada di keranjang.`); return; }
    beep('success');
    setCart(x=>[...x,p]);
    setStatus(`✓ Ditambahkan: ${p.name}`);
    setManual('');
    // jeda sebentar biar barcode yang sama tidak ke-scan dobel oleh frame berikutnya
    cooldownRef.current=true;
    setTimeout(()=>{ cooldownRef.current=false; if(activeRef.current) setStatus('Arahkan barcode berikutnya ke kotak pemindai.'); },900);
  };
  const removeFromCart=id=>setCart(x=>x.filter(p=>p.id!==id));
  const cleanup=()=>{activeRef.current=false;if(timerRef.current)cancelAnimationFrame(timerRef.current);streamRef.current?.getTracks().forEach(t=>t.stop())};
  useEffect(()=>{
    activeRef.current=true;
    (async()=>{
      try{
        if(!navigator.mediaDevices?.getUserMedia) throw new Error('Kamera tidak didukung browser');
        const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
        if(!activeRef.current)return;s.getTracks().forEach(t=>t.enabled=true);streamRef.current=s;videoRef.current.srcObject=s;await videoRef.current.play();
        if('BarcodeDetector' in window){
          const formats=await BarcodeDetector.getSupportedFormats();
          const detector=new BarcodeDetector({formats:formats.filter(f=>['code_128','code_39','ean_13','ean_8','upc_a','upc_e','qr_code'].includes(f))});
          const scan=async()=>{if(!activeRef.current)return;try{const codes=await detector.detect(videoRef.current);if(codes.length){find(codes[0].rawValue)}}catch(e){}timerRef.current=requestAnimationFrame(scan)};
          timerRef.current=requestAnimationFrame(scan);setStatus('Arahkan barcode ke kotak pemindai.');
        }else setStatus('BarcodeDetector belum tersedia. Masukkan SKU manual.');
      }catch(e){setStatus('Kamera tidak dapat diakses. Cek izin kamera atau gunakan SKU manual.')}
    })();
    return cleanup;
  },[]);
  const total=cart.reduce((a,p)=>a+p.price,0);
  const finish=()=>{ if(!cart.length) return; cleanup(); onFound(cart); };
  return <Modal title="Scan Barcode" onClose={()=>{cleanup();onClose()}}>
    <div className="space-y-4">
      <div className="relative rounded-2xl overflow-hidden bg-slate-950 aspect-video flex items-center justify-center"><video ref={videoRef} playsInline muted className="w-full h-full object-cover"/><div className="absolute inset-1/4 scan-box rounded-2xl pointer-events-none"></div><div className="absolute bottom-3 left-0 right-0 text-center text-xs font-semibold text-white drop-shadow px-3">{status}</div></div>
      <div className="flex gap-2"><input autoFocus value={manual} onChange={e=>setManual(e.target.value)} onKeyDown={e=>e.key==='Enter'&&find(manual)} placeholder="Ketik / scan SKU (auto Enter)…" className="flex-1 min-w-0 h-11 px-3 rounded-xl border border-slate-200 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"/><Button onClick={()=>find(manual)} className="shrink-0">Tambah</Button></div>
      <div className="flex items-center justify-between"><div className="text-xs font-bold text-slate-500">Keranjang scan ({cart.length})</div>{cart.length>0 && <div className="text-sm font-black">{money(total)}</div>}</div>
      <div className="border border-slate-100 rounded-2xl overflow-hidden max-h-48 overflow-y-auto">
        {cart.map(p=><div key={p.id} className="flex items-center gap-3 p-3 border-b last:border-0"><div className="w-9 h-9 rounded-lg bg-slate-100 flex items-center justify-center shrink-0">{p.image?<img src={p.image} className="w-9 h-9 rounded-lg object-cover"/>:<Icon name="shirt" size={16}/>}</div><div className="flex-1 min-w-0"><b className="text-sm block truncate">{p.name}</b><div className="text-xs text-slate-400 truncate">{p.sku}</div></div><b className="shrink-0 text-sm">{money(p.price)}</b><button type="button" onClick={()=>removeFromCart(p.id)} aria-label="Hapus dari keranjang" className="p-1.5 text-red-500 shrink-0 active:scale-95 transition"><Icon name="x" size={16}/></button></div>)}
        {!cart.length&&<div className="p-4 text-xs text-slate-400 text-center">Scan barcode tiap barang satu per satu, kamera tidak akan tertutup. Ketika sudah selesai, klik "Lanjut ke Pembayaran".</div>}
      </div>
      <Button disabled={!cart.length} onClick={finish} className="w-full" variant="green"><Icon name="cart" size={18}/><span>Lanjut ke Pembayaran{cart.length?` (${cart.length} barang)`:''}</span></Button>
    </div>
  </Modal>
}

function ReceiptModal({sale,settings,onClose}){
  const {lines,width}=useMemo(()=>buildReceiptLines(sale,settings),[sale,settings]);
  const [status,setStatus]=useState('');
  const [busy,setBusy]=useState(false);
  const printBrowser=()=>{ window.print(); };
  const printBluetooth=async()=>{
    setBusy(true); setStatus('');
    try{
      const bytes=buildEscPos(sale,settings);
      await printEscPosBluetooth(bytes,setStatus);
    }catch(err){ console.error(err); setStatus(err.message||'Gagal mencetak ke printer Bluetooth.'); }
    finally{ setBusy(false); }
  };
  return <Modal title="Struk" onClose={onClose}>
    <div className="space-y-4">
      <div className="rounded-2xl bg-slate-950 p-4 overflow-x-auto">
        <pre className="text-[11px] leading-[1.35] text-emerald-300 font-mono whitespace-pre" style={{width:width+'ch'}}>
{lines.map(l=>{
  const pad=l.align==='center'?Math.max(0,Math.floor((width-l.t.length)/2)):0;
  return (pad>0?' '.repeat(pad):'')+l.t;
}).join('\n')}
        </pre>
      </div>
      {status && <div className="text-xs font-semibold text-slate-500 text-center">{status}</div>}
      <div className="grid grid-cols-1 gap-2">
        <Button onClick={printBrowser} className="w-full"><Icon name="printer" size={18}/><span>Cetak (Print biasa / printer terpasang)</span></Button>
        <Button onClick={printBluetooth} disabled={busy} variant="outline" className="w-full"><Icon name="bluetooth" size={18}/><span>{busy?'Mencetak…':'Cetak Langsung ke Printer Bluetooth (ESC/POS)'}</span></Button>
      </div>
      <div className="text-xs text-slate-400 leading-relaxed">
        <b>Cetak biasa</b> memakai dialog print browser — cocok kalau printer thermal/Bluetooth kamu sudah terpasang sebagai printer di HP/laptop (mis. lewat app driver seperti RawBT/PrintHand).<br/>
        <b>Cetak langsung Bluetooth</b> mengirim data mentah (ESC/POS) langsung ke printer thermal lewat Web Bluetooth — hanya jalan di Chrome/Edge Android dan printer yang kompatibel BLE.
      </div>
      <Button variant="soft" onClick={onClose} className="w-full">Tutup</Button>
    </div>
    <div id="print-receipt">
      <pre style={{fontFamily:'monospace',fontSize:'11px',lineHeight:1.35,whiteSpace:'pre-wrap',width:'100%'}}>
{lines.map(l=>{
  const pad=l.align==='center'?Math.max(0,Math.floor((width-l.t.length)/2)):0;
  return (pad>0?' '.repeat(pad):'')+l.t;
}).join('\n')}
      </pre>
    </div>
  </Modal>
}

function Sales({sales,onSell,onPrint}){
  const [q,setQ]=useState('');
  const list=sales.filter(s=>s.items.some(i=>(i.name+' '+i.sku).toLowerCase().includes(q.toLowerCase())));
  return <div className="space-y-4"><div className="flex justify-between items-center"><div><h1 className="text-2xl font-black">Penjualan</h1><p className="text-sm text-slate-500">Riwayat transaksi offline.</p></div><Button onClick={onSell}><Icon name="plus" size={18}/><span>Penjualan</span></Button></div><input value={q} onChange={e=>setQ(e.target.value)} placeholder="Cari transaksi / SKU…" className="w-full h-11 px-4 rounded-xl border border-slate-200 bg-white"/><div className="space-y-3">{list.slice().sort((a,b)=>b.date-a.date).map(s=><div key={s.id} className="bg-white rounded-2xl border border-slate-100 p-4 shadow-soft"><div className="flex justify-between gap-3"><div><b>{s.items.map(i=>i.name).join(', ')}</b><div className="text-xs text-slate-400 mt-1">{dateText(s.date)} • {s.items.length} item • <span className="font-bold">{s.payment}</span></div></div><b className="text-lg">{money(s.total)}</b></div><div className="mt-3 pt-3 border-t text-xs text-slate-500 flex justify-between items-center"><span>Modal {money(s.costTotal)}</span><span className="font-bold text-emerald-600">Margin {money(s.total-s.costTotal)}</span></div><button type="button" onClick={()=>onPrint(s)} className="mt-3 w-full flex items-center justify-center gap-2 h-10 rounded-xl border border-slate-200 text-sm font-bold text-slate-700 active:scale-[.98] transition"><Icon name="printer" size={16}/>Cetak Struk</button></div>)}{!list.length&&<Empty text="Belum ada penjualan."/>}</div></div>
}

function Finance({stats,expenses,onExpense}){
  return <div className="space-y-5"><div className="flex justify-between items-center"><div><h1 className="text-2xl font-black">Keuangan</h1><p className="text-sm text-slate-500">Pemasukan, modal, pengeluaran & laba.</p></div><Button onClick={onExpense}><Icon name="plus" size={18}/><span>Pengeluaran</span></Button></div>
    <div className="grid grid-cols-2 lg:grid-cols-4 gap-3"><Kpi title="Pemasukan" value={stats.sold}/><Kpi title="Modal barang terjual" value={-stats.cogs}/><Kpi title="Pengeluaran" value={-stats.exp}/><Kpi title="Laba bersih" value={stats.profit}/></div>
    <div className="bg-white rounded-3xl border border-slate-100 shadow-soft p-5"><h2 className="font-extrabold mb-4">Pengeluaran</h2>{expenses.slice().sort((a,b)=>b.date-a.date).map(e=><div key={e.id} className="flex justify-between py-3 border-b last:border-0"><div><b className="text-sm">{e.name}</b><div className="text-xs text-slate-400">{e.category} • {dateText(e.date)}</div></div><b>{money(e.amount)}</b></div>)}{!expenses.length&&<Empty text="Belum ada pengeluaran."/>}</div>
    <div className="bg-indigo-50 rounded-3xl p-5"><div className="font-extrabold">Rumus laporan</div><div className="text-sm text-slate-600 mt-2">Laba kotor = Penjualan − Modal barang terjual. Laba bersih = Laba kotor − Pengeluaran operasional.</div></div>
  </div>
}
function Kpi({title,value}){return <div className="bg-white rounded-2xl border border-slate-100 p-4 shadow-soft min-w-0"><div className="text-xs text-slate-500 font-bold truncate">{title}</div><div className={`text-xl font-black mt-2 truncate ${value<0?'text-red-600':'text-slate-900'}`}>{money(Math.abs(value))}</div></div>}

function ExpenseModal({onClose,onSave}){const [f,setF]=useState({name:'',category:'Operasional',amount:''});const s=(k,v)=>setF(x=>({...x,[k]:v}));return <Modal title="Tambah Pengeluaran" onClose={onClose}><form onSubmit={e=>{e.preventDefault();onSave({...f,amount:Number(f.amount)||0})}} className="space-y-4"><Field label="Nama pengeluaran" value={f.name} onChange={e=>s('name',e.target.value)} required/><label className="block"><span className="block text-xs font-bold text-slate-500 mb-1.5">Kategori</span><select value={f.category} onChange={e=>s('category',e.target.value)} className="w-full h-11 px-3 rounded-xl border border-slate-200"><option>Operasional</option><option>Packaging</option><option>Transport</option><option>Marketing</option><option>Lainnya</option></select></label><NumberField label="Nominal" prefix="Rp" value={f.amount} onChange={v=>s('amount',v)} required/><Button className="w-full">Simpan Pengeluaran</Button></form></Modal>}

function Stocktake({products,stocktakes,onRun}){const active=products.filter(p=>p.status!=='sold');return <div className="space-y-5"><div className="flex justify-between items-center"><div><h1 className="text-2xl font-black">Stock Opname</h1><p className="text-sm text-slate-500">Cocokkan stok fisik dengan database.</p></div><Button onClick={onRun}><Icon name="box" size={18}/><span>Mulai Opname</span></Button></div><div className="grid grid-cols-2 gap-3"><Kpi title="Stok aktif" value={active.length}/><Kpi title="Riwayat opname" value={stocktakes.length}/></div><div className="bg-white rounded-3xl border border-slate-100 shadow-soft p-5"><h2 className="font-extrabold mb-3">Riwayat</h2>{stocktakes.slice().sort((a,b)=>b.date-a.date).map(s=><div key={s.id} className="flex justify-between py-3 border-b last:border-0"><span className="text-sm">{dateText(s.date)}</span><span className="text-sm font-bold">{s.entries.length} item diperiksa</span></div>)}{!stocktakes.length&&<Empty text="Belum ada stock opname."/>}</div></div>}

function StocktakeModal({products,onClose,onSave}){const [rows,setRows]=useState(products.map(p=>({id:p.id,status:p.status==='sold'?'sold':'available'})));const set=(id,v)=>setRows(r=>r.map(x=>x.id===id?{...x,status:v}:x));return <Modal title="Stock Opname" onClose={onClose} wide><div className="space-y-3 max-h-[55vh] overflow-auto">{rows.map(r=>{const p=products.find(x=>x.id===r.id);return <div key={r.id} className="flex items-center gap-3 p-3 rounded-xl bg-slate-50"><div className="flex-1"><b className="text-sm">{p.name}</b><div className="text-xs text-slate-400">{p.sku}</div></div><select value={r.status} onChange={e=>set(r.id,e.target.value)} className="h-10 rounded-lg border border-slate-200 px-2 bg-white text-sm"><option value="available">Ada</option><option value="sold">Terjual</option></select></div>})}</div><Button className="w-full mt-4" onClick={()=>onSave(rows)}>Simpan Stock Opname</Button></Modal>}

function SettingsModal({settings,onClose,onSave}){
  const [name,setName]=useState(settings.storeName||'R-Preloved');
  const [address,setAddress]=useState(settings.storeAddress||'');
  const [phone,setPhone]=useState(settings.storePhone||'');
  const [paperWidth,setPaperWidth]=useState(settings.paperWidth||80);
  const [cloudName,setCloudName]=useState(settings.cloudName||'');
  const [uploadPreset,setUploadPreset]=useState(settings.uploadPreset||'');
  const [sheetdb,setSheetdb]=useState(settings.sheetdb||{products:'',sales:'',expenses:'',stocktakes:'',summary:''});
  const setUrl=(k,v)=>setSheetdb(x=>({...x,[k]:v}));
  return <Modal title="Pengaturan" onClose={onClose}>
    <div className="space-y-5">
      <Field label="Nama toko" value={name} onChange={e=>setName(e.target.value)}/>
      <Field label="Alamat toko (tampil di struk, opsional)" value={address} onChange={e=>setAddress(e.target.value)}/>
      <Field label="No. telepon (tampil di struk, opsional)" value={phone} onChange={e=>setPhone(e.target.value)}/>
      <label className="block"><span className="block text-xs font-bold text-slate-500 mb-1.5">Lebar kertas printer thermal</span><select value={paperWidth} onChange={e=>setPaperWidth(Number(e.target.value))} className="w-full h-11 px-3 rounded-xl border border-slate-200 bg-white"><option value={80}>80mm (48 kolom)</option><option value={58}>58mm (32 kolom)</option></select></label>
      <div className="rounded-2xl bg-slate-50 p-4 text-sm space-y-1.5">
        <div><b>Penyimpanan utama:</b> IndexedDB di browser/HP ini — tetap jalan tanpa internet.</div>
        <div>Sinkron cloud di bawah bersifat <b>opsional</b> dan satu arah (HP → cloud). Kosongkan semua kalau mau tetap 100% offline seperti biasa.</div>
      </div>
      <div className="space-y-3">
        <div className="font-extrabold text-sm">Sinkron Cloud (opsional)</div>
        <Field label="Cloudinary Cloud Name" value={cloudName} onChange={e=>setCloudName(e.target.value.trim())} placeholder="Kosongkan kalau tidak dipakai"/>
        <Field label="Cloudinary Upload Preset (unsigned)" value={uploadPreset} onChange={e=>setUploadPreset(e.target.value.trim())} placeholder="mis. ml_default"/>
        <Field label="SheetDB URL — Produk" value={sheetdb.products} onChange={e=>setUrl('products',e.target.value.trim())} placeholder="https://sheetdb.io/api/v1/xxxxx?sheet=products"/>
        <Field label="SheetDB URL — Penjualan" value={sheetdb.sales} onChange={e=>setUrl('sales',e.target.value.trim())} placeholder="https://sheetdb.io/api/v1/xxxxx?sheet=sales"/>
        <Field label="SheetDB URL — Pengeluaran" value={sheetdb.expenses} onChange={e=>setUrl('expenses',e.target.value.trim())} placeholder="https://sheetdb.io/api/v1/xxxxx?sheet=expenses"/>
        <Field label="SheetDB URL — Stock Opname" value={sheetdb.stocktakes} onChange={e=>setUrl('stocktakes',e.target.value.trim())} placeholder="https://sheetdb.io/api/v1/xxxxx?sheet=stocktakes"/>
        <Field label="SheetDB URL — Ringkasan Bisnis" value={sheetdb.summary} onChange={e=>setUrl('summary',e.target.value.trim())} placeholder="https://sheetdb.io/api/v1/xxxxx?sheet=summary"/>
        <div className="text-xs text-slate-400 -mt-1">Sheet ini otomatis diisi 1 baris berisi nama toko & angka laba/penjualan/stok — dihitung ulang tiap ada perubahan data. API Key & URL di atas tidak pernah ikut disync ke sini.</div>
        <div className="rounded-xl bg-amber-50 text-amber-800 p-3 text-xs leading-relaxed"><b>Wajib untuk sync 2 arah antar HP:</b> tambahkan 2 kolom baru di header tiap sheet (Produk, Penjualan, Pengeluaran, Stock Opname — bukan di sheet Ringkasan): <b>updatedAt</b> dan <b>deleted</b>. Kalau kolom ini belum ada, data akan tetap terkirim (push) tapi HP lain tidak akan bisa menariknya turun dengan akurat.</div>
      </div>
      <Button className="w-full" onClick={()=>onSave({...settings,storeName:name,storeAddress:address,storePhone:phone,paperWidth,cloudName,uploadPreset,sheetdb})}>Simpan</Button>
    </div>
  </Modal>
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
