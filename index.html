<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Dream Note — Target Pencapaian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #12131a;
    --bg-soft: #17181f;
    --surface: #1d1f28;
    --surface-hover: #24262f;
    --border: #2c2e39;
    --text: #f1efe9;
    --text-dim: #a5a6b3;
    --text-faint: #6a6b78;
    --gold: #e8b84b;
    --gold-dim: #8a6f2e;
    --teal: #5fd6c4;
    --danger: #e0665f;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    --radius: 14px;
    --font-display: 'Fraunces', serif;
    --font-body: 'Inter', sans-serif;
  }
  [data-theme="light"]{
    --bg: #f6f3ec;
    --bg-soft: #efebe1;
    --surface: #fffdf9;
    --surface-hover: #fbf7ee;
    --border: #e2dccb;
    --text: #24221c;
    --text-dim: #6f6b5e;
    --text-faint: #a29c8b;
    --gold: #b8862a;
    --gold-dim: #d9b566;
    --teal: #1f8f7e;
    --danger: #c94a42;
    --shadow: 0 1px 2px rgba(30,25,10,.06), 0 8px 24px rgba(30,25,10,.08);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    min-height:100vh;
    transition:background .35s ease, color .35s ease;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";
    position:fixed; inset:0;
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, color-mix(in srgb, var(--gold) 10%, transparent), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 10%, color-mix(in srgb, var(--teal) 7%, transparent), transparent 60%);
    pointer-events:none;
    z-index:0;
  }

  /* ---------- Header ---------- */
  header{
    position:sticky; top:0; z-index:40;
    background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
  }
  .header-inner{
    max-width:1180px; margin:0 auto;
    padding:18px 24px;
    display:flex; align-items:center; gap:18px;
  }
  .brand{
    display:flex; align-items:baseline; gap:9px;
    font-family:var(--font-display);
    font-size:26px; font-weight:600;
    letter-spacing:.2px;
    flex-shrink:0;
  }
  .brand .dot{ color:var(--gold); font-style:italic; }
  .brand small{
    font-family:var(--font-body); font-size:12.5px; font-weight:500;
    color:var(--text-faint); letter-spacing:.3px;
  }
  .search{
    flex:1; max-width:420px;
    display:flex; align-items:center; gap:9px;
    background:var(--surface); border:1px solid var(--border);
    border-radius:11px; padding:9px 14px;
    color:var(--text-dim);
    transition:border-color .2s;
  }
  .search:focus-within{ border-color:var(--gold-dim); }
  .search input{
    border:none; background:none; outline:none; color:var(--text);
    font-family:var(--font-body); font-size:14px; width:100%;
  }
  .search svg{ flex-shrink:0; opacity:.7; }
  .header-actions{ display:flex; align-items:center; gap:8px; margin-left:auto; }
  .icon-btn{
    width:38px; height:38px; border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    background:transparent; border:1px solid transparent;
    color:var(--text-dim); cursor:pointer;
    transition:background .15s, color .15s, border-color .15s;
  }
  .icon-btn:hover{ background:var(--surface-hover); color:var(--text); border-color:var(--border); }

  /* ---------- Layout ---------- */
  main{ max-width:1180px; margin:0 auto; padding:28px 24px 100px; position:relative; z-index:1; }

  .composer-wrap{ display:flex; justify-content:center; margin-bottom:38px; }
  .composer{
    width:100%; max-width:600px;
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); box-shadow:var(--shadow);
    padding:14px 18px; cursor:text;
    color:var(--text-faint); font-size:15px;
    transition:border-color .2s;
  }
  .composer:hover{ border-color:var(--gold-dim); }
  .composer-open{ display:flex; align-items:center; gap:12px; }
  .composer-open span{ font-family:var(--font-display); font-style:italic; }
  .composer-open .plus{
    margin-left:auto; width:30px; height:30px; border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    color:var(--gold); font-size:20px; border:1px solid var(--border);
  }

  .section-label{
    font-family:var(--font-body); font-size:12px; font-weight:600;
    color:var(--text-faint); letter-spacing:1.2px; text-transform:uppercase;
    margin:0 0 16px 4px;
  }

  .grid{
    columns: 4 260px;
    column-gap:18px;
  }
  @media (max-width:1000px){ .grid{ columns: 3 240px; } }
  @media (max-width:700px){ .grid{ columns: 2 160px; column-gap:12px; } main{padding:20px 14px 90px;} }
  @media (max-width:460px){ .grid{ columns: 1; } .header-inner{padding:14px 14px;} .brand{font-size:22px;} .search{display:none;} }

  .note{
    break-inside:avoid; margin-bottom:18px;
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); overflow:hidden;
    box-shadow:var(--shadow);
    display:flex; flex-direction:column;
    position:relative;
    transition:transform .18s ease, border-color .18s ease;
  }
  .note:hover{ border-color:var(--gold-dim); }
  .note:hover .note-actions{ opacity:1; pointer-events:auto; }

  .note img{ width:100%; display:block; object-fit:cover; max-height:260px; }

  .note-body{ padding:16px 17px 14px; }
  .note-title{
    font-family:var(--font-display); font-weight:600;
    font-size:19px; line-height:1.28; margin:0 0 3px;
    word-break:break-word;
  }
  .note-subtitle{
    font-family:var(--font-body); font-weight:600;
    font-size:14px; color:var(--gold); margin:0 0 10px;
    letter-spacing:.2px;
  }
  .note-text{
    font-size:14px; line-height:1.55; color:var(--text-dim);
    white-space:pre-wrap; word-break:break-word;
    margin-bottom:12px;
  }
  .note-text b, .note-text strong{ color:var(--text); }
  .note-meta{
    display:flex; align-items:center; gap:6px;
    font-family:'JetBrains Mono', monospace;
    font-size:11px; color:var(--text-faint);
    padding-top:10px; border-top:1px solid var(--border);
  }
  .note-meta svg{ opacity:.7; flex-shrink:0; }

  .note-actions{
    position:absolute; top:10px; right:10px;
    display:flex; gap:6px;
    opacity:0; pointer-events:none;
    transition:opacity .15s;
  }
  .note-actions button{
    width:30px; height:30px; border-radius:8px; border:none;
    background:color-mix(in srgb, var(--bg) 55%, transparent);
    backdrop-filter:blur(4px);
    color:var(--text); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:background .15s;
  }
  .note-actions button:hover{ background:var(--danger); color:#fff; }
  .note-actions button.edit-btn:hover{ background:var(--gold); color:#1a1a1a; }

  .empty-state{
    text-align:center; padding:80px 20px; color:var(--text-faint);
  }
  .empty-state .glyph{ font-family:var(--font-display); font-size:44px; font-style:italic; color:var(--text-dim); margin-bottom:10px; }
  .empty-state p{ font-size:14px; max-width:320px; margin:6px auto 0; line-height:1.5; }

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(8,8,10,.6);
    backdrop-filter:blur(3px);
    display:flex; align-items:center; justify-content:center;
    padding:20px; z-index:100;
    opacity:0; pointer-events:none; transition:opacity .2s;
  }
  .overlay.open{ opacity:1; pointer-events:auto; }
  .modal{
    width:100%; max-width:560px; max-height:90vh; overflow-y:auto;
    background:var(--surface); border:1px solid var(--border);
    border-radius:18px; box-shadow:0 20px 60px rgba(0,0,0,.5);
    transform:translateY(14px) scale(.98); transition:transform .22s ease;
  }
  .overlay.open .modal{ transform:translateY(0) scale(1); }

  .modal-image-zone{
    position:relative; border-bottom:1px solid var(--border);
  }
  .modal-image-zone img{ width:100%; max-height:260px; object-fit:cover; display:block; }
  .image-placeholder{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:8px; padding:30px 20px;
    color:var(--text-faint); cursor:pointer; font-size:13px;
    border-bottom:1px dashed var(--border);
    transition:background .15s, color .15s;
  }
  .image-placeholder:hover{ background:var(--surface-hover); color:var(--text-dim); }
  .image-remove{
    position:absolute; top:10px; right:10px;
    background:rgba(0,0,0,.55); color:#fff; border:none;
    width:30px; height:30px; border-radius:8px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .image-change{
    position:absolute; bottom:10px; right:10px;
    background:rgba(0,0,0,.55); color:#fff; border:none;
    font-size:12px; padding:7px 12px; border-radius:8px; cursor:pointer;
    font-family:var(--font-body); font-weight:500;
  }

  .modal-fields{ padding:18px 22px 6px; }
  .field-title{
    width:100%; border:none; outline:none; background:none;
    font-family:var(--font-display); font-weight:600; font-size:23px;
    color:var(--text); margin-bottom:6px;
  }
  .field-title::placeholder{ color:var(--text-faint); font-weight:500; }
  .field-subtitle{
    width:100%; border:none; outline:none; background:none;
    font-family:var(--font-body); font-weight:600; font-size:14.5px;
    color:var(--gold); margin-bottom:14px;
  }
  .field-subtitle::placeholder{ color:var(--text-faint); font-weight:500; }

  .toolbar{
    display:flex; align-items:center; gap:4px; flex-wrap:wrap;
    padding:8px 22px; border-top:1px solid var(--border); border-bottom:1px solid var(--border);
    background:var(--bg-soft);
  }
  .toolbar button{
    width:32px; height:32px; border-radius:8px; border:1px solid transparent;
    background:none; color:var(--text-dim); cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:14px;
    transition:background .15s, color .15s;
  }
  .toolbar button:hover{ background:var(--surface-hover); color:var(--text); }
  .toolbar button.active{ background:color-mix(in srgb, var(--gold) 18%, transparent); color:var(--gold); border-color:var(--gold-dim); }
  .toolbar .sep{ width:1px; height:20px; background:var(--border); margin:0 4px; }
  .toolbar select{
    background:var(--surface); border:1px solid var(--border); color:var(--text);
    font-size:12.5px; border-radius:8px; padding:6px 8px; outline:none; cursor:pointer;
    max-width:110px;
  }
  .color-swatch{
    width:20px; height:20px; border-radius:50%; border:2px solid var(--border);
    cursor:pointer; padding:0; flex-shrink:0;
  }
  .color-swatch.selected{ border-color:var(--text); }
  input[type=color].hidden-picker{ width:0; height:0; opacity:0; position:absolute; }
  .color-code-input{
    width:128px; height:30px; border-radius:8px; border:1px solid var(--border);
    background:var(--surface); color:var(--text); outline:none;
    font-family:'JetBrains Mono', monospace; font-size:11.5px; padding:0 8px;
  }
  .color-code-input:focus{ border-color:var(--gold-dim); }
  .color-code-input.invalid{ border-color:var(--danger); }
  @media (max-width:520px){ .color-code-input{ width:98px; } }

  .editable-body{
    min-height:120px; max-height:340px; overflow-y:auto;
    padding:16px 22px 8px;
    font-family:var(--font-body); font-size:14.5px; line-height:1.6;
    color:var(--text); outline:none;
  }
  .editable-body:empty::before{
    content:attr(data-placeholder); color:var(--text-faint);
  }

  .modal-footer{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 22px 18px;
  }
  .modal-footer .left-info{
    font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--text-faint);
  }
  .btn{
    font-family:var(--font-body); font-weight:600; font-size:13.5px;
    padding:9px 18px; border-radius:9px; cursor:pointer; border:1px solid transparent;
  }
  .btn-ghost{ background:none; color:var(--text-dim); }
  .btn-ghost:hover{ background:var(--surface-hover); }
  .btn-primary{ background:var(--gold); color:#1a1608; }
  .btn-primary:hover{ filter:brightness(1.08); }
  .footer-actions{ display:flex; gap:8px; }

  ::-webkit-scrollbar{ width:9px; height:9px; }
  ::-webkit-scrollbar-thumb{ background:var(--border); border-radius:6px; }
  ::-webkit-scrollbar-track{ background:transparent; }

  @media (max-width:520px){
    .modal{ border-radius:14px; }
    .field-title{ font-size:20px; }
  }
</style>
</head>
<body data-theme="dark">

<header>
  <div class="header-inner">
    <div class="brand">Dream<span class="dot">.</span>Note</div>
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="searchInput" type="text" placeholder="Cari target...">
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="themeToggle" title="Ganti tema">
        <svg id="themeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </div>
</header>

<main>
  <div class="composer-wrap">
    <div class="composer" id="composer">
      <div class="composer-open">
        <span>Tuliskan target pencapaianmu...</span>
        <div class="plus">+</div>
      </div>
    </div>
  </div>

  <p class="section-label" id="sectionLabel">Daftar Target</p>
  <div class="grid" id="grid"></div>
  <div class="empty-state" id="emptyState" style="display:none;">
    <div class="glyph">belum ada target</div>
    <p>Mulai dari satu foto — mobil impian, rumah idaman, atau tujuan liburan. Ketuk kotak di atas untuk menambahkan target pencapaianmu.</p>
  </div>
</main>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-image-zone" id="imageZone">
      <div class="image-placeholder" id="imagePlaceholder">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
        <span>Tambahkan foto target (PNG, JPG, GIF, WebP)</span>
      </div>
    </div>

    <div class="modal-fields">
      <input type="text" class="field-title" id="fieldTitle" placeholder="Nama target — mis. Beli Porsche 911">
      <input type="text" class="field-subtitle" id="fieldSubtitle" placeholder="Target nilai — mis. Rp 2.800.000.000">
    </div>

    <div class="toolbar">
      <button type="button" data-cmd="bold" title="Tebal"><b>B</b></button>
      <button type="button" data-cmd="italic" title="Miring"><i>I</i></button>
      <button type="button" data-cmd="underline" title="Garis bawah"><u>U</u></button>
      <div class="sep"></div>
      <label class="color-swatch" style="background:#e0665f" title="Warna teks">
        <input type="radio" name="tcolor" class="hidden-picker-radio" style="display:none" data-color="#e0665f">
      </label>
      <label class="color-swatch" style="background:#e8b84b" title="Warna teks">
        <input type="radio" name="tcolor" class="hidden-picker-radio" style="display:none" data-color="#e8b84b">
      </label>
      <label class="color-swatch" style="background:#5fd6c4" title="Warna teks">
        <input type="radio" name="tcolor" class="hidden-picker-radio" style="display:none" data-color="#5fd6c4">
      </label>
      <label class="color-swatch" style="background:#9d7de8" title="Warna teks">
        <input type="radio" name="tcolor" class="hidden-picker-radio" style="display:none" data-color="#9d7de8">
      </label>
      <label class="color-swatch" style="background:#f1efe9" title="Warna teks">
        <input type="radio" name="tcolor" class="hidden-picker-radio" style="display:none" data-color="#f1efe9">
      </label>
      <button type="button" id="customColorBtn" title="Warna kustom (color picker)" style="position:relative;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="13.5" cy="6.5" r=".5"/><circle cx="17.5" cy="10.5" r=".5"/><circle cx="8.5" cy="7.5" r=".5"/><circle cx="6.5" cy="12.5" r=".5"/><path d="M12 21a9 9 0 1 1 0-18c1.5 0 3 1 3 3s-1.5 2-3 2-2 1-2 2 1 1.5 2 2c2 0 4 1 4 3a4 4 0 0 1-4 6z"/></svg>
        <input type="color" id="customColorInput" class="hidden-picker">
      </button>
      <input type="text" id="colorCodeInput" class="color-code-input" placeholder="#RRGGBB / rgb(r,g,b)" title="Ketik kode warna lalu tekan Enter">
      <button type="button" id="applyColorCodeBtn" title="Terapkan warna">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
      </button>
      <div class="sep"></div>
      <select id="fontSelect" title="Font">
        <option value="'Inter', sans-serif">Sans</option>
        <option value="'Fraunces', serif">Serif</option>
        <option value="'JetBrains Mono', monospace">Mono</option>
        <option value="'Caveat', cursive">Tulisan</option>
      </select>
    </div>

    <div class="editable-body" id="editableBody" contenteditable="true" data-placeholder="Tulis catatan tentang mimpi ini..."></div>

    <div class="modal-footer">
      <span class="left-info" id="modalTimestamp"></span>
      <div class="footer-actions">
        <button class="btn btn-ghost" id="cancelBtn">Batal</button>
        <button class="btn btn-primary" id="saveBtn">Simpan</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  const STORAGE_KEY = 'dreamnote_targets_v1';
  const THEME_KEY = 'dreamnote_theme_v1';

  const grid = document.getElementById('grid');
  const emptyState = document.getElementById('emptyState');
  const overlay = document.getElementById('overlay');
  const composer = document.getElementById('composer');
  const imageZone = document.getElementById('imageZone');
  const imagePlaceholder = document.getElementById('imagePlaceholder');
  const fieldTitle = document.getElementById('fieldTitle');
  const fieldSubtitle = document.getElementById('fieldSubtitle');
  const editableBody = document.getElementById('editableBody');
  const fontSelect = document.getElementById('fontSelect');
  const modalTimestamp = document.getElementById('modalTimestamp');
  const searchInput = document.getElementById('searchInput');
  const customColorInput = document.getElementById('customColorInput');

  let notes = loadNotes();
  let editingId = null;
  let currentImageData = null;
  let hiddenFileInput = null;

  function loadNotes(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){ return []; }
  }
  function saveNotes(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
  }
  function uid(){ return 'n' + Date.now() + Math.random().toString(36).slice(2,8); }

  function fmtDate(iso){
    const d = new Date(iso);
    const bulan = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
    const jam = String(d.getHours()).padStart(2,'0');
    const menit = String(d.getMinutes()).padStart(2,'0');
    return `${d.getDate()} ${bulan[d.getMonth()]} ${d.getFullYear()} · ${jam}:${menit}`;
  }

  /* ---------- Theme ---------- */
  function applyTheme(theme){
    document.body.setAttribute('data-theme', theme);
    localStorage.setItem(THEME_KEY, theme);
    const icon = document.getElementById('themeIcon');
    if(theme === 'light'){
      icon.innerHTML = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>';
    } else {
      icon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
    }
  }
  const savedTheme = localStorage.getItem(THEME_KEY) || 'dark';
  applyTheme(savedTheme);
  document.getElementById('themeToggle').addEventListener('click', () => {
    const cur = document.body.getAttribute('data-theme');
    applyTheme(cur === 'dark' ? 'light' : 'dark');
  });

  /* ---------- Render ---------- */
  function render(filter){
    const term = (filter || '').trim().toLowerCase();
    const list = notes
      .filter(n => {
        if(!term) return true;
        return (n.title||'').toLowerCase().includes(term) ||
               (n.subtitle||'').toLowerCase().includes(term) ||
               (n.body||'').toLowerCase().includes(term);
      })
      .sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));

    grid.innerHTML = '';
    emptyState.style.display = (notes.length === 0) ? 'block' : 'none';

    list.forEach(note => {
      const card = document.createElement('div');
      card.className = 'note';
      card.innerHTML = `
        ${note.image ? `<img src="${note.image}" alt="${escapeHtml(note.title||'')}">` : ''}
        <div class="note-actions">
          <button class="edit-btn" title="Ubah" data-id="${note.id}" data-action="edit">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
          </button>
          <button title="Hapus" data-id="${note.id}" data-action="delete">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
          </button>
        </div>
        <div class="note-body">
          ${note.title ? `<h3 class="note-title">${escapeHtml(note.title)}</h3>` : ''}
          ${note.subtitle ? `<p class="note-subtitle">${escapeHtml(note.subtitle)}</p>` : ''}
          ${note.body ? `<div class="note-text" style="font-family:${note.font || "'Inter', sans-serif"}">${note.body}</div>` : ''}
          <div class="note-meta">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            ${fmtDate(note.createdAt)}
          </div>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  grid.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-action]');
    if(!btn) return;
    const id = btn.getAttribute('data-id');
    if(btn.dataset.action === 'delete'){
      if(confirm('Hapus mimpi ini?')){
        notes = notes.filter(n => n.id !== id);
        saveNotes();
        render(searchInput.value);
      }
    } else if(btn.dataset.action === 'edit'){
      openModal(notes.find(n => n.id === id));
    }
  });

  searchInput.addEventListener('input', () => render(searchInput.value));

  /* ---------- Modal ---------- */
  function resetModal(){
    fieldTitle.value = '';
    fieldSubtitle.value = '';
    editableBody.innerHTML = '';
    fontSelect.value = "'Inter', sans-serif";
    editableBody.style.fontFamily = fontSelect.value;
    currentImageData = null;
    renderImageZone();
    modalTimestamp.textContent = '';
  }

  function renderImageZone(){
    if(currentImageData){
      imageZone.innerHTML = `
        <img src="${currentImageData}" alt="preview">
        <button class="image-remove" id="removeImgBtn" title="Hapus foto">✕</button>
        <button class="image-change" id="changeImgBtn">Ganti foto</button>
      `;
      document.getElementById('removeImgBtn').addEventListener('click', () => {
        currentImageData = null; renderImageZone();
      });
      document.getElementById('changeImgBtn').addEventListener('click', triggerFilePicker);
    } else {
      imageZone.innerHTML = `
        <div class="image-placeholder" id="imagePlaceholder">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
          <span>Tambahkan foto impianmu</span>
        </div>
      `;
      document.getElementById('imagePlaceholder').addEventListener('click', triggerFilePicker);
    }
  }

  function triggerFilePicker(){
    if(!hiddenFileInput){
      hiddenFileInput = document.createElement('input');
      hiddenFileInput.type = 'file';
      hiddenFileInput.accept = 'image/png,image/jpeg,image/gif,image/webp,image/*';
      hiddenFileInput.style.display = 'none';
      document.body.appendChild(hiddenFileInput);
      hiddenFileInput.addEventListener('change', handleFile);
    }
    hiddenFileInput.value = '';
    hiddenFileInput.click();
  }

  function handleFile(e){
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      currentImageData = ev.target.result;
      renderImageZone();
    };
    reader.readAsDataURL(file);
  }

  function openModal(note){
    resetModal();
    if(note){
      editingId = note.id;
      fieldTitle.value = note.title || '';
      fieldSubtitle.value = note.subtitle || '';
      editableBody.innerHTML = note.body || '';
      currentImageData = note.image || null;
      fontSelect.value = note.font || "'Inter', sans-serif";
      editableBody.style.fontFamily = fontSelect.value;
      renderImageZone();
      modalTimestamp.textContent = 'Dibuat ' + fmtDate(note.createdAt);
    } else {
      editingId = null;
    }
    overlay.classList.add('open');
    setTimeout(() => fieldTitle.focus(), 150);
  }

  function closeModal(){
    overlay.classList.remove('open');
    editingId = null;
  }

  composer.addEventListener('click', () => openModal(null));
  document.getElementById('cancelBtn').addEventListener('click', closeModal);
  overlay.addEventListener('click', (e) => { if(e.target === overlay) closeModal(); });
  document.addEventListener('keydown', (e) => { if(e.key === 'Escape' && overlay.classList.contains('open')) closeModal(); });

  document.getElementById('imagePlaceholder').addEventListener('click', triggerFilePicker);

  document.getElementById('saveBtn').addEventListener('click', () => {
    const title = fieldTitle.value.trim();
    const subtitle = fieldSubtitle.value.trim();
    const body = editableBody.innerHTML.trim();
    const font = fontSelect.value;

    if(!title && !subtitle && !body && !currentImageData){
      closeModal();
      return;
    }

    if(editingId){
      const idx = notes.findIndex(n => n.id === editingId);
      if(idx > -1){
        notes[idx] = { ...notes[idx], title, subtitle, body, image: currentImageData, font };
      }
    } else {
      notes.push({
        id: uid(),
        title, subtitle, body,
        image: currentImageData,
        font,
        createdAt: new Date().toISOString()
      });
    }
    saveNotes();
    render(searchInput.value);
    closeModal();
  });

  /* ---------- Toolbar formatting ---------- */
  document.querySelectorAll('.toolbar button[data-cmd]').forEach(btn => {
    btn.addEventListener('click', () => {
      editableBody.focus();
      document.execCommand(btn.dataset.cmd, false, null);
      updateToolbarState();
    });
  });

  document.querySelectorAll('.hidden-picker-radio').forEach(radio => {
    radio.addEventListener('change', () => {
      editableBody.focus();
      document.execCommand('foreColor', false, radio.dataset.color);
    });
  });
  document.querySelectorAll('.color-swatch').forEach(sw => {
    sw.addEventListener('click', () => {
      const input = sw.querySelector('input');
      if(input){
        editableBody.focus();
        document.execCommand('foreColor', false, input.dataset.color);
      }
    });
  });

  document.getElementById('customColorBtn').addEventListener('click', (e) => {
    // let the color input open via its own click when clicked directly on input
  });
  customColorInput.addEventListener('input', () => {
    editableBody.focus();
    document.execCommand('foreColor', false, customColorInput.value);
  });
  customColorInput.addEventListener('click', (e) => e.stopPropagation());
  document.getElementById('customColorBtn').addEventListener('click', () => {
    customColorInput.click();
  });

  const colorCodeInput = document.getElementById('colorCodeInput');
  const applyColorCodeBtn = document.getElementById('applyColorCodeBtn');

  function isValidColor(value){
    const s = new Option().style;
    s.color = '';
    s.color = value;
    return s.color !== '';
  }

  function applyColorCode(){
    const raw = colorCodeInput.value.trim();
    if(!raw) return;
    // Auto-tambah pagar jika user hanya ketik kode hex tanpa #, mis. "ff8800"
    const candidate = /^[0-9a-fA-F]{3}$|^[0-9a-fA-F]{6}$/.test(raw) ? ('#' + raw) : raw;
    if(isValidColor(candidate)){
      editableBody.focus();
      document.execCommand('foreColor', false, candidate);
      colorCodeInput.classList.remove('invalid');
    } else {
      colorCodeInput.classList.add('invalid');
    }
  }

  applyColorCodeBtn.addEventListener('click', applyColorCode);
  colorCodeInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){ e.preventDefault(); applyColorCode(); }
  });
  colorCodeInput.addEventListener('input', () => colorCodeInput.classList.remove('invalid'));

  fontSelect.addEventListener('change', () => {
    editableBody.style.fontFamily = fontSelect.value;
  });

  function updateToolbarState(){
    ['bold','italic','underline'].forEach(cmd => {
      const btn = document.querySelector(`.toolbar button[data-cmd="${cmd}"]`);
      if(btn) btn.classList.toggle('active', document.queryCommandState(cmd));
    });
  }
  editableBody.addEventListener('keyup', updateToolbarState);
  editableBody.addEventListener('mouseup', updateToolbarState);

  /* ---------- Init ---------- */
  render();
})();
</script>
</body>
</html>
