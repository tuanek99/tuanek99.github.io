function StocktakeModal({products,onClose,onSave,onAddProduct}){
  const expected=useMemo(()=>products.filter(p=>p.status!=='sold'),[products]);
  const [init]=useState(()=>{
    // Lanjutkan draf tersimpan; SKU yang sudah ditambahkan sebagai produk dihitung ditemukan.
    const d=loadStocktakeDraft()||{}, byId=new Map(products.map(x=>[x.id,x])), bySku=new Map(products.map(x=>[String(x.sku).toLowerCase(),x]));
    const scanned=(d.scanned||[]).filter(id=>byId.has(id)&&byId.get(id).status!=='sold');
    const soldFound=(d.soldFound||[]).filter(id=>byId.has(id)&&byId.get(id).status==='sold');
    const unknown=[];
    (d.unknown||[]).forEach(c=>{const x=bySku.get(String(c).toLowerCase());if(!x)unknown.push(c);else if(!scanned.includes(x.id)&&!soldFound.includes(x.id))(x.status==='sold'?soldFound:scanned).push(x.id)});
    return {scanned,soldFound,unknown,dec:d.dec||{},phase:d.phase||'scan',at:d.at||0};
  });
  const [phase,setPhase]=useState(init.phase);
  const [scanned,setScanned]=useState(init.scanned);
  const [soldFound,setSoldFound]=useState(init.soldFound);
  const [unknown,setUnknown]=useState(init.unknown);
  const [last,setLast]=useState(null);
  const [dec,setDec]=useState(init.dec);
  const [resumeAt,setResumeAt]=useState(init.scanned.length+init.soldFound.length+init.unknown.length>0?(init.at||1):0);
  const [manual,setManual]=useState('');
  const [saving,setSaving]=useState(false);
  const lastRef=useRef({code:'',t:0});
  useEffect(()=>{unlockAudio()},[]);
  useEffect(()=>{
    if(scanned.length||soldFound.length||unknown.length||Object.keys(dec).length) saveStocktakeDraft({scanned,soldFound,unknown,dec,phase,at:Date.now()});
    else clearStocktakeDraft();
  },[scanned,soldFound,unknown,dec,phase]);
  const restart=()=>{
    if(!confirm('Hapus progres opname yang tersimpan dan mulai dari awal?')) return;
    setScanned([]);setSoldFound([]);setUnknown([]);setDec({});setLast(null);setResumeAt(0);setPhase('scan');clearStocktakeDraft();
  };
  const handleCode=(raw,force)=>{
    const code=String(raw).trim(); if(!code) return;
    const now=Date.now(), l=lastRef.current; lastRef.current={code,t:now};
    if(!force && l.code.toLowerCase()===code.toLowerCase() && now-l.t<2500) return; // kamera masih mengarah ke barang yang sama
    const p=products.find(x=>String(x.sku).toLowerCase()===code.toLowerCase());
    if(!p){beep('error');setUnknown(u=>u.includes(code)?u:[...u,code]);setLast({kind:'unknown',code});return}
    if(scanned.includes(p.id)||soldFound.includes(p.id)){beep('error');setLast({kind:'dup',p});return}
    if(p.status==='sold'){beep('error');setSoldFound(x=>[...x,p.id]);setLast({kind:'sold',p});return}
    beep('success');setScanned(x=>[...x,p.id]);setLast({kind:'ok',p});
  };
  const missing=expected.filter(p=>!scanned.includes(p.id));
  const variance=missing.reduce((a,p)=>a+(Number(p.cost)||0),0);
  const decOf=(id,def)=>dec[id]||def;
  const setD=(id,v)=>setDec(d=>({...d,[id]:v}));
  const save=async()=>{
    const entries=[
      ...scanned.map(id=>({id,result:'found'})),
      ...soldFound.map(id=>({id,result:decOf(id,'ignore')==='restore'?'sold_found_restored':'sold_found_ignored'})),
      ...missing.map(p=>({id:p.id,result:'missing_'+decOf(p.id,'later')}))
    ];
    const n=entries.filter(e=>/^missing_(sold|lost)$|_restored$/.test(e.result)).length;
    if(n && !confirm(`${n} barang akan diubah statusnya (dicatat terjual / hilang / dikembalikan). Lanjut simpan?`)) return;
    setSaving(true);
    try{await onSave(entries,unknown)}finally{setSaving(false)}
  };
  if(phase==='scan'){
    const c=last&&{ok:['bg-emerald-50 border-emerald-200 text-emerald-800','✓ Ditemukan'],dup:['bg-amber-50 border-amber-200 text-amber-800','Sudah di-scan tadi'],sold:['bg-red-50 border-red-200 text-red-800','Di sistem tercatat TERJUAL, tapi barangnya ada. Diputuskan di layar tinjau.'],unknown:['bg-red-50 border-red-200 text-red-800','SKU tidak dikenal']}[last.kind];
    return <Modal title="Stock Opname" onClose={onClose} wide><div className="space-y-4">
      {resumeAt>0&&<div className="rounded-xl bg-indigo-50 border border-indigo-100 p-3 flex items-center justify-between gap-2 text-xs text-indigo-800"><span>Melanjutkan opname sebelumnya{resumeAt>1?` (${dateText(resumeAt)})`:''}</span><button type="button" className="font-extrabold underline shrink-0" onClick={restart}>Mulai dari awal</button></div>}
      <StocktakeCamera onCode={c=>handleCode(c)}/>
      <input autoFocus value={manual} onChange={e=>setManual(e.target.value)} onKeyDown={e=>{if(e.key==='Enter'){handleCode(manual,true);setManual('')}}} placeholder="Ketik / scan SKU lalu Enter…" className="w-full h-11 px-3 rounded-xl border border-slate-200 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"/>
      {last&&<div className={`rounded-2xl border p-3 flex items-center gap-3 ${c[0]}`}>{last.p&&(last.p.image?<img src={last.p.image} className="w-20 h-20 rounded-xl object-cover shrink-0"/>:<div className="w-20 h-20 rounded-xl bg-white/60 flex items-center justify-center shrink-0"><Icon name="shirt"/></div>)}<div className="min-w-0"><div className="text-xs font-extrabold">{c[1]}</div><b className="text-sm block truncate">{last.p?last.p.name:last.code}</b>{last.p&&<div className="text-xs opacity-80 truncate">{[last.p.sku,last.p.size,last.p.color,last.p.category].filter(Boolean).join(' • ')}</div>}</div></div>}
      <div><div className="flex justify-between text-xs font-bold text-slate-500 mb-1"><span>Ditemukan {scanned.length} / {expected.length}</span>{(soldFound.length+unknown.length>0)&&<span className="text-amber-600">{soldFound.length+unknown.length} perlu ditinjau</span>}</div><div className="h-2 rounded-full bg-slate-100 overflow-hidden"><div className="h-full bg-emerald-500 transition-all" style={{width:`${expected.length?Math.min(100,scanned.length/expected.length*100):0}%`}}/></div></div>
      <Button className="w-full" onClick={()=>setPhase('review')}><Icon name="check" size={18}/><span>Selesai & Tinjau</span></Button>
    </div></Modal>;
  }
  return <Modal title="Tinjau Hasil Opname" onClose={onClose} wide><div className="space-y-4">
    <div className="grid grid-cols-3 gap-2 text-center"><div className="rounded-xl bg-emerald-50 p-3"><div className="text-xl font-black text-emerald-700">{scanned.length}</div><div className="text-[10px] font-bold text-emerald-700">Ditemukan</div></div><div className="rounded-xl bg-amber-50 p-3"><div className="text-xl font-black text-amber-700">{missing.length}</div><div className="text-[10px] font-bold text-amber-700">Tidak ditemukan</div></div><div className="rounded-xl bg-slate-50 p-3"><div className="text-sm font-black mt-1">{money(variance)}</div><div className="text-[10px] font-bold text-slate-500">Modal selisih</div></div></div>
    <div className="max-h-[50vh] overflow-auto space-y-4">
      {soldFound.length>0&&<div className="space-y-2"><div className="text-xs font-extrabold text-red-600">Tercatat terjual, tapi barangnya ada ({soldFound.length})</div>{soldFound.map(id=>{const p=products.find(x=>x.id===id);return <StocktakeItem key={id} p={p}><Choice value={decOf(id,'ignore')} onChange={v=>setD(id,v)} options={[['restore','Kembalikan ke Tersedia (retur)','bg-emerald-600 text-white'],['ignore','Abaikan','bg-slate-900 text-white']]}/></StocktakeItem>})}</div>}
      {missing.length>0&&<div className="space-y-2"><div className="text-xs font-extrabold text-amber-700">Tidak ditemukan ({missing.length})</div>{missing.map(p=><StocktakeItem key={p.id} p={p}><Choice value={decOf(p.id,'later')} onChange={v=>setD(p.id,v)} options={[['sold','Terjual (belum tercatat)','bg-emerald-600 text-white'],['lost','Hilang (rugi)','bg-red-600 text-white'],['later','Cari lagi nanti','bg-slate-900 text-white']]}/></StocktakeItem>)}</div>}
      {unknown.length>0&&<div className="space-y-2"><div className="text-xs font-extrabold text-red-600">SKU tidak dikenal ({unknown.length})</div>{unknown.map(c=><div key={c} className="p-3 rounded-xl bg-slate-50 flex items-center justify-between gap-3"><span className="font-mono text-sm truncate">{c}</span><Button variant="outline" className="shrink-0" onClick={()=>onAddProduct(c)}><Icon name="plus" size={16}/><span>Tambah produk</span></Button></div>)}<div className="text-[11px] text-slate-400">Progres opname tersimpan otomatis, setelah produk disimpan kamu kembali ke sini dan barangnya dihitung ditemukan.</div></div>}
      {!missing.length&&!soldFound.length&&!unknown.length&&<div className="p-4 text-sm text-center text-emerald-700 font-bold">Semua barang cocok 🎉</div>}
    </div>
    <div className="grid grid-cols-2 gap-2"><Button variant="outline" onClick={()=>setPhase('scan')}>Kembali Scan</Button><Button disabled={saving} onClick={save}>Simpan Stock Opname</Button></div>
  </div></Modal>;
}

function code128Modules(code){
  try{
    const t=document.createElementNS('http://www.w3.org/2000/svg','svg');
    JsBarcode(t,code,{format:'CODE128',width:1,height:10,margin:0,displayValue:false});
    return parseFloat(t.getAttribute('width'))||0;
  }catch(e){ return 0; }
}
function CodeTile({code,mode,showText,qrLogo,print,tileH,tileW,qrMm,bTop,bLeft,cut}){
  const svgRef=useRef(null);

  const modules=useMemo(()=>(print&&mode==='barcode')?code128Modules(code):0,[code,print,mode]);
  const padX=3, padY=2.5;
  const availW=(tileW||0)-2*padX;
  const barW=Math.min(availW,(modules||1)*0.4);
  const textMm=showText?4:0;
  const barH=Math.max(6,(tileH||0)-2*padY-textMm-0.5);

  useEffect(()=>{
    if(mode!=='barcode') return;
    const svg=svgRef.current;
    if(!svg) return;
    while(svg.firstChild) svg.removeChild(svg.firstChild);
    try{
      if(print){
        const w=modules||1;
        const h=w*barH/barW;
        JsBarcode(svg,code,{format:'CODE128',displayValue:false,margin:0,height:h,width:1});
        svg.setAttribute('viewBox','0 0 '+w+' '+h);
        svg.setAttribute('width',barW+'mm');
        svg.setAttribute('height',barH+'mm');
        svg.setAttribute('preserveAspectRatio','none');
        return;
      }
      JsBarcode(svg,code,{format:'CODE128',displayValue:showText,fontSize:14,textMargin:3,margin:8,height:50,width:2});
      if(!svg.getAttribute('viewBox')){
        const w=parseFloat(svg.getAttribute('width'))||0, h=parseFloat(svg.getAttribute('height'))||0;
        if(w&&h) svg.setAttribute('viewBox','0 0 '+w+' '+h);
      }
      svg.setAttribute('preserveAspectRatio','xMidYMid meet');
    }catch(e){  }
  },[code,mode,showText,print,modules,barW,barH]);

  const qrHtml=useMemo(()=>{
    if(mode!=='qr') return '';
    try{
      if(typeof window.qrcode!=='function') return '';
      const level=qrLogo?'H':'M';
      let qr=null;
      for(let type=1;type<=40;type++){
        try{ const attempt=window.qrcode(type,level); attempt.addData(code); attempt.make(); qr=attempt; break; }catch(e){}
      }
      return qr?qrSvgMarkup(qr,2,qrLogo):'';
    }catch(e){ return ''; }
  },[mode,code,qrLogo]);

  if(print){
    const bd=cut?'0.3mm dashed #94a3b8':'none';
    const fs=Math.min(8,(availW/(Math.max(code.length,1)*0.62))/0.3528);
    return <div className="label-tile" style={{boxSizing:'border-box',height:tileH+'mm',borderRight:bd,borderBottom:bd,borderTop:(cut&&bTop)?bd:'none',borderLeft:(cut&&bLeft)?bd:'none',padding:padY+'mm '+padX+'mm',overflow:'hidden',background:'#fff',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center'}}>
      {mode==='barcode'
        ? <>
            <svg ref={svgRef} style={{width:barW+'mm',height:barH+'mm',display:'block',flex:'none'}}></svg>
            {showText && <div style={{fontFamily:'monospace',fontSize:fs+'pt',lineHeight:1.2,height:textMm+'mm',whiteSpace:'nowrap',overflow:'hidden',marginTop:'0.5mm'}}>{code}</div>}
          </>
        : <>
            <div className="a4-qr" style={{width:qrMm+'mm',height:qrMm+'mm',flex:'none'}} dangerouslySetInnerHTML={{__html:qrHtml}}/>
            {showText && <div style={{fontFamily:'monospace',fontSize:'7pt',lineHeight:1.1,textAlign:'center',wordBreak:'break-all',maxHeight:'5mm',overflow:'hidden',marginTop:'0.5mm'}}>{code}</div>}
          </>}
    </div>;
  }

  return <div className="flex flex-col items-center justify-center border border-dashed border-slate-300 rounded-lg p-2.5 label-tile bg-white">
    {mode==='barcode'
      ? <svg ref={svgRef} className="w-full"></svg>
      : <>
          <div className="w-full max-w-[120px]" dangerouslySetInnerHTML={{__html:qrHtml}}/>
          {showText && <div className="text-[10px] font-mono mt-1.5 text-center break-all">{code}</div>}
        </>}
  </div>;
}

function a4Layout(mode,cols,showText){
  const PAGE_W=190, PAGE_H=275;
  const tileW=PAGE_W/cols;
  const textH=showText?5:0;
  const idealH = mode==='barcode' ? (showText?25.4:21) : Math.min(tileW,45)+textH+4;
  const rows=Math.max(1,mode==='barcode'?Math.floor(PAGE_H/idealH):Math.round(PAGE_H/idealH));
  const tileH=PAGE_H/rows;
  const qrMm=Math.max(8,Math.min(tileW-8,tileH-textH-5));
  return {tileW,tileH,rows,perPage:rows*cols,qrMm};
}
function A4Sheets({list,mode,cols,showText,qrLogo}){
  const {tileH,tileW,perPage,qrMm}=a4Layout(mode,cols,showText);
  const pages=[];
  for(let i=0;i<list.length;i+=perPage) pages.push(list.slice(i,i+perPage));
  return <>{pages.map((chunk,pi)=><div key={pi} className="a4-page" style={{gridTemplateColumns:`repeat(${cols},1fr)`,gridAutoRows:tileH+'mm',alignContent:'start',gap:0}}>
    {chunk.map((code,i)=><CodeTile key={code+'-'+pi+'-'+i} print cut={true} bTop={i<cols} bLeft={i%cols===0} code={code} mode={mode} showText={showText} qrLogo={qrLogo} tileH={tileH} tileW={tileW} qrMm={qrMm}/>)}
  </div>)}</>;
}

function BarcodeGen(){
  const [codes,setCodes]=useState('');
  const [mode,setMode]=useState('barcode');
  const [cols,setCols]=useState(3);
  const [showText,setShowText]=useState(true);
  const [seqMode,setSeqMode]=useState('urut');
  const [prefix,setPrefix]=useState('SKU-');
  const [suffix,setSuffix]=useState('');
  const [start,setStart]=useState(1);
  const [count,setCount]=useState(20);
  const [pattern,setPattern]=useState('A111');
  const [length,setLength]=useState(4);
  const [checksum,setChecksum]=useState(false);
  const [qrLogo,setQrLogo]=useState(null);
  const logoRef=useRef(null);

  const checksumDigit=s=>{let sum=0;for(const ch of s){if(ch>='0'&&ch<='9')sum+=parseInt(ch,10);}return sum%10;};

  const resizePattern=(pat,len)=>{
    pat=pat||'1'; if(!pat.length) pat='1';
    if(pat.length>=len) return pat.slice(0,len);
    let out=pat;
    while(out.length<len) out+=pat[out.length%pat.length];
    return out;
  };
  const patRadices=pat=>[...pat].map(ch=>/[a-zA-Z]/.test(ch)?26:(/[0-9]/.test(ch)?10:1));
  const encodeByPattern=(pat,n)=>{
    const radices=patRadices(pat);
    const chars=new Array(pat.length);
    let rem=Math.max(0,Math.floor(n));
    for(let i=pat.length-1;i>=0;i--){
      const ch=pat[i], r=radices[i];
      if(r===1){ chars[i]=ch; continue; }
      const d=rem%r; rem=Math.floor(rem/r);
      chars[i]=/[a-zA-Z]/.test(ch)?(ch===ch.toUpperCase()?String.fromCharCode(65+d):String.fromCharCode(97+d)):String(d);
    }
    return chars.join('');
  };

  useEffect(()=>{
    const p=prefix||''; const sfx=suffix||''; const st=Math.max(0,Number(start)||0); const c=Math.max(1,Number(count)||1);
    const len=Math.max(1,Number(length)||1);
    const pat=resizePattern(pattern,len);
    const radices=patRadices(pat);
    const cap=radices.reduce((a,b)=>a*b,1);
    let numbers=[];
    if(seqMode==='urut'){ for(let i=0;i<c;i++) numbers.push(st+i); }
    else{
      const maxVal=Math.max(cap-1,st+c-1,c-1);
      const pool=new Set(); const total=maxVal+1;
      while(pool.size<Math.min(c,total)) pool.add(Math.floor(Math.random()*total));
      numbers=Array.from(pool).sort(()=>Math.random()-.5);
    }
    setCodes(numbers.map(n=>{
      const base=p+encodeByPattern(pat,n);
      return (checksum?base+checksumDigit(base):base)+sfx;
    }).join('\n'));
  },[seqMode,prefix,suffix,start,count,pattern,length,checksum]);

  const list=useMemo(()=>codes.split('\n').map(s=>s.trim()).filter(Boolean),[codes]);

  const density=useMemo(()=>{
    if(mode!=='barcode'||!list.length) return null;
    let maxMod=0; for(const c of list){ const m=code128Modules(c); if(m>maxMod) maxMod=m; }
    if(!maxMod) return null;
    const availW=190/cols-6;
    return {moduleMm:availW/maxMod};
  },[list,mode,cols]);

  const onLogoFile=e=>{
    const file=e.target.files?.[0]; e.target.value='';
    if(!file) return;
    const reader=new FileReader();
    reader.onload=()=>setQrLogo(reader.result);
    reader.readAsDataURL(file);
  };

  useEffect(()=>{
    document.getElementById('a4-page-style')?.remove();
    const st=document.createElement('style'); st.id='a4-page-style';
    st.textContent='@page{size:A4 portrait;margin:10mm}';
    document.head.appendChild(st);
    document.body.classList.add('printing-a4');
    return ()=>{ document.body.classList.remove('printing-a4'); st.remove(); };
  },[]);
  const printA4=()=>{ setTimeout(()=>window.print(),80); };

  const renderGrid=()=><div style={{display:'grid',gridTemplateColumns:`repeat(${cols},1fr)`,gap:'8px'}}>
    {list.map((code,i)=><CodeTile key={code+'-'+i} code={code} mode={mode} showText={showText} qrLogo={qrLogo}/>)}
  </div>;

  return <div className="space-y-5">
    <div className="bg-white rounded-3xl border border-slate-100 shadow-soft p-5 space-y-4">
      <label className="block"><span className="block text-xs font-bold text-slate-500 mb-1.5">Daftar kode (satu per baris)</span>
        <textarea value={codes} onChange={e=>setCodes(e.target.value)} rows={5} placeholder={'SKU-0001\nSKU-0002\nSKU-0003'} className="w-full px-3 py-2.5 rounded-xl border border-slate-200 bg-white outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 font-mono text-sm"/>
      </label>
      <div className="text-xs text-slate-400">Tempel langsung dari Excel/Sheet, atau isi otomatis pakai pengaturan urutan di bawah.</div>

      <div className="border-t border-slate-100 pt-4 grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-7 gap-3">
        <div className="col-span-2 sm:col-span-1">
          <span className="block text-xs font-bold text-slate-500 mb-1.5">Urutan</span>
          <div className="flex bg-slate-100 rounded-xl p-1 gap-1">
            <button type="button" onClick={()=>setSeqMode('urut')} className={`flex-1 h-9 rounded-lg text-xs font-bold transition ${seqMode==='urut'?'bg-indigo-600 text-white shadow-sm':'text-slate-500'}`}>Berurutan</button>
            <button type="button" onClick={()=>setSeqMode('acak')} className={`flex-1 h-9 rounded-lg text-xs font-bold transition ${seqMode==='acak'?'bg-indigo-600 text-white shadow-sm':'text-slate-500'}`}>Acak</button>
          </div>
        </div>
        <Field label="Prefix" value={prefix} onChange={e=>setPrefix(e.target.value)}/>
        <Field label="Suffix" value={suffix} onChange={e=>setSuffix(e.target.value)}/>
        <Field label="Mulai" type="number" value={start} onChange={e=>setStart(e.target.value)} disabled={seqMode==='acak'} className={seqMode==='acak'?'opacity-50':''}/>
        <Field label="Jumlah" type="number" value={count} onChange={e=>setCount(e.target.value)}/>
        <Field label="Pola" value={pattern} onChange={e=>setPattern(e.target.value)} placeholder="Aa14"/>
        <Field label="Panjang" type="number" value={length} onChange={e=>setLength(e.target.value)}/>
      </div>
      <div className="text-xs text-slate-400 -mt-1">Buat &amp; cetak banyak kode sekaligus ke kertas A4.</div>
      <label className="flex items-center gap-2 text-sm"><input type="checkbox" checked={checksum} onChange={e=>setChecksum(e.target.checked)}/> Tambah digit checksum di akhir (anti kode asal-asalan)</label>
      <div className="text-xs text-slate-400">Daftar kode di atas otomatis terisi mengikuti pengaturan ini.</div>
    </div>

    <div className="bg-white rounded-3xl border border-slate-100 shadow-soft p-5 space-y-4">
      <div className="flex items-center justify-between gap-3">
        <div className="flex flex-wrap items-center gap-3">
          <div className="flex bg-slate-100 rounded-xl p-1 gap-1">
            <button type="button" onClick={()=>setMode('barcode')} className={`h-10 px-4 rounded-lg text-sm font-bold flex items-center gap-2 transition ${mode==='barcode'?'bg-indigo-600 text-white shadow-sm':'text-slate-500'}`}><Icon name="barcode" size={16}/>Barcode</button>
            <button type="button" onClick={()=>setMode('qr')} className={`h-10 px-4 rounded-lg text-sm font-bold flex items-center gap-2 transition ${mode==='qr'?'bg-indigo-600 text-white shadow-sm':'text-slate-500'}`}><Icon name="qrcode" size={16}/>QR Code</button>
          </div>
          <label className="flex items-center gap-2 text-sm h-10 px-3 rounded-xl border border-slate-200">
            <span className="text-slate-500 font-bold text-xs">Kolom</span>
            <select value={cols} onChange={e=>setCols(Number(e.target.value))} className="bg-transparent font-bold outline-none">
              <option value={2}>2</option><option value={3}>3</option><option value={4}>4</option>
            </select>
          </label>
        </div>
        <Button onClick={printA4} disabled={!list.length}><Icon name="printer" size={18}/><span className="hidden sm:inline">Cetak A4</span></Button>
      </div>
      <div className="flex flex-wrap items-center gap-x-5 gap-y-2">
        <label className="flex items-center gap-2 text-sm"><input type="checkbox" checked={showText} onChange={e=>setShowText(e.target.checked)}/> Tampilkan teks</label>
        <span className="text-xs text-slate-400">Muat <b>{a4Layout(mode,cols,showText).perPage}</b> label per lembar A4 ({cols} kolom × {a4Layout(mode,cols,showText).rows} baris) — isi <b>Jumlah</b> sebanyak itu supaya 1 lembar penuh.</span>
      </div>
      {mode==='qr' && <div className="flex items-center gap-3 flex-wrap text-sm">
        <span className="text-xs font-bold text-slate-500">Logo di tengah QR (opsional):</span>
        <input ref={logoRef} type="file" accept="image/*" onChange={onLogoFile} className="text-xs"/>
        {qrLogo && <button type="button" onClick={()=>{setQrLogo(null); if(logoRef.current) logoRef.current.value='';}} className="text-xs font-bold text-red-600">Hapus logo</button>}
      </div>}
      <div className="border-t border-slate-100 pt-4">
        {list.length? renderGrid() : <Empty text="Belum ada kode. Isi daftar kode di atas."/>}
      </div>
      {density && density.moduleMm<0.19 && <div className="text-xs font-bold text-red-600 bg-red-50 border border-red-100 rounded-xl p-3">Kode terpanjang terlalu padat untuk {cols} kolom (tebal batang ±{density.moduleMm.toFixed(2)}mm, disarankan ≥0.19mm) — batang bisa menyatu &amp; susah dipindai. Kurangi jumlah kolom atau pendekkan kode.</div>}
      {!!list.length && <div className="text-xs text-slate-400">{list.length} label siap dicetak</div>}
    </div>

    {ReactDOM.createPortal(<div className="print-a4"><A4Sheets list={list} mode={mode} cols={cols} showText={showText} qrLogo={qrLogo}/></div>, document.body)}
  </div>;
}

function SettingsModal({settings,onClose,onSave,onExportBackup,onImportBackup}){
  const [name,setName]=useState(settings.storeName||'R-Preloved');
  const [icon,setIcon]=useState(settings.storeIcon||'');
  const [rawIcon,setRawIcon]=useState(null);
  const [fitScale,setFitScale]=useState(1);
  const [zoom,setZoom]=useState(1);
  const [pos,setPos]=useState({x:0,y:0});
  const [transparentPreview,setTransparentPreview]=useState(true);
  const [address,setAddress]=useState(settings.storeAddress||'');
  const [phone,setPhone]=useState(settings.storePhone||'');
  const [paperWidth,setPaperWidth]=useState(settings.paperWidth||80);
  const [importing,setImporting]=useState(false);
  const importRef=useRef(null);
  const iconRef=useRef(null);
  const dragRef=useRef(null);
  const ICON_BOX=112, ICON_OUTPUT=256;
  const checkerBg={backgroundImage:'linear-gradient(45deg,#e2e8f0 25%,transparent 25%),linear-gradient(-45deg,#e2e8f0 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e2e8f0 75%),linear-gradient(-45deg,transparent 75%,#e2e8f0 75%)',backgroundSize:'12px 12px',backgroundPosition:'0 0,0 6px,6px -6px,-6px 0',backgroundColor:'#fff'};
  const solidBg={backgroundColor:'#0f172a'};
  const onIconFile=e=>{
    const file=e.target.files?.[0]; e.target.value='';
    if(!file) return;
    const reader=new FileReader();
    reader.onload=()=>{
      const dataUrl=reader.result;
      const probe=new Image();
      probe.onload=()=>{
        const fit=ICON_BOX/Math.max(probe.naturalWidth||1,probe.naturalHeight||1);
        setFitScale(fit); setZoom(1); setPos({x:0,y:0}); setRawIcon(dataUrl);
      };
      probe.onerror=()=>{ setFitScale(1); setZoom(1); setPos({x:0,y:0}); setRawIcon(dataUrl); };
      probe.src=dataUrl;
    };
    reader.readAsDataURL(file);
  };
  const onDragStart=e=>{ e.currentTarget.setPointerCapture?.(e.pointerId); dragRef.current={startX:e.clientX,startY:e.clientY,origX:pos.x,origY:pos.y}; };
  const onDragMove=e=>{ if(!dragRef.current) return; setPos({x:dragRef.current.origX+(e.clientX-dragRef.current.startX),y:dragRef.current.origY+(e.clientY-dragRef.current.startY)}); };
  const onDragEnd=()=>{ dragRef.current=null; };
  const applyIcon=()=>{
    const img=new Image();
    img.onload=()=>{
      const canvas=document.createElement('canvas');
      canvas.width=ICON_OUTPUT; canvas.height=ICON_OUTPUT;
      const ctx=canvas.getContext('2d');
      const factor=ICON_OUTPUT/ICON_BOX;
      const scale=fitScale*zoom*factor;
      ctx.save();
      ctx.translate(ICON_OUTPUT/2+pos.x*factor, ICON_OUTPUT/2+pos.y*factor);
      ctx.scale(scale,scale);
      ctx.drawImage(img,-img.width/2,-img.height/2);
      ctx.restore();
      setIcon(canvas.toDataURL('image/png'));
      setRawIcon(null);
    };
    img.src=rawIcon;
  };
  const handleImportFile=async e=>{
    const file=e.target.files?.[0]; e.target.value='';
    if(!file) return;
    setImporting(true);
    try{ await onImportBackup(file); } finally { setImporting(false); }
  };
  return <Modal title="Pengaturan" onClose={onClose}>
    <div className="space-y-5">
      <div>
        <div className="flex items-center justify-between mb-1.5">
          <span className="block text-xs font-bold text-slate-500">Icon / Logo toko</span>
          <button type="button" onClick={()=>setTransparentPreview(v=>!v)} className={`flex items-center gap-1.5 h-6 pl-1 pr-2 rounded-full text-[10px] font-bold transition ${transparentPreview?'bg-indigo-100 text-indigo-700':'bg-slate-800 text-white'}`}>
            <span className={`w-4 h-4 rounded-full transition flex items-center justify-center ${transparentPreview?'bg-indigo-600':'bg-white'}`}><Icon name={transparentPreview?'check':'x'} size={10} className={transparentPreview?'text-white':'text-slate-800'}/></span>
            {transparentPreview?'Preview transparan':'Preview gelap'}
          </button>
        </div>
        {!rawIcon ? <div className="flex items-center gap-3">
          <div className="w-16 h-16 rounded-2xl border border-slate-200 flex items-center justify-center overflow-hidden shrink-0" style={transparentPreview?checkerBg:solidBg}>
            {icon?<img src={icon} className="w-full h-full object-contain p-1.5"/>:<Icon name="shirt" size={24} className={transparentPreview?'text-slate-300':'text-slate-500'}/>}
          </div>
          <div className="flex-1 flex flex-col gap-2">
            <div className="flex gap-2">
              <Button type="button" variant="outline" className="flex-1" onClick={()=>iconRef.current?.click()}><Icon name="upload" size={16}/><span>{icon?'Ganti icon':'Upload icon'}</span></Button>
              {icon && <Button type="button" variant="danger" className="px-3" aria-label="Hapus icon" onClick={()=>setIcon('')}><Icon name="trash" size={16}/></Button>}
            </div>
            <input ref={iconRef} type="file" accept="image/png,image/webp,image/jpeg,image/svg+xml" onChange={onIconFile} className="hidden"/>
            <div className="text-xs text-slate-400 leading-relaxed">PNG transparan direkomendasikan. Tampil di judul aplikasi, sidebar &amp; header.</div>
          </div>
        </div> : <div className="space-y-3 p-3 rounded-2xl border border-slate-200 bg-slate-50">
          <div className="flex gap-3">
            <div className="relative w-28 h-28 rounded-2xl border border-slate-200 overflow-hidden shrink-0 touch-none cursor-move" style={transparentPreview?checkerBg:solidBg} onPointerDown={onDragStart} onPointerMove={onDragMove} onPointerUp={onDragEnd} onPointerLeave={onDragEnd}>
              <img src={rawIcon} draggable={false} className="absolute top-1/2 left-1/2 max-w-none pointer-events-none" style={{transform:`translate(-50%,-50%) translate(${pos.x}px,${pos.y}px) scale(${fitScale*zoom})`}}/>
              <div className="absolute inset-2 rounded-xl border-2 border-dashed border-white/70 pointer-events-none"></div>
            </div>
            <div className="flex-1 flex flex-col justify-center gap-2">
              <span className="text-xs font-bold text-slate-500">Perbesar / perkecil</span>
              <input type="range" min="0.3" max="3" step="0.02" value={zoom} onChange={e=>setZoom(Number(e.target.value))} className="w-full accent-indigo-600"/>
              <div className="text-xs text-slate-400">Seret gambar di kotak untuk atur posisi.</div>
              <button type="button" onClick={()=>{setZoom(1);setPos({x:0,y:0});}} className="text-xs font-bold text-indigo-600 text-left active:scale-95 transition">Reset posisi</button>
            </div>
          </div>
          <div className="flex gap-2">
            <Button type="button" variant="outline" className="flex-1" onClick={()=>setRawIcon(null)}>Batal</Button>
            <Button type="button" className="flex-1" onClick={applyIcon}><Icon name="check" size={16}/><span>Terapkan</span></Button>
          </div>
        </div>}
      </div>
      <Field label="Nama toko" value={name} onChange={e=>setName(e.target.value)}/>
      <Field label="Alamat toko (tampil di struk, opsional)" value={address} onChange={e=>setAddress(e.target.value)}/>
      <Field label="No. telepon (tampil di struk, opsional)" value={phone} onChange={e=>setPhone(e.target.value)}/>
      <label className="block"><span className="block text-xs font-bold text-slate-500 mb-1.5">Lebar kertas printer thermal</span><select value={paperWidth} onChange={e=>setPaperWidth(Number(e.target.value))} className="w-full h-11 px-3 rounded-xl border border-slate-200 bg-white"><option value={80}>80mm (48 kolom)</option><option value={58}>58mm (32 kolom)</option></select></label>
      <div className="rounded-2xl bg-slate-50 p-4 text-sm space-y-1.5">
        <div><b>Penyimpanan utama:</b> IndexedDB di browser/HP ini — tetap jalan tanpa internet.</div>
        <div>Sinkron cloud (2 arah antar HP) sudah dikonfigurasi otomatis di dalam aplikasi ini — tidak perlu diisi manual.</div>
      </div>
      <div className="space-y-3 rounded-2xl border border-slate-200 p-4">
        <div className="font-extrabold text-sm flex items-center gap-2"><Icon name="backup" size={16}/>Backup Manual (File .json)</div>
        <div className="text-xs text-slate-500 leading-relaxed">Cadangan lengkap (produk, penjualan, pengeluaran, stock opname, pengaturan) yang tersimpan sebagai <b>file di HP kamu</b> — tidak bergantung ke Google Sheets/cloud. Simpan filenya di Drive/WhatsApp/email sendiri sebagai jaga-jaga kalau HP hilang atau ganti HP.</div>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
          <Button type="button" variant="outline" className="w-full" onClick={onExportBackup}><Icon name="download" size={17}/><span>Export Backup</span></Button>
          <Button type="button" variant="outline" className="w-full" disabled={importing} onClick={()=>importRef.current?.click()}><Icon name="upload" size={17}/><span>{importing?'Mengimpor…':'Import Backup'}</span></Button>
          <input ref={importRef} type="file" accept="application/json,.json" onChange={handleImportFile} className="hidden"/>
        </div>
      </div>
      <div className="rounded-xl bg-amber-50 text-amber-800 p-3 text-xs leading-relaxed"><b>Wajib untuk sync 2 arah antar HP:</b> tambahkan 2 kolom baru di header tiap sheet Google Sheets (Produk, Penjualan, Pengeluaran, Stock Opname — bukan di sheet Ringkasan): <b>updatedAt</b> dan <b>deleted</b>. Kalau kolom ini belum ada, data akan tetap terkirim (push) tapi HP lain tidak akan bisa menariknya turun dengan akurat.</div>
      <Button className="w-full" onClick={()=>onSave({...settings,storeName:name,storeIcon:icon,storeAddress:address,storePhone:phone,paperWidth})}>Simpan</Button>
    </div>
  </Modal>
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
