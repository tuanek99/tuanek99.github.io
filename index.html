function LabelModal({product,settings,onClose}){
  const [mode,setMode]=useState('barcode');
  const [qty,setQty]=useState(1);
  const [showName,setShowName]=useState(true);
  const [showPrice,setShowPrice]=useState(true);
  const [dataUrl,setDataUrl]=useState('');
  const [status,setStatus]=useState('');
  const [busy,setBusy]=useState(false);

  useEffect(()=>{
    let cancelled=false;
    setStatus('');
    (async()=>{
      try{
        const canvas=await renderLabelCanvas({product,settings,mode,showName,showPrice});
        if(!cancelled) setDataUrl(canvas.toDataURL('image/png'));
      }catch(e){ console.error(e); if(!cancelled){ setDataUrl(''); setStatus(e.message||'Gagal membuat barcode/QR.'); } }
    })();
    return ()=>{cancelled=true};
  },[mode,showName,showPrice,product.id,settings.paperWidth]);

  const printBrowser=()=>{ if(dataUrl) window.print(); };
  const printBluetooth=async()=>{
    setBusy(true); setStatus('');
    try{
      const canvas=await renderLabelCanvas({product,settings,mode,showName,showPrice});
      const raster=canvasToEscPosRaster(canvas);
      const feed=new TextEncoder().encode('\n\n');
      const one=new Uint8Array(raster.length+feed.length);
      one.set(raster,0); one.set(feed,raster.length);
      const n=Math.max(1,Number(qty)||1);
      const all=new Uint8Array(2+one.length*n+4);
      all.set([0x1B,0x40],0);
      for(let i=0;i<n;i++) all.set(one,2+i*one.length);
      all.set([0x1D,0x56,0x42,0x00],2+one.length*n);
      await printEscPosBluetooth(all,setStatus);
    }catch(err){ console.error(err); setStatus(err.message||'Gagal mencetak label ke printer Bluetooth.'); }
    finally{ setBusy(false); }
  };

  return <Modal title="Cetak Label Harga & Barcode" onClose={onClose}>
    <div className="space-y-4">
      <div className="flex items-center justify-center bg-slate-50 rounded-2xl p-4 min-h-[140px]">
        {dataUrl? <img src={dataUrl} alt="Preview label" className="max-w-full" style={{imageRendering:'pixelated'}}/> : <div className="text-xs text-slate-400">Menyiapkan preview…</div>}
      </div>
      <div className="grid grid-cols-2 gap-2">
        <button type="button" onClick={()=>setMode('barcode')} className={`h-11 rounded-xl font-bold text-sm ${mode==='barcode'?'bg-slate-900 text-white':'bg-white border border-slate-200'}`}>Barcode (Code128)</button>
        <button type="button" onClick={()=>setMode('qr')} className={`h-11 rounded-xl font-bold text-sm ${mode==='qr'?'bg-slate-900 text-white':'bg-white border border-slate-200'}`}>QR Code</button>
      </div>
      <div className="flex flex-wrap gap-4 text-sm">
        <label className="flex items-center gap-2"><input type="checkbox" checked={showName} onChange={e=>setShowName(e.target.checked)}/> Nama produk</label>
        <label className="flex items-center gap-2"><input type="checkbox" checked={showPrice} onChange={e=>setShowPrice(e.target.checked)}/> Harga</label>
      </div>
      <NumberField label="Jumlah label dicetak" value={qty} onChange={v=>setQty(Math.max(1,v||1))}/>
      {status && <div className="text-xs font-semibold text-slate-500 text-center">{status}</div>}
      <div className="grid grid-cols-1 gap-2">
        <Button onClick={printBrowser} disabled={!dataUrl} className="w-full"><Icon name="printer" size={18}/><span>Cetak (Print biasa / printer terpasang)</span></Button>
        <Button onClick={printBluetooth} disabled={busy||!dataUrl} variant="outline" className="w-full"><Icon name="bluetooth" size={18}/><span>{busy?'Mencetak…':`Cetak ${qty>1?qty+'x ':''}Langsung ke Printer Bluetooth (ESC/POS)`}</span></Button>
      </div>
      <div className="text-xs text-slate-400 leading-relaxed">
        Barcode/QR dibuat sendiri dari kolom <b>SKU</b> produk ini (offline, tidak ada layanan luar) — cocok ditempel di baju preloved yang tidak punya barcode asli. Hasil cetak bisa langsung dipindai lagi lewat menu <b>Scan SKU</b>.
      </div>
      <Button variant="soft" onClick={onClose} className="w-full">Tutup</Button>
    </div>
    <div className="print-area">
      <div style={{display:'flex',flexWrap:'wrap',gap:'2mm'}}>
        {Array.from({length:Math.max(1,Number(qty)||1)}).map((_,i)=><div key={i} className="label-tile">{dataUrl && <img src={dataUrl} style={{width:'100%',display:'block'}}/>}</div>)}
      </div>
    </div>
  </Modal>
}

function Sales({sales,onSell,onPrint,onCancel}){
  const [q,setQ]=useState('');
  const dq=useDeferredValue(q);
  const sortedSales=useMemo(()=>sales.slice().sort((a,b)=>b.date-a.date),[sales]);
  // Teks pencarian per transaksi (dibuat sekali per perubahan data): barang, SKU, metode bayar, kasir, tanggal, no. transaksi, status batal.
  const indexed=useMemo(()=>sortedSales.map(s=>{
    const d=new Date(s.date), ok=!isNaN(d.getTime()), pad=n=>String(n).padStart(2,'0');
    const nums=ok?`${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`:'';
    const h=[...(s.items||[]).map(i=>(i.name||'')+' '+(i.sku||'')),s.payment||'',s.cashier||'',dateText(s.date),nums,'#'+String(s.id).slice(0,8),s.cancelled?'dibatalkan batal':''].join(' ').toLowerCase();
    return {s,h};
  }),[sortedSales]);
  const list=useMemo(()=>{
    const words=dq.trim().toLowerCase().split(/\s+/).filter(Boolean);
    if(!words.length) return sortedSales;
    return indexed.filter(x=>words.every(w=>x.h.includes(w))).map(x=>x.s);
  },[sortedSales,indexed,dq]);
  // Tampilkan bertahap: 40 transaksi dulu, sisanya dimuat saat scroll mendekati bawah.
  const [vis,setVis]=useState(40);
  useEffect(()=>{ setVis(40); },[dq]);
  const shownSales=useMemo(()=>list.length>vis?list.slice(0,vis):list,[list,vis]);
  const salesSentinel=useRef(null);
  useEffect(()=>{
    const el=salesSentinel.current;
    if(!el || vis>=list.length || !('IntersectionObserver' in window)) return;
    const io=new IntersectionObserver(es=>{ if(es[0].isIntersecting) setVis(v=>v+40); },{rootMargin:'500px'});
    io.observe(el); return ()=>io.disconnect();
  },[vis,list.length]);
  return <div className="space-y-4"><div className="flex justify-between items-center"><div><h1 className="text-2xl font-black">Penjualan</h1><p className="text-sm text-slate-500">Riwayat transaksi offline.</p></div><Button onClick={onSell}><Icon name="plus" size={18}/><span>Penjualan</span></Button></div><input value={q} onChange={e=>setQ(e.target.value)} placeholder="Cari transaksi / SKU…" className="w-full h-11 px-4 rounded-xl border border-slate-200 bg-white"/><div className="space-y-3">{shownSales.map(s=><div key={s.id} className={`bg-white rounded-2xl border p-4 shadow-soft ${s.cancelled?'border-red-100 opacity-70':'border-slate-100'}`}><div className="flex justify-between gap-3"><div><div className="flex items-center gap-2 flex-wrap"><b className={s.cancelled?'line-through text-slate-400':''}>{s.items.map(i=>i.name).join(', ')}</b>{s.cancelled&&<span className="px-2 py-0.5 rounded-full text-[10px] font-extrabold bg-red-50 text-red-600 shrink-0">DIBATALKAN</span>}{!s.cancelled&&s.discount>0&&<span className="px-2 py-0.5 rounded-full text-[10px] font-extrabold bg-amber-50 text-amber-700 shrink-0">DISKON {money(s.discount)}</span>}</div><div className="text-xs text-slate-400 mt-1">{dateText(s.date)} • {s.items.length} item • <span className="font-bold">{s.payment}</span></div></div><b className={`text-lg ${s.cancelled?'line-through text-slate-400':''}`}>{money(s.total)}</b></div><div className="mt-3 pt-3 border-t text-xs text-slate-500 flex justify-between items-center"><span>Modal {money(s.costTotal)}</span><span className="font-bold text-emerald-600">Margin {money(s.total-s.costTotal)}</span></div>{!s.cancelled&&<div className="mt-3 flex items-center gap-2"><button type="button" onClick={()=>onPrint(s)} className="flex-1 flex items-center justify-center gap-2 h-10 rounded-xl border border-slate-200 text-sm font-bold text-slate-700 active:scale-[.98] transition"><Icon name="printer" size={16}/>Cetak Struk</button><button type="button" onClick={()=>onCancel(s)} className="shrink-0 flex items-center justify-center gap-1 h-10 px-3 rounded-xl text-xs font-semibold text-slate-400 hover:text-red-600 hover:bg-red-50 active:text-red-600 active:scale-[.98] transition"><Icon name="x" size={14}/>Batalkan</button></div>}</div>)}{list.length>shownSales.length&&<div ref={salesSentinel} className="p-3 text-center"><button type="button" onClick={()=>setVis(v=>v+40)} className="text-xs font-bold text-indigo-600 active:scale-95 transition">Muat lebih banyak</button></div>}{!list.length&&<Empty text="Belum ada penjualan."/>}</div></div>
}

function stocktakeLine(s){

function useBarcodeCamera(onCode){
  const videoRef=useRef(null), cbRef=useRef(onCode); cbRef.current=onCode;
  const [camStatus,setCamStatus]=useState('Menyiapkan kamera…');
  useEffect(()=>{
    let alive=true, stream=null, raf=null;
    (async()=>{
      try{
        if(!navigator.mediaDevices?.getUserMedia) throw new Error('no camera');
        stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
        if(!alive){stream.getTracks().forEach(t=>t.stop());return}
        videoRef.current.srcObject=stream; await videoRef.current.play();
        if(!('BarcodeDetector' in window)){setCamStatus('BarcodeDetector belum tersedia. Masukkan SKU manual.');return}
        const formats=await BarcodeDetector.getSupportedFormats();
        const det=new BarcodeDetector({formats:formats.filter(f=>['code_128','code_39','ean_13','ean_8','upc_a','upc_e','qr_code'].includes(f))});
        setCamStatus('Arahkan barcode ke kotak pemindai.');
        const loop=async()=>{if(!alive)return;try{const c=await det.detect(videoRef.current);if(c.length)cbRef.current(c[0].rawValue)}catch(e){}raf=requestAnimationFrame(loop)};
        raf=requestAnimationFrame(loop);
      }catch(e){setCamStatus('Kamera tidak dapat diakses. Cek izin kamera atau gunakan SKU manual.')}
    })();
    return()=>{alive=false;if(raf)cancelAnimationFrame(raf);stream?.getTracks().forEach(t=>t.stop())};
  },[]);
  return {videoRef,camStatus};
}

function code128Modules(code){
  try{
    const t=document.createElementNS('http://www.w3.org/2000/svg','svg');
    JsBarcode(t,code,{format:'CODE128',width:1,height:10,margin:0,displayValue:false});
    return parseFloat(t.getAttribute('width'))||0;
  }catch(e){ return 0; }
}
function CodeTile({code,mode,showText,qrLogo,print,tileH,tileW,qrMm,bTop,bLeft,cut}){
  const svgRef=useRef(null);

  const modules=useMemo(()=>(print&&mode==='barcode')?code128Modules(code):0,[code,print,mode]);
  const padX=3, padY=2.5;
  const availW=(tileW||0)-2*padX;
  const barW=Math.min(availW,(modules||1)*0.4);
  const textMm=showText?4:0;
  const barH=Math.max(6,(tileH||0)-2*padY-textMm-0.5);

  useEffect(()=>{
    if(mode!=='barcode') return;
    const svg=svgRef.current;
    if(!svg) return;
    while(svg.firstChild) svg.removeChild(svg.firstChild);
    try{
      if(print){
        const w=modules||1;
        const h=w*barH/barW;
        JsBarcode(svg,code,{format:'CODE128',displayValue:false,margin:0,height:h,width:1});
        svg.setAttribute('viewBox','0 0 '+w+' '+h);
        svg.setAttribute('width',barW+'mm');
        svg.setAttribute('height',barH+'mm');
        svg.setAttribute('preserveAspectRatio','none');
        return;
      }
      JsBarcode(svg,code,{format:'CODE128',displayValue:showText,fontSize:14,textMargin:3,margin:8,height:50,width:2});
      if(!svg.getAttribute('viewBox')){
        const w=parseFloat(svg.getAttribute('width'))||0, h=parseFloat(svg.getAttribute('height'))||0;
        if(w&&h) svg.setAttribute('viewBox','0 0 '+w+' '+h);
      }
      svg.setAttribute('preserveAspectRatio','xMidYMid meet');
    }catch(e){  }
  },[code,mode,showText,print,modules,barW,barH]);

  const qrHtml=useMemo(()=>{
    if(mode!=='qr') return '';
    try{
      if(typeof window.qrcode!=='function') return '';
      const level=qrLogo?'H':'M';
      let qr=null;
      for(let type=1;type<=40;type++){
        try{ const attempt=window.qrcode(type,level); attempt.addData(code); attempt.make(); qr=attempt; break; }catch(e){}
      }
      return qr?qrSvgMarkup(qr,2,qrLogo):'';
    }catch(e){ return ''; }
  },[mode,code,qrLogo]);

  if(print){
    const bd=cut?'0.3mm dashed #94a3b8':'none';
    const fs=Math.min(8,(availW/(Math.max(code.length,1)*0.62))/0.3528);
    return <div className="label-tile" style={{boxSizing:'border-box',height:tileH+'mm',borderRight:bd,borderBottom:bd,borderTop:(cut&&bTop)?bd:'none',borderLeft:(cut&&bLeft)?bd:'none',padding:padY+'mm '+padX+'mm',overflow:'hidden',background:'#fff',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center'}}>
      {mode==='barcode'
        ? <>
            <svg ref={svgRef} style={{width:barW+'mm',height:barH+'mm',display:'block',flex:'none'}}></svg>
            {showText && <div style={{fontFamily:'monospace',fontSize:fs+'pt',lineHeight:1.2,height:textMm+'mm',whiteSpace:'nowrap',overflow:'hidden',marginTop:'0.5mm'}}>{code}</div>}
          </>
        : <>
            <div className="a4-qr" style={{width:qrMm+'mm',height:qrMm+'mm',flex:'none'}} dangerouslySetInnerHTML={{__html:qrHtml}}/>
            {showText && <div style={{fontFamily:'monospace',fontSize:'7pt',lineHeight:1.1,textAlign:'center',wordBreak:'break-all',maxHeight:'5mm',overflow:'hidden',marginTop:'0.5mm'}}>{code}</div>}
          </>}
    </div>;
  }

  return <div className="flex flex-col items-center justify-center border border-dashed border-slate-300 rounded-lg p-2.5 label-tile bg-white">
    {mode==='barcode'
      ? <svg ref={svgRef} className="w-full"></svg>
      : <>
          <div className="w-full max-w-[120px]" dangerouslySetInnerHTML={{__html:qrHtml}}/>
          {showText && <div className="text-[10px] font-mono mt-1.5 text-center break-all">{code}</div>}
        </>}
  </div>;
}

function a4Layout(mode,cols,showText){
  const PAGE_W=190, PAGE_H=275;
  const tileW=PAGE_W/cols;
  const textH=showText?5:0;
  const idealH = mode==='barcode' ? (showText?25.4:21) : Math.min(tileW,45)+textH+4;
  const rows=Math.max(1,mode==='barcode'?Math.floor(PAGE_H/idealH):Math.round(PAGE_H/idealH));
  const tileH=PAGE_H/rows;
  const qrMm=Math.max(8,Math.min(tileW-8,tileH-textH-5));
  return {tileW,tileH,rows,perPage:rows*cols,qrMm};
}
function A4Sheets({list,mode,cols,showText,qrLogo}){
  const {tileH,tileW,perPage,qrMm}=a4Layout(mode,cols,showText);
  const pages=[];
  for(let i=0;i<list.length;i+=perPage) pages.push(list.slice(i,i+perPage));
  return <>{pages.map((chunk,pi)=><div key={pi} className="a4-page" style={{gridTemplateColumns:`repeat(${cols},1fr)`,gridAutoRows:tileH+'mm',alignContent:'start',gap:0}}>
    {chunk.map((code,i)=><CodeTile key={code+'-'+pi+'-'+i} print cut={true} bTop={i<cols} bLeft={i%cols===0} code={code} mode={mode} showText={showText} qrLogo={qrLogo} tileH={tileH} tileW={tileW} qrMm={qrMm}/>)}
  </div>)}</>;
}

function BarcodeGen(){
  const [codes,setCodes]=useState('');
  const [mode,setMode]=useState('barcode');
  const [cols,setCols]=useState(3);
  const [showText,setShowText]=useState(true);

  const [prefix,setPrefix]=useState('SKU-');
  const [suffix,setSuffix]=useState('');
  const [start,setStart]=useState(1);
  const [count,setCount]=useState(20);
  const [pattern,setPattern]=useState('A111');
  const [length,setLength]=useState(4);
  const [checksum,setChecksum]=useState(false);
  const [qrLogo,setQrLogo]=useState(null);
  const logoRef=useRef(null);

  const checksumDigit=s=>{let sum=0;for(const ch of s){if(ch>='0'&&ch<='9')sum+=parseInt(ch,10);}return sum%10;};

  const resizePattern=(pat,len)=>{
    pat=pat||'1'; if(!pat.length) pat='1';
    if(pat.length>=len) return pat.slice(0,len);

    return out;
  };
  const patRadices=pat=>[...pat].map(ch=>/[a-zA-Z]/.test(ch)?26:(/[0-9]/.test(ch)?10:1));
  const encodeByPattern=(pat,n)=>{
    const radices=patRadices(pat);
    const chars=new Array(pat.length);
    let rem=Math.max(0,Math.floor(n));
    for(let i=pat.length-1;i>=0;i--){
      const ch=pat[i], r=radices[i];
      if(r===1){ chars[i]=ch; continue; }
      const d=rem%r; rem=Math.floor(rem/r);
      chars[i]=/[a-zA-Z]/.test(ch)?(ch===ch.toUpperCase()?String.fromCharCode(65+d):String.fromCharCode(97+d)):String(d);
    }
    return chars.join('');
  };

  useEffect(()=>{
    const p=prefix||''; const sfx=suffix||''; const st=Math.max(0,Number(start)||0); const c=Math.max(1,Number(count)||1);
    const len=Math.max(1,Number(length)||1);
    const pat=resizePattern(pattern,len);
    const radices=patRadices(pat);
    const cap=radices.reduce((a,b)=>a*b,1);
    let numbers=[];
    if(seqMode==='urut'){ for(let i=0;i<c;i++) numbers.push(st+i); }
    else{
      const maxVal=Math.max(cap-1,st+c-1,c-1);
      const pool=new Set(); const total=maxVal+1;
      while(pool.size<Math.min(c,total)) pool.add(Math.floor(Math.random()*total));
      numbers=Array.from(pool).sort(()=>Math.random()-.5);
    }
    setCodes(numbers.map(n=>{
      const base=p+encodeByPattern(pat,n);
      return (checksum?base+checksumDigit(base):base)+sfx;
    }).join('\n'));
  },[seqMode,prefix,suffix,start,count,pattern,length,checksum]);

  const list=useMemo(()=>codes.split('\n').map(s=>s.trim()).filter(Boolean),[codes]);

  const density=useMemo(()=>{
    if(mode!=='barcode'||!list.length) return null;
    let maxMod=0; for(const c of list){ const m=code128Modules(c); if(m>maxMod) maxMod=m; }
    if(!maxMod) return null;
    const availW=190/cols-6;
    return {moduleMm:availW/maxMod};
  },[list,mode,cols]);

  const onLogoFile=e=>{
    const file=e.target.files?.[0]; e.target.value='';
    if(!file) return;
    const reader=new FileReader();
    reader.onload=()=>setQrLogo(reader.result);
    reader.readAsDataURL(file);
  };

  useEffect(()=>{
    document.getElementById('a4-page-style')?.remove();
    const st=document.createElement('style'); st.id='a4-page-style';
    st.textContent='@page{size:A4 portrait;margin:10mm}';
    document.head.appendChild(st);
    document.body.classList.add('printing-a4');
    return ()=>{ document.body.classList.remove('printing-a4'); st.remove(); };
  },[]);
  const printA4=()=>{ setTimeout(()=>window.print(),80); };

  const renderGrid=()=><div style={{display:'grid',gridTemplateColumns:`repeat(${cols},1fr)`,gap:'8px'}}>
    {list.map((code,i)=><CodeTile key={code+'-'+i} code={code} mode={mode} showText={showText} qrLogo={qrLogo}/>)}
  </div>;

  return <div className="space-y-5">
    <div className="bg-white rounded-3xl border border-slate-100 shadow-soft p-5 space-y-4">
      <label className="block"><span className="block text-xs font-bold text-slate-500 mb-1.5">Daftar kode (satu per baris)</span>
        <textarea value={codes} onChange={e=>setCodes(e.target.value)} rows={5} placeholder={'SKU-0001\nSKU-0002\nSKU-0003'} className="w-full px-3 py-2.5 rounded-xl border border-slate-200 bg-white outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 font-mono text-sm"/>
      </label>
      <div className="text-xs text-slate-400">Tempel langsung dari Excel/Sheet, atau isi otomatis pakai pengaturan urutan di bawah.</div>

      <div className="border-t border-slate-100 pt-4 grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-7 gap-3">
        <div className="col-span-2 sm:col-span-1">
          <span className="block text-xs font-bold text-slate-500 mb-1.5">Urutan</span>
          <div className="flex bg-slate-100 rounded-xl p-1 gap-1">
            <button type="button" onClick={()=>setSeqMode('urut')} className={`flex-1 h-9 rounded-lg text-xs font-bold transition ${seqMode==='urut'?'bg-indigo-600 text-white shadow-sm':'text-slate-500'}`}>Berurutan</button>
            <button type="button" onClick={()=>setSeqMode('acak')} className={`flex-1 h-9 rounded-lg text-xs font-bold transition ${seqMode==='acak'?'bg-indigo-600 text-white shadow-sm':'text-slate-500'}`}>Acak</button>
          </div>
        </div>
        <Field label="Prefix" value={prefix} onChange={e=>setPrefix(e.target.value)}/>
        <Field label="Suffix" value={suffix} onChange={e=>setSuffix(e.target.value)}/>
        <Field label="Mulai" type="number" value={start} onChange={e=>setStart(e.target.value)} disabled={seqMode==='acak'} className={seqMode==='acak'?'opacity-50':''}/>
        <Field label="Jumlah" type="number" value={count} onChange={e=>setCount(e.target.value)}/>
        <Field label="Pola" value={pattern} onChange={e=>setPattern(e.target.value)} placeholder="Aa14"/>
        <Field label="Panjang" type="number" value={length} onChange={e=>setLength(e.target.value)}/>
      </div>
      <div className="text-xs text-slate-400 -mt-1">Buat &amp; cetak banyak kode sekaligus ke kertas A4.</div>
      <label className="flex items-center gap-2 text-sm"><input type="checkbox" checked={checksum} onChange={e=>setChecksum(e.target.checked)}/> Tambah digit checksum di akhir (anti kode asal-asalan)</label>
      <div className="text-xs text-slate-400">Daftar kode di atas otomatis terisi mengikuti pengaturan ini.</div>
    </div>

    <div className="bg-white rounded-3xl border border-slate-100 shadow-soft p-5 space-y-4">
      <div className="flex items-center justify-between gap-3">
        <div className="flex flex-wrap items-center gap-3">
          <div className="flex bg-slate-100 rounded-xl p-1 gap-1">
            <button type="button" onClick={()=>setMode('barcode')} className={`h-10 px-4 rounded-lg text-sm font-bold flex items-center gap-2 transition ${mode==='barcode'?'bg-indigo-600 text-white shadow-sm':'text-slate-500'}`}><Icon name="barcode" size={16}/>Barcode</button>
            <button type="button" onClick={()=>setMode('qr')} className={`h-10 px-4 rounded-lg text-sm font-bold flex items-center gap-2 transition ${mode==='qr'?'bg-indigo-600 text-white shadow-sm':'text-slate-500'}`}><Icon name="qrcode" size={16}/>QR Code</button>
          </div>
          <label className="flex items-center gap-2 text-sm h-10 px-3 rounded-xl border border-slate-200">
            <span className="text-slate-500 font-bold text-xs">Kolom</span>
            <select value={cols} onChange={e=>setCols(Number(e.target.value))} className="bg-transparent font-bold outline-none">
              <option value={2}>2</option><option value={3}>3</option><option value={4}>4</option>
            </select>
          </label>
        </div>
        <Button onClick={printA4} disabled={!list.length}><Icon name="printer" size={18}/><span className="hidden sm:inline">Cetak A4</span></Button>
      </div>
      <div className="flex flex-wrap items-center gap-x-5 gap-y-2">
        <label className="flex items-center gap-2 text-sm"><input type="checkbox" checked={showText} onChange={e=>setShowText(e.target.checked)}/> Tampilkan teks</label>
        <span className="text-xs text-slate-400">Muat <b>{a4Layout(mode,cols,showText).perPage}</b> label per lembar A4 ({cols} kolom × {a4Layout(mode,cols,showText).rows} baris) — isi <b>Jumlah</b> sebanyak itu supaya 1 lembar penuh.</span>
      </div>
      {mode==='qr' && <div className="flex items-center gap-3 flex-wrap text-sm">
        <span className="text-xs font-bold text-slate-500">Logo di tengah QR (opsional):</span>
        <input ref={logoRef} type="file" accept="image/*" onChange={onLogoFile} className="text-xs"/>
        {qrLogo && <button type="button" onClick={()=>{setQrLogo(null); if(logoRef.current) logoRef.current.value='';}} className="text-xs font-bold text-red-600">Hapus logo</button>}
      </div>}
      <div className="border-t border-slate-100 pt-4">
        {list.length? renderGrid() : <Empty text="Belum ada kode. Isi daftar kode di atas."/>}
      </div>
      {density && density.moduleMm<0.19 && <div className="text-xs font-bold text-red-600 bg-red-50 border border-red-100 rounded-xl p-3">Kode terpanjang terlalu padat untuk {cols} kolom (tebal batang ±{density.moduleMm.toFixed(2)}mm, disarankan ≥0.19mm) — batang bisa menyatu &amp; susah dipindai. Kurangi jumlah kolom atau pendekkan kode.</div>}
      {!!list.length && <div className="text-xs text-slate-400">{list.length} label siap dicetak</div>}
    </div>

    {ReactDOM.createPortal(<div className="print-a4"><A4Sheets list={list} mode={mode} cols={cols} showText={showText} qrLogo={qrLogo}/></div>, document.body)}
  </div>;
}

function SettingsModal({settings,onClose,onSave,onExportBackup,onImportBackup}){
  const [name,setName]=useState(settings.storeName||'R-Studio');
  const [icon,setIcon]=useState(settings.storeIcon||'');
  const [rawIcon,setRawIcon]=useState(null);
  const [fitScale,setFitScale]=useState(1);
  const [zoom,setZoom]=useState(1);
  const [pos,setPos]=useState({x:0,y:0});
  const [transparentPreview,setTransparentPreview]=useState(true);
  const [address,setAddress]=useState(settings.storeAddress||'');
  const [phone,setPhone]=useState(settings.storePhone||'');
  const [paperWidth,setPaperWidth]=useState(settings.paperWidth||80);
  const [accts,setAccts]=useState(Array.isArray(settings.extraAccounts)?settings.extraAccounts.map(a=>({cloudName:a.cloudName||'',uploadPreset:a.uploadPreset||''})):[]);
  const setAcct=(i,k,v)=>setAccts(l=>l.map((a,j)=>j===i?{...a,[k]:v}:a));
  const downMap=cloudDownMap();
  const [importing,setImporting]=useState(false);
  const importRef=useRef(null);
  const iconRef=useRef(null);
  const [bSlides,setBSlides]=useState([]);
  const [bSec,setBSec]=useState(3);
  const [bState,setBState]=useState('loading'); // loading | ready | error
  const [bMsg,setBMsg]=useState('');
  const [bBusy,setBBusy]=useState(false);
  const [bDirty,setBDirty]=useState(false);
  const bannerRef=useRef(null);
  useEffect(()=>{
    let alive=true;
    (async()=>{
      if(!sb){ if(alive){ setBState('error'); setBMsg('Supabase belum siap. Muat ulang halaman.'); } return; }
      try{
        const {data,error}=await sb.from('shop_settings').select('value').eq('key','banner').maybeSingle();
        if(!alive) return;
        if(error){
          setBState('error');
          setBMsg(/relation|schema cache|does not exist|42P01|PGRST205/i.test((error.message||'')+(error.code||''))?'Tabel banner belum ada. Jalankan banner_settings.sql di Supabase → SQL Editor, lalu buka Pengaturan lagi.':(error.message||'Gagal memuat banner'));
          return;
        }
        const v=data&&data.value?data.value:{};
        setBSlides(Array.isArray(v.slides)?v.slides.filter(x=>x&&x.src).map(x=>({src:x.src,type:x.type==='video'?'video':'image'})):[]);
        if(Number(v.intervalSec)>=2) setBSec(Number(v.intervalSec));
        setBState('ready');
      }catch(err){ if(alive){ setBState('error'); setBMsg(err.message||'Gagal memuat banner'); } }
    })();
    return ()=>{ alive=false; };
  },[]);
  const onBannerFiles=async e=>{
    const files=[...(e.target.files||[])]; e.target.value='';
    if(!files.length) return;
    setBBusy(true); setBMsg('');
    try{
      let count=bSlides.length;
      for(const f of files){
        if(count>=10){ setBMsg('Maksimal 10 banner.'); break; }
        const isVid=/^video\/(mp4|webm|quicktime)$/.test(f.type);
        if(!isVid && !/^image\/(png|gif|jpeg|webp)$/.test(f.type)){ setBMsg(f.name+': format harus PNG, GIF, JPG, WebP, MP4, atau WebM.'); continue; }
        if(f.size>(isVid?30:8)*1024*1024){ setBMsg(f.name+': ukuran lebih dari '+(isVid?30:8)+' MB.'); continue; }
        const dataUrl=await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(new Error('Gagal membaca file')); r.readAsDataURL(f); });
        const url=await uploadToCloudinary(dataUrl);
        setBSlides(prev=>[...prev,{src:isVid?videoUrl(url):url,type:isVid?'video':'image'}]); setBDirty(true); count++;
      }
    }catch(err){ setBMsg(err.message||'Upload gagal'); }
    setBBusy(false);
  };
  const moveB=(i,d)=>{ setBSlides(prev=>{ const j=i+d; if(j<0||j>=prev.length) return prev; const n=[...prev]; [n[i],n[j]]=[n[j],n[i]]; return n; }); setBDirty(true); };
  const removeB=i=>{ setBSlides(prev=>prev.filter((_,k)=>k!==i)); setBDirty(true); };
  const saveBanner=async()=>{
    const session=await ensureSession();
    if(!session) throw new Error('Login pemilik diperlukan untuk menyimpan banner.');
    const sec=Math.min(30,Math.max(2,Number(bSec)||3));
    const {error}=await sb.from('shop_settings').upsert({key:'banner',value:{slides:bSlides.map(x=>({src:x.src,type:x.type==='video'?'video':'image'})),intervalSec:sec},updated_at:Date.now()});
    if(error) throw error;
  };
  const handleSave=async()=>{
    if(bBusy) return;
    if(bDirty && bState==='ready'){
      try{ await saveBanner(); setBDirty(false); }
      catch(err){ setBMsg(err.message||'Gagal menyimpan banner'); return; }
    }
    const cleanAccts=accts.map(a=>({cloudName:a.cloudName.trim(),uploadPreset:a.uploadPreset.trim()})).filter(a=>a.cloudName&&a.uploadPreset);
    onSave({...settings,storeName:name,storeIcon:icon,storeAddress:address,storePhone:phone,paperWidth,extraAccounts:cleanAccts});
  };
  const dragRef=useRef(null);
  const ICON_BOX=112, ICON_OUTPUT=256;
  const checkerBg={backgroundImage:'linear-gradient(45deg,#e2e8f0 25%,transparent 25%),linear-gradient(-45deg,#e2e8f0 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e2e8f0 75%),linear-gradient(-45deg,transparent 75%,#e2e8f0 75%)',backgroundSize:'12px 12px',backgroundPosition:'0 0,0 6px,6px -6px,-6px 0',backgroundColor:'#fff'};
  const solidBg={backgroundColor:'#0f172a'};
  const alphaBounds=(img,W,H)=>{
    try{
      const m=Math.min(1,512/Math.max(W,H)), cw=Math.max(1,Math.round(W*m)), ch=Math.max(1,Math.round(H*m));
      const c=document.createElement('canvas'); c.width=cw; c.height=ch;
      const x=c.getContext('2d'); x.drawImage(img,0,0,cw,ch);
      const d=x.getImageData(0,0,cw,ch).data;
      let x0=cw,y0=ch,x1=-1,y1=-1;
      for(let y=0;y<ch;y++)for(let i=0;i<cw;i++){ if(d[(y*cw+i)*4+3]>10){ if(i<x0)x0=i; if(i>x1)x1=i; if(y<y0)y0=y; if(y>y1)y1=y; } }
      if(x1<0) return {x:0,y:0,w:W,h:H};
      return {x:x0/m,y:y0/m,w:(x1-x0+1)/m,h:(y1-y0+1)/m};
    }catch(e){ return {x:0,y:0,w:W,h:H}; }
  };
  const onIconFile=e=>{
    const file=e.target.files?.[0]; e.target.value='';
    if(!file) return;
    const reader=new FileReader();
    reader.onload=()=>{
      const dataUrl=reader.result;
      const probe=new Image();
      probe.onload=()=>{
        const W=probe.naturalWidth||1, H=probe.naturalHeight||1;
        const bb=alphaBounds(probe,W,H);
        const fit=ICON_BOX/Math.max(bb.w,bb.h);
        setFitScale(fit); setZoom(1);
        setPos({x:-((bb.x+bb.w/2)-W/2)*fit,y:-((bb.y+bb.h/2)-H/2)*fit});
        setRawIcon(dataUrl);
      };
      probe.onerror=()=>{ setFitScale(1); setZoom(1); setPos({x:0,y:0}); setRawIcon(dataUrl); };
      probe.src=dataUrl;
    };
    reader.readAsDataURL(file);
  };
  const onDragStart=e=>{ e.currentTarget.setPointerCapture?.(e.pointerId); dragRef.current={startX:e.clientX,startY:e.clientY,origX:pos.x,origY:pos.y}; };
  const onDragMove=e=>{ if(!dragRef.current) return; setPos({x:dragRef.current.origX+(e.clientX-dragRef.current.startX),y:dragRef.current.origY+(e.clientY-dragRef.current.startY)}); };
  const onDragEnd=()=>{ dragRef.current=null; };
  const applyIcon=()=>{
    const img=new Image();
    img.onload=()=>{
      const canvas=document.createElement('canvas');
      canvas.width=ICON_OUTPUT; canvas.height=ICON_OUTPUT;
      const ctx=canvas.getContext('2d');
      const factor=ICON_OUTPUT/ICON_BOX;
      const scale=fitScale*zoom*factor;
      ctx.save();
      ctx.translate(ICON_OUTPUT/2+pos.x*factor, ICON_OUTPUT/2+pos.y*factor);
      ctx.scale(scale,scale);
      ctx.drawImage(img,-img.width/2,-img.height/2);
      ctx.restore();
      // potong margin transparan supaya logo tampil full-tinggi seperti logo R-Shop
      let out=canvas;
      try{
        const b=alphaBounds(canvas,ICON_OUTPUT,ICON_OUTPUT);
        if(b.w>0&&b.h>0&&(b.w<ICON_OUTPUT||b.h<ICON_OUTPUT)){
          const bx=Math.floor(b.x),by=Math.floor(b.y),bw=Math.ceil(b.w),bh=Math.ceil(b.h);
          const c2=document.createElement('canvas'); c2.width=bw; c2.height=bh;
          c2.getContext('2d').drawImage(canvas,bx,by,bw,bh,0,0,bw,bh);
          out=c2;
        }
      }catch(e){}
      setIcon(out.toDataURL('image/png'));
      setRawIcon(null);
    };
    img.src=rawIcon;
  };
  const handleImportFile=async e=>{
    const file=e.target.files?.[0]; e.target.value='';
    if(!file) return;
    setImporting(true);
    try{ await onImportBackup(file); } finally { setImporting(false); }
  };
  return <Modal title="Pengaturan" onClose={onClose}>
    <div className="space-y-5">
      <div>
        <div className="flex items-center justify-between mb-1.5">
          <span className="block text-xs font-bold text-slate-500">Icon / Logo toko</span>
          <button type="button" onClick={()=>setTransparentPreview(v=>!v)} className={`flex items-center gap-1.5 h-6 pl-1 pr-2 rounded-full text-[10px] font-bold transition ${transparentPreview?'bg-indigo-100 text-indigo-700':'bg-slate-800 text-white'}`}>
            <span className={`w-4 h-4 rounded-full transition flex items-center justify-center ${transparentPreview?'bg-indigo-600':'bg-white'}`}><Icon name={transparentPreview?'check':'x'} size={10} className={transparentPreview?'text-white':'text-slate-800'}/></span>
            {transparentPreview?'Preview transparan':'Preview gelap'}
          </button>
        </div>
        {!rawIcon ? <div className="flex items-center gap-3">
          <div className="h-16 min-w-[64px] max-w-[140px] rounded-2xl border border-slate-200 flex items-center justify-center overflow-hidden shrink-0" style={transparentPreview?checkerBg:solidBg}>
            {icon?<img src={icon} className="h-full w-auto object-contain block"/>:<Icon name="shirt" size={24} className={transparentPreview?'text-slate-300':'text-slate-500'}/>}
          </div>
          <div className="flex-1 flex flex-col gap-2">
            <div className="flex gap-2">
              <Button type="button" variant="outline" className="flex-1" onClick={()=>iconRef.current?.click()}><Icon name="upload" size={16}/><span>{icon?'Ganti icon':'Upload icon'}</span></Button>
              {icon && <Button type="button" variant="danger" className="px-3" aria-label="Hapus icon" onClick={()=>setIcon('')}><Icon name="trash" size={16}/></Button>}
            </div>
            <input ref={iconRef} type="file" accept="image/png,image/webp,image/jpeg,image/svg+xml" onChange={onIconFile} className="hidden"/>
            <div className="text-xs text-slate-400 leading-relaxed">PNG transparan direkomendasikan. Tampil di judul aplikasi, sidebar &amp; header.</div>
          </div>
        </div> : <div className="space-y-3 p-3 rounded-2xl border border-slate-200 bg-slate-50">
          <div className="flex gap-3">
            <div className="relative w-28 h-28 rounded-2xl border border-slate-200 overflow-hidden shrink-0 touch-none cursor-move" style={transparentPreview?checkerBg:solidBg} onPointerDown={onDragStart} onPointerMove={onDragMove} onPointerUp={onDragEnd} onPointerLeave={onDragEnd}>
              <img src={rawIcon} draggable={false} className="absolute top-1/2 left-1/2 max-w-none pointer-events-none" style={{transform:`translate(-50%,-50%) translate(${pos.x}px,${pos.y}px) scale(${fitScale*zoom})`}}/>
              <div className="absolute inset-2 rounded-xl border-2 border-dashed border-white/70 pointer-events-none"></div>
            </div>
            <div className="flex-1 flex flex-col justify-center gap-2">
              <span className="text-xs font-bold text-slate-500">Perbesar / perkecil</span>
              <input type="range" min="0.3" max="3" step="0.02" value={zoom} onChange={e=>setZoom(Number(e.target.value))} className="w-full accent-indigo-600"/>
              <div className="text-xs text-slate-400">Seret gambar di kotak untuk atur posisi.</div>
              <button type="button" onClick={()=>{setZoom(1);setPos({x:0,y:0});}} className="text-xs font-bold text-indigo-600 text-left active:scale-95 transition">Reset posisi</button>
            </div>
          </div>
          <div className="flex gap-2">
            <Button type="button" variant="outline" className="flex-1" onClick={()=>setRawIcon(null)}>Batal</Button>
            <Button type="button" className="flex-1" onClick={applyIcon}><Icon name="check" size={16}/><span>Terapkan</span></Button>
          </div>
        </div>}
      </div>
      <Field label="Nama toko" value={name} onChange={e=>setName(e.target.value)}/>
      <Field label="Alamat toko (tampil di struk, opsional)" value={address} onChange={e=>setAddress(e.target.value)}/>
      <Field label="No. telepon (tampil di struk, opsional)" value={phone} onChange={e=>setPhone(e.target.value)}/>
      <label className="block"><span className="block text-xs font-bold text-slate-500 mb-1.5">Lebar kertas printer thermal</span><select value={paperWidth} onChange={e=>setPaperWidth(Number(e.target.value))} className="w-full h-11 px-3 rounded-xl border border-slate-200 bg-white"><option value={80}>80mm (48 kolom)</option><option value={58}>58mm (32 kolom)</option></select></label>
      <div className="rounded-2xl bg-slate-50 p-4 text-sm space-y-1.5">
        <div><b>Penyimpanan utama:</b> IndexedDB di browser/HP ini — tetap jalan tanpa internet.</div>
        <div>Sinkron cloud (2 arah antar HP) sudah dikonfigurasi otomatis di dalam aplikasi ini — tidak perlu diisi manual.</div>
      </div>
      <div className="space-y-3 rounded-2xl border border-slate-200 p-4">
        <div className="font-extrabold text-sm flex items-center gap-2"><Icon name="upload" size={16}/>Akun Cloudinary Cadangan</div>
        <div className="text-xs text-slate-500 leading-relaxed">Upload foto/video memakai akun utama (<b>{syncSettings.cloudName}</b>). Jika akun itu penuh atau dibatasi, upload otomatis pindah ke akun di bawah ini sesuai urutan. Tiap akun butuh <b>Upload Preset</b> bermode <b>Unsigned</b>. Jangan isi API secret. Pengaturan ini tersimpan per perangkat.</div>
        {accts.map((a,i)=><div key={i} className="rounded-xl border border-slate-200 bg-slate-50 p-3 space-y-2">
          <div className="flex items-center justify-between">
            <span className="text-xs font-bold text-slate-500">Cadangan #{i+1}{downMap[a.cloudName.trim()] && Date.now()-downMap[a.cloudName.trim()]<CLOUD_COOLDOWN_MS && <span className="ml-2 px-2 py-0.5 rounded-full bg-amber-100 text-amber-700 text-[10px]">Penuh, dilewati sementara</span>}</span>
            <button type="button" aria-label="Hapus akun" onClick={()=>setAccts(l=>l.filter((_,j)=>j!==i))} className="text-rose-600 active:scale-95 transition"><Icon name="trash" size={16}/></button>
          </div>
          <Field label="Cloud Name" value={a.cloudName} onChange={e=>setAcct(i,'cloudName',e.target.value)} placeholder="contoh: akun2"/>
          <Field label="Upload Preset (unsigned)" value={a.uploadPreset} onChange={e=>setAcct(i,'uploadPreset',e.target.value)} placeholder="contoh: rshop_xxxx"/>
        </div>)}
        <Button type="button" variant="outline" className="w-full" onClick={()=>setAccts(l=>[...l,{cloudName:'',uploadPreset:''}])}><Icon name="plus" size={16}/><span>Tambah akun cadangan</span></Button>
      </div>
      <div className="space-y-3 rounded-2xl border border-slate-200 p-4">
        <div className="font-extrabold text-sm flex items-center gap-2"><Icon name="backup" size={16}/>Backup Manual (File .json)</div>
        <div className="text-xs text-slate-500 leading-relaxed">Cadangan lengkap (produk, penjualan, pengeluaran, stock opname, pengaturan) yang tersimpan sebagai <b>file di HP kamu</b> — tidak bergantung ke Google Sheets/cloud. Simpan filenya di Drive/WhatsApp/email sendiri sebagai jaga-jaga kalau HP hilang atau ganti HP.</div>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
          <Button type="button" variant="outline" className="w-full" onClick={onExportBackup}><Icon name="download" size={17}/><span>Export Backup</span></Button>
          <Button type="button" variant="outline" className="w-full" disabled={importing} onClick={()=>importRef.current?.click()}><Icon name="upload" size={17}/><span>{importing?'Mengimpor…':'Import Backup'}</span></Button>
          <input ref={importRef} type="file" accept="application/json,.json" onChange={handleImportFile} className="hidden"/>
        </div>
      </div>
      <div className="rounded-xl bg-slate-50 text-slate-600 p-3 text-xs leading-relaxed"><b>Sync 2 arah antar HP</b> memakai Supabase. Masuk dengan akun pemilik di layar login; data baru otomatis terkirim dan ditarik saat online.</div>
      <div className="hidden md:block space-y-3 rounded-2xl border border-slate-200 p-4">
        <div className="font-extrabold text-sm flex items-center gap-2"><Icon name="upload" size={16}/>Banner R-Shop</div>
        <div className="text-xs text-slate-500 leading-relaxed">Tampil di slider atas katalog R-Shop. Format PNG, GIF (animasi), JPG, atau WebP (maks. 8 MB), atau video MP4/WebM/MOV (maks. 30 MB, diputar otomatis tanpa suara), sampai 10 banner. Ukuran ideal <b>1890×600 px</b> (rasio 3,15:1). Di HP gambar dipotong ke rasio 1,8:1, jadi taruh bagian penting di tengah. Kosongkan semua untuk memakai banner bawaan.</div>
        {bState==='loading' && <div className="text-xs text-slate-400">Memuat banner…</div>}
        {bState==='error' && <div className="text-xs text-rose-600 leading-relaxed">{bMsg}</div>}
        {bState==='ready' && <>
          {bSlides.length>0 && <div className="grid grid-cols-2 gap-2">
            {bSlides.map((x,i)=><div key={x.src+i} className="rounded-xl border border-slate-200 overflow-hidden bg-slate-50">
              {x.type==='video'?<video src={x.src} muted loop playsInline autoPlay className="w-full object-cover" style={{aspectRatio:'3.15/1'}}/>:<img src={x.src} className="w-full object-cover" style={{aspectRatio:'3.15/1'}}/>}
              <div className="flex items-center justify-between px-2 py-1.5 text-xs">
                <span className="font-bold text-slate-500">#{i+1}</span>
                <div className="flex gap-1">
                  <button type="button" disabled={i===0} onClick={()=>moveB(i,-1)} aria-label="Geser ke kiri" className="px-2 py-1 rounded-lg hover:bg-slate-200 disabled:opacity-30">←</button>
                  <button type="button" disabled={i===bSlides.length-1} onClick={()=>moveB(i,1)} aria-label="Geser ke kanan" className="px-2 py-1 rounded-lg hover:bg-slate-200 disabled:opacity-30">→</button>
                  <button type="button" onClick={()=>removeB(i)} aria-label="Hapus banner" className="px-2 py-1 rounded-lg text-rose-600 hover:bg-rose-50"><Icon name="trash" size={14}/></button>
                </div>
              </div>
            </div>)}
          </div>}
          <Button type="button" variant="outline" className="w-full" disabled={bBusy||bSlides.length>=10} onClick={()=>bannerRef.current?.click()}><Icon name="upload" size={16}/><span>{bBusy?'Mengunggah…':'Tambah banner'}</span></Button>
          <input ref={bannerRef} type="file" multiple accept="image/png,image/gif,image/jpeg,image/webp,video/mp4,video/webm,video/quicktime" onChange={onBannerFiles} className="hidden"/>
          <label className="block"><span className="block text-xs font-bold text-slate-500 mb-1.5">Waktu pergantian slide (detik, 2–30)</span><input type="number" min="2" max="30" step="0.5" value={bSec} onChange={e=>{setBSec(e.target.value);setBDirty(true);}} className="w-full h-11 px-3 rounded-xl border border-slate-200 bg-white outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"/></label>
          {bMsg && <div className="text-xs text-rose-600 leading-relaxed">{bMsg}</div>}
          {bDirty && <div className="text-xs text-amber-600">Ada perubahan banner. Klik Simpan di bawah untuk menerapkannya ke R-Shop.</div>}
        </>}
      </div>
      <Button className="w-full" disabled={bBusy} onClick={handleSave}>Simpan</Button>
    </div>
  </Modal>
}

// ====== KARYAWAN (R-Staff): atur stock barang per karyawan — hanya tampil di desktop ======
const STAFF_ERR={duplicate:'Nama karyawan sudah ada.',bad_name:'Nama minimal 2 karakter.',bad_pin:'PIN harus 6 digit angka.',not_found:'Karyawan tidak ditemukan.',bad_ids:'Daftar barang tidak valid.'};
function StaffPage({products,cloud,setToast}){
  const [data,setData]=useState(null);
  const [err,setErr]=useState('');
  const [busy,setBusy]=useState(false);
  const [sub,setSub]=useState(null); // {type:'detail'|'assign'|'add'|'pin', key}
  const rpc=useCallback(async(fn,args)=>{
    const {data:d,error}=await sb.rpc(fn,args||{});
    if(error) throw new Error(error.message||'Gagal');
    if(d&&d.ok===false) throw Object.assign(new Error(STAFF_ERR[d.error]||d.error||'Gagal'),{code:d.error});
    return d;
  },[]);
  const refresh=useCallback(async()=>{
    if(!sb||!cloud) return;
    setBusy(true);
    try{ setData(await rpc('admin_staff_overview')); setErr(''); }
    catch(e){ setErr(/schema cache|does not exist|PGRST202/i.test(e.message)?'Fungsi database belum ada. Jalankan staff_assign_-_Opsional.sql di Supabase → SQL Editor, lalu muat ulang.':e.message); }
    setBusy(false);
  },[cloud,rpc]);
  useEffect(()=>{ refresh(); },[refresh]);

  const pmap=useMemo(()=>new Map(products.map(p=>[p.id,p])),[products]);
  const owner=useMemo(()=>new Map((data?data.assigns:[]).map(a=>[a.pid,a.name||a.key])),[data]);
  const rows=useMemo(()=>{
    if(!data) return [];
    const by=new Map();
    data.staff.forEach(s=>by.set(s.key,{...s,items:[]}));
    data.assigns.forEach(a=>{
      let r=by.get(a.key);
      if(!r){ r={id:null,name:a.name||a.key,key:a.key,active:true,hasPin:false,items:[]}; by.set(a.key,r); }
      r.items.push({pid:a.pid,p:pmap.get(a.pid)});
    });
    return [...by.values()].map(r=>{
      const carry=r.items.filter(x=>x.p&&x.p.status!=='sold'&&!x.p.lost);
      const sold=r.items.filter(x=>x.p&&x.p.status==='sold');
      return {...r,carry,sold,value:carry.reduce((s,x)=>s+(Number(x.p.price)||0),0)};
    }).sort((a,b)=>a.name.localeCompare(b.name));
  },[data,pmap]);
  const totalCarry=rows.reduce((s,r)=>s+r.carry.length,0);
  const freeCount=useMemo(()=>products.filter(p=>p.status!=='sold'&&!p.lost&&!owner.has(p.id)).length,[products,owner]);

  const act=async(fn,args,msg)=>{
    setBusy(true);
    try{ await rpc(fn,args); if(msg) setToast(msg); setSub(null); await refresh(); return true; }
    catch(e){ setToast(e.message); setBusy(false); return false; }
  };
  const saveAssign=async(row,ids)=>{
    setBusy(true);
    try{
      for(let i=0;i<ids.length;i+=400) await rpc('admin_staff_assign',{p_name:row.name,p_ids:ids.slice(i,i+400)});
      setToast(`${ids.length} barang dialokasikan ke ${row.name}`); setSub(null); await refresh();
    }catch(e){ setToast(e.message); setBusy(false); }
  };
  const unassign=(ids,msg)=>act('admin_staff_unassign',{p_ids:ids},msg);
  const cur=sub&&sub.key?rows.find(r=>r.key===sub.key):null;

  if(!cloud) return <div className="space-y-4"><h1 className="text-2xl font-black">Karyawan</h1><div className="bg-white rounded-3xl border border-slate-100 shadow-soft p-8"><Empty text="Menu ini butuh akun sinkron. Masuk dengan akun Supabase dulu."/></div></div>;

  return <div className="space-y-5">
    <div className="flex justify-between items-center gap-3">
      <div><h1 className="text-2xl font-black">Karyawan</h1><p className="text-sm text-slate-500">Atur stock barang yang dibawa tiap karyawan R-Staff.</p></div>
      <div className="flex gap-2">
        <Button variant="outline" onClick={refresh} disabled={busy} aria-label="Muat ulang"><Icon name="refresh" size={17} className={busy?'animate-spin':''}/><span>Muat Ulang</span></Button>
        <Button onClick={()=>setSub({type:'add'})}><Icon name="plus" size={18}/><span>Tambah Karyawan</span></Button>
      </div>
    </div>

    {err&&<div className="bg-amber-50 text-amber-800 text-sm font-semibold px-4 py-3 rounded-2xl">⚠ {err}</div>}

    {data&&<>
      <div className="grid grid-cols-3 gap-3">
        <Kpi title="Karyawan aktif" value={rows.filter(r=>r.active).length} count/>
        <Kpi title="Total pcs dibawa" value={totalCarry} count/>
        <Kpi title="Stok belum dialokasikan" value={freeCount} count/>
      </div>

      <div className="bg-white rounded-3xl border border-slate-100 shadow-soft p-5 flex items-center gap-4">
        <div className="flex-1 min-w-0">
          <b className="block text-sm">Batasi katalog R-Staff sesuai stock karyawan</b>
          <p className="text-xs text-slate-500 mt-0.5">{data.restrict?'Aktif: karyawan hanya melihat & bisa menjual barang stock-nya sendiri. Karyawan tanpa stock melihat katalog kosong.':'Mati: semua karyawan melihat seluruh stok aktif (stock karyawan hanya sebagai catatan).'}</p>
        </div>
        <button type="button" role="switch" aria-checked={!!data.restrict} disabled={busy} onClick={()=>act('admin_staff_set_restrict',{p_on:!data.restrict},data.restrict?'Pembatasan dimatikan':'Katalog R-Staff kini sesuai stock karyawan')} className={`relative w-12 h-7 rounded-full transition shrink-0 ${data.restrict?'bg-indigo-600':'bg-slate-300'}`}><span className={`absolute top-1 w-5 h-5 rounded-full bg-white shadow transition-all ${data.restrict?'left-6':'left-1'}`}/></button>
      </div>

      {!rows.length?<div className="bg-white rounded-3xl border border-slate-100 shadow-soft p-8"><Empty text="Belum ada karyawan. Klik Tambah Karyawan."/></div>:
      <div className="grid lg:grid-cols-2 xl:grid-cols-3 gap-4">
        {rows.map(r=><div key={r.key} className={`bg-white rounded-3xl border shadow-soft p-5 flex flex-col gap-4 ${r.active?'border-slate-100':'border-slate-100 opacity-60'}`}>
          <div className="flex items-center gap-3">
            <div className="w-11 h-11 rounded-2xl bg-indigo-50 text-indigo-600 font-black text-lg flex items-center justify-center shrink-0">{String(r.name||'?').trim().slice(0,1).toUpperCase()}</div>
            <div className="min-w-0 flex-1"><b className="block truncate">{r.name}</b><span className="text-[11px] text-slate-400">{r.id?(r.hasPin?'Pakai PIN':'Tanpa PIN'):'Belum terdaftar di daftar karyawan'}</span></div>
            {!r.active&&<span className="px-2 py-0.5 rounded-full text-[10px] font-extrabold bg-slate-100 text-slate-500 shrink-0">NONAKTIF</span>}
          </div>
          <div className="flex items-end justify-between gap-3">
            <div><div className="text-3xl font-black leading-none">{r.carry.length}<span className="text-base font-bold text-slate-400"> pcs</span></div><div className="text-xs text-slate-500 mt-1">dibawa • nilai {money(r.value)}</div></div>
            <div className="text-right text-xs text-slate-500"><b className="block text-emerald-600 text-base">{r.sold.length}</b>terjual</div>
          </div>
          <div className="flex gap-1.5 min-h-[40px]">{r.carry.slice(0,6).map(x=>x.p.image?<Thumb key={x.pid} src={x.p.image} max={160} className="w-10 h-10 rounded-lg object-cover"/>:<div key={x.pid} className="w-10 h-10 rounded-lg bg-slate-100 flex items-center justify-center text-slate-400"><Icon name="shirt" size={16}/></div>)}{r.carry.length>6&&<div className="w-10 h-10 rounded-lg bg-slate-50 text-slate-500 text-xs font-bold flex items-center justify-center">+{r.carry.length-6}</div>}</div>
          <div className="grid grid-cols-2 gap-2">
            <Button variant="outline" onClick={()=>setSub({type:'detail',key:r.key})}><Icon name="box" size={16}/><span>Detail</span></Button>
            <Button onClick={()=>setSub({type:'assign',key:r.key})} disabled={!r.active}><Icon name="plus" size={16}/><span>Atur Stock</span></Button>
          </div>
          <div className="flex items-center justify-between text-xs font-bold text-slate-400 border-t border-slate-100 pt-3">
            {r.id?<><button type="button" onClick={()=>setSub({type:'pin',key:r.key})} className="hover:text-slate-700">Ganti PIN</button>
            <button type="button" onClick={()=>act('admin_staff_set_active',{p_name:r.name,p_active:!r.active},r.active?`${r.name} dinonaktifkan`:`${r.name} diaktifkan`)} className="hover:text-slate-700">{r.active?'Nonaktifkan':'Aktifkan'}</button></>:<span/>}
            <button type="button" onClick={()=>{ if(confirm(`Hapus ${r.name}? Semua stock-nya dilepas. Riwayat penjualan tetap aman.`)) act('admin_staff_delete',{p_name:r.name},`${r.name} dihapus`); }} className="hover:text-red-600">Hapus</button>
          </div>
        </div>)}
      </div>}
    </>}

    {sub&&sub.type==='add'&&<StaffFormModal mode="add" busy={busy} requirePin={data&&data.requirePin} onClose={()=>setSub(null)} onSave={(name,pin)=>act('admin_staff_add',{p_name:name,p_pin:pin||null},`${name} ditambahkan`)}/>}
    {cur&&sub.type==='pin'&&<StaffFormModal mode="pin" name={cur.name} busy={busy} onClose={()=>setSub(null)} onSave={(name,pin)=>act('admin_staff_set_pin',{p_name:cur.name,p_pin:pin},'PIN diganti')}/>}
    {cur&&sub.type==='detail'&&<StaffDetailModal row={cur} busy={busy} onClose={()=>setSub(null)} onAssign={()=>setSub({type:'assign',key:cur.key})} onRemove={ids=>unassign(ids,`${ids.length} barang dilepas dari ${cur.name}`).then(()=>setSub({type:'detail',key:cur.key}))}/>}
    {cur&&sub.type==='assign'&&<StaffAssignModal row={cur} products={products} owner={owner} busy={busy} onClose={()=>setSub(null)} onSave={ids=>saveAssign(cur,ids)}/>}
  </div>
}

function StaffFormModal({mode,name:fixed,busy,requirePin,onSave,onClose}){
  const [name,setName]=useState(fixed||'');
  const [pin,setPin]=useState('');
  const isPin=mode==='pin';
  const pinOk=isPin?/^\d{6}$/.test(pin):(pin===''||/^\d{6}$/.test(pin));
  const nameOk=isPin||name.trim().length>=2;
  return <Modal title={isPin?`Ganti PIN — ${fixed}`:'Tambah Karyawan'} onClose={onClose}>
    <div className="space-y-4">
      {!isPin&&<Field label="Nama karyawan" value={name} onChange={e=>setName(e.target.value)} placeholder="mis. Ucing" maxLength={40} autoFocus/>}
      <Field label={isPin?'PIN baru (6 digit)':`PIN 6 digit ${requirePin?'(wajib, mode PIN aktif)':'(opsional)'}`} value={pin} onChange={e=>setPin(e.target.value.replace(/\D/g,'').slice(0,6))} inputMode="numeric" placeholder="••••••" autoComplete="off"/>
      {!isPin&&<p className="text-xs text-slate-500">Saat mode PIN mati (REQUIRE_PIN = false di R-Staff), karyawan cukup mengetik nama ini untuk masuk. Tulis sama persis (huruf besar/kecil tidak dibedakan).</p>}
      <Button className="w-full" disabled={busy||!nameOk||!pinOk||(!isPin&&requirePin&&!pin)} onClick={()=>onSave(name.trim(),pin)}><Icon name="check" size={18}/><span>Simpan</span></Button>
    </div>
  </Modal>
}

function StaffDetailModal({row,busy,onClose,onAssign,onRemove}){
  const [tab,setTab]=useState('carry');
  const list=(tab==='carry'?row.carry:row.sold).slice(0,300);
  return <Modal title={`${row.name} — ${row.carry.length} pcs`} onClose={onClose} wide>
    <div className="space-y-4">
      <div className="flex items-center gap-2">
        <div className="inline-flex p-1 rounded-xl bg-slate-100">
          {[['carry',`Dibawa (${row.carry.length})`],['sold',`Terjual (${row.sold.length})`]].map(([id,l])=><button key={id} type="button" onClick={()=>setTab(id)} className={`h-9 px-4 rounded-lg text-sm font-bold transition ${tab===id?'bg-white shadow-sm text-slate-900':'text-slate-500'}`}>{l}</button>)}
        </div>
        <div className="flex-1"/>
        {tab==='carry'&&row.carry.length>0&&<Button variant="danger" disabled={busy} onClick={()=>{ if(confirm(`Lepas semua ${row.carry.length} barang dari ${row.name}?`)) onRemove(row.carry.map(x=>x.pid)); }}>Lepas Semua</Button>}
        {tab==='carry'&&<Button onClick={onAssign}><Icon name="plus" size={16}/><span>Tambah</span></Button>}
      </div>
      <div className="border border-slate-100 rounded-2xl overflow-hidden">
        {list.map(x=><div key={x.pid} className="flex items-center gap-3 p-3 border-b last:border-0 border-slate-100">
          {x.p.image?<Thumb src={x.p.image} max={200} className="w-12 h-12 rounded-xl object-cover shrink-0"/>:<div className="w-12 h-12 rounded-xl bg-slate-100 flex items-center justify-center shrink-0"><Icon name="shirt"/></div>}
          <div className="min-w-0 flex-1"><b className="text-sm block truncate">{x.p.name}</b><div className="text-xs text-slate-400 truncate">{[x.p.sku,x.p.size,x.p.color].filter(Boolean).join(' • ')}</div></div>
          <b className="shrink-0 text-sm">{money(x.p.price)}</b>
          {tab==='carry'?<button type="button" disabled={busy} onClick={()=>onRemove([x.pid])} aria-label="Lepas dari karyawan" title="Lepas dari karyawan" className="p-2 text-red-500 shrink-0 active:scale-95 transition"><Icon name="x" size={17}/></button>:<span className="px-2 py-0.5 rounded-full text-[10px] font-extrabold bg-emerald-50 text-emerald-700 shrink-0">TERJUAL</span>}
        </div>)}
        {!list.length&&<Empty text={tab==='carry'?'Belum membawa barang. Klik Tambah untuk mengalokasikan.':'Belum ada barang stock-nya yang terjual.'}/>}
      </div>
    </div>
  </Modal>
}

function StaffAssignModal({row,products,owner,busy,onClose,onSave}){
  const [q,setQ]=useState('');
  const dq=useDeferredValue(q);
  const [sel,setSel]=useState(()=>new Set());
  const [n,setN]=useState(10);
  const [scanning,setScanning]=useState(false);
  const mine=useMemo(()=>new Set(row.items.map(x=>x.pid)),[row]);
  const pool=useMemo(()=>products.filter(p=>p.status!=='sold'&&!p.lost&&!mine.has(p.id)).sort((a,b)=>(Number(b.createdAt)||0)-(Number(a.createdAt)||0)),[products,mine]);
  const free=useMemo(()=>pool.filter(p=>!owner.has(p.id)),[pool,owner]);
  const shown=useMemo(()=>{
    const s=dq.trim().toLowerCase();
    const l=s?pool.filter(p=>(p.name||'').toLowerCase().includes(s)||(p.sku||'').toLowerCase().includes(s)):pool;
    return l.slice(0,80);
  },[pool,dq]);
  const toggle=id=>setSel(prev=>{ const nx=new Set(prev); if(nx.has(id)) nx.delete(id); else nx.add(id); return nx; });
  const auto=()=>{
    const k=Math.max(0,Math.min(500,Number(n)||0));
    setSel(prev=>{ const nx=new Set(prev); let c=0; for(const p of free){ if(c>=k) break; if(!nx.has(p.id)){ nx.add(p.id); c++; } } return nx; });
  };
  const addScanned=list=>{ setSel(prev=>{ const nx=new Set(prev); list.forEach(p=>nx.add(p.id)); return nx; }); setScanning(false); };
  return <>
  <Modal title={`Atur Stock — ${row.name}`} onClose={onClose} wide>
    <div className="space-y-4">
      <div className="rounded-2xl bg-indigo-50/60 border border-indigo-100 p-4 space-y-2">
        <div className="text-xs font-extrabold text-indigo-700">PILIH OTOMATIS</div>
        <div className="flex items-center gap-2">
          <input type="number" min="1" max="500" value={n} onChange={e=>setN(e.target.value)} className="w-24 h-11 px-3 rounded-xl border border-slate-200 bg-white text-center font-bold"/>
          <span className="text-sm text-slate-600">pcs stok terbaru yang belum dialokasikan</span>
          <Button variant="outline" className="ml-auto" onClick={auto} disabled={!free.length}>Pilih</Button>
        </div>
        <div className="text-[11px] text-slate-500">Tersedia {free.length} pcs belum dialokasikan. Saat ini {row.name} membawa {row.carry.length} pcs.</div>
      </div>
      <div className="flex gap-2">
        <div className="relative flex-1 min-w-0"><Icon name="search" size={18} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"/><input value={q} onChange={e=>setQ(e.target.value)} placeholder="Cari nama / SKU untuk pilih manual…" className="w-full h-11 pl-10 pr-4 rounded-xl border border-slate-200 bg-white"/></div>
        <Button variant="soft" className="shrink-0" onClick={()=>{unlockAudio();setScanning(true)}}><Icon name="scan" size={18}/><span>Scan Barcode</span></Button>
      </div>
      <div className="border border-slate-100 rounded-2xl overflow-hidden max-h-[40vh] overflow-y-auto">
        {shown.map(p=>{ const on=sel.has(p.id); const own=owner.get(p.id);
          return <button type="button" key={p.id} onClick={()=>toggle(p.id)} className={`w-full flex items-center gap-3 p-3 text-left border-b last:border-0 border-slate-100 ${on?'bg-indigo-50':'hover:bg-slate-50'}`}>
            <span className={`w-5 h-5 rounded-md border flex items-center justify-center shrink-0 ${on?'bg-indigo-600 border-indigo-600 text-white':'border-slate-300 bg-white'}`}>{on&&<Icon name="check" size={13} stroke={3}/>}</span>
            {p.image?<Thumb src={p.image} max={160} className="w-10 h-10 rounded-lg object-cover shrink-0"/>:<div className="w-10 h-10 rounded-lg bg-slate-100 flex items-center justify-center shrink-0"><Icon name="shirt" size={16}/></div>}
            <span className="min-w-0 flex-1"><b className="block text-sm truncate">{p.name}</b><small className="block text-slate-400 truncate">{p.sku}</small></span>
            {own&&<span className="px-2 py-0.5 rounded-full text-[10px] font-extrabold bg-amber-50 text-amber-700 shrink-0">MILIK {String(own).toUpperCase()}</span>}
            <b className="shrink-0 text-sm">{money(p.price)}</b>
          </button>; })}
        {!shown.length&&<Empty text="Tidak ada barang yang cocok."/>}
      </div>
      {pool.length>80&&!dq.trim()&&<div className="text-[11px] text-slate-400 -mt-2">Menampilkan 80 terbaru dari {pool.length}. Cari untuk menemukan yang lain.</div>}
      <div className="flex items-center gap-3">
        <div className="text-sm text-slate-600 flex-1"><b>{sel.size}</b> barang dipilih{sel.size>0&&<button type="button" onClick={()=>setSel(new Set())} className="ml-2 text-xs font-bold text-slate-400 hover:text-slate-700">Kosongkan</button>}</div>
        <Button disabled={busy||!sel.size} onClick={()=>onSave([...sel])}><Icon name="check" size={18}/><span>Simpan Stock ({sel.size} pcs)</span></Button>
      </div>
    </div>
  </Modal>
  {scanning&&<ScannerModal title={`Scan Stock — ${row.name}`} finishLabel="Tambahkan ke Stock" finishIcon="check" products={pool.filter(p=>!sel.has(p.id))} onClose={()=>setScanning(false)} onFound={addScanned}/>}
  </>
}

// Bungkus halaman berat dengan React.memo: tidak ikut render ulang saat toast/modal berubah (props di App sudah stabil).
const MemoDashboard=React.memo(Dashboard);
const MemoSales=React.memo(Sales);
const MemoFinance=React.memo(Finance);

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
