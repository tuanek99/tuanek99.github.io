<body>
<div id="root"></div>

<script type="text/babel">
const {useEffect, useMemo, useRef, useState} = React;

const DB_NAME = 'r-preloved-db';
const DB_VERSION = 1;
const STORES = ['products','sales','expenses','settings','stocktakes'];

// PENTING: koneksi IndexedDB dibuat SEKALI dan dipakai ulang (singleton),
// bukan dibuka baru setiap kali baca/tulis/hapus. Membuka banyak koneksi
// paralel (mis. saat reload() memanggil 5 store sekaligus) adalah penyebab
// utama IndexedDB gagal/blocked secara acak di perangkat mobile/WebView,
// yang tadinya membuat SELURUH data kelihatan hilang saat menghapus 1 produk.
let dbPromise = null;
function getDB(){
  if(dbPromise) return dbPromise;
  dbPromise = new Promise((resolve,reject)=>{
    if(!window.indexedDB){ reject(new Error('IndexedDB tidak didukung browser ini')); return; }
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      STORES.forEach(s => {
        if(!db.objectStoreNames.contains(s)) db.createObjectStore(s,{keyPath:'id',autoIncrement:true});
      });
    };
    req.onblocked = () => console.warn('R-Preloved: IndexedDB blocked (kemungkinan ada tab lain terbuka).');
    req.onsuccess = () => {
      const db = req.result;
      db.onversionchange = () => { db.close(); dbPromise = null; };
      db.onclose = () => { dbPromise = null; };
      resolve(db);
    };
    req.onerror = () => reject(req.error || new Error('IndexedDB unavailable'));
  });
  // Kalau gagal dibuka, jangan simpan promise yang reject selamanya —
  // izinkan percobaan lagi di panggilan berikutnya.
  dbPromise.catch(()=>{ dbPromise = null; });
  return dbPromise;
}
let idbSupported = true; // hanya jadi false kalau IndexedDB memang benar-benar tidak ada
const memStore = {products:[],sales:[],expenses:[],stocktakes:[],settings:[]};
async function idbOp(fn){
  const db = await getDB();
  return await fn(db);
}
async function dbAll(store){
  try{
    const rows = await idbOp(db=>new Promise((resolve,reject)=>{
      const tx=db.transaction(store,'readonly'), req=tx.objectStore(store).getAll();
      req.onsuccess=()=>resolve(req.result||[]);
      req.onerror=()=>reject(req.error);
    }));
    idbSupported = true;
    return rows;
  }catch(err){
    console.warn('R-Preloved: gagal membaca dari IndexedDB, memakai penyimpanan sementara.', err);
    idbSupported = false;
    return memStore[store]||(memStore[store]=[]);
  }
}
async function dbPut(store, value){
  const record = {...value, id: value.id||uid()};
  try{
    await idbOp(db=>new Promise((resolve,reject)=>{
      const tx=db.transaction(store,'readwrite'), req=tx.objectStore(store).put(record);
      req.onsuccess=()=>resolve(req.result); req.onerror=()=>reject(req.error);
    }));
    idbSupported = true;
    return record.id;
  }catch(err){
    console.warn('R-Preloved: gagal menyimpan ke IndexedDB, memakai penyimpanan sementara.', err);
    idbSupported = false;
    const list=memStore[store]||(memStore[store]=[]);
    const idx=list.findIndex(x=>x.id===record.id);
    if(idx>=0) list[idx]=record; else list.push(record);
    return record.id;
  }
}
async function dbDelete(store,id){
  try{
    await idbOp(db=>new Promise((resolve,reject)=>{
      const tx=db.transaction(store,'readwrite'), req=tx.objectStore(store).delete(id);
      req.onsuccess=()=>resolve(); req.onerror=()=>reject(req.error);
    }));
    idbSupported = true;
  }catch(err){
    console.warn('R-Preloved: gagal menghapus di IndexedDB, memakai penyimpanan sementara.', err);
    idbSupported = false;
    const list=memStore[store]||(memStore[store]=[]);
    const idx=list.findIndex(x=>x.id===id);
    if(idx>=0) list.splice(idx,1);
  }
}
async function dbClear(store){
  try{
    await idbOp(db=>new Promise((resolve,reject)=>{
      const tx=db.transaction(store,'readwrite'), req=tx.objectStore(store).clear();
      req.onsuccess=()=>resolve(); req.onerror=()=>reject(req.error);
    }));
  }catch(err){
    memStore[store]=[];
  }
}
const money = n => new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0);
const dateText = d => new Intl.DateTimeFormat('id-ID',{dateStyle:'medium',timeStyle:'short'}).format(new Date(d));
let uidSeq = 0;
const uid = () => Date.now()*1000 + (uidSeq++ % 1000);
const parseNum = s => Number(String(s).replace(/[^\d]/g,''))||0;
const formatThousand = n => (n===''||n===null||n===undefined) ? '' : new Intl.NumberFormat('id-ID').format(n);
let sharedAudioCtx = null;
function unlockAudio(){
  try{
    const Ctx = window.AudioContext||window.webkitAudioContext;
    if(!Ctx) return;
    if(!sharedAudioCtx) sharedAudioCtx = new Ctx();
    if(sharedAudioCtx.state==='suspended') sharedAudioCtx.resume();
  }catch(e){}
}
function beep(kind='success'){
  try{
    const Ctx = window.AudioContext||window.webkitAudioContext;
    if(!Ctx) return;
    if(!sharedAudioCtx) sharedAudioCtx = new Ctx();
    const ctx = sharedAudioCtx;
    if(ctx.state==='suspended') ctx.resume();
    const now = ctx.currentTime;
    const tone=(freq,start,dur,type='sine',vol=0.22)=>{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type=type; o.frequency.setValueAtTime(freq, now+start);
      g.gain.setValueAtTime(vol, now+start);
      g.gain.exponentialRampToValueAtTime(0.001, now+start+dur);
      o.connect(g); g.connect(ctx.destination);
      o.start(now+start); o.stop(now+start+dur+0.02);
    };
    if(kind==='success'){
      tone(1568, 0, 0.09, 'sine', 0.22); // "nit" pendek nada tinggi
    }else{
      tone(220, 0, 0.11, 'square', 0.18); // dua nada rendah untuk gagal/tidak ditemukan
      tone(220, 0.14, 0.11, 'square', 0.18);
    }
  }catch(e){}
}
const imgData = file => new Promise((resolve,reject)=>{
  if(!file) return resolve(null);
  const r=new FileReader(); r.onload=()=>resolve(r.result); r.onerror=reject; r.readAsDataURL(file);
});

function Icon({name,size=20,stroke=2,className=''}){
  const paths={
    grid:<><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></>,
    shirt:<><path d="M8 5 5 3 2 7l4 3v10h12V10l4-3-3-4-3 2a6 6 0 0 1-8 0Z"/></>,
    cart:<><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/><path d="M3 4h2l2.4 11.3a2 2 0 0 0 2 1.6h8.7a2 2 0 0 0 2-1.5L21 8H7"/></>,
    wallet:<><path d="M4 6a2 2 0 0 1 2-2h13v4H6a2 2 0 0 0 0 4h15v8H6a2 2 0 0 1-2-2Z"/><path d="M17 14h4"/></>,
    scan:<><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 8v8M10 8v8M13 8v8M16 8v8"/></>,
    camera:<><path d="M3 8a2 2 0 0 1 2-2h3l1.5-2h5L16 6h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><circle cx="12" cy="12.5" r="3.5"/></>,
    plus:<><path d="M12 5v14M5 12h14"/></>,
    search:<><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></>,
    x:<><path d="m6 6 12 12M18 6 6 18"/></>,
    check:<path d="m5 12 4 4L19 6"/>,
    trash:<><path d="M4 7h16M10 11v6M14 11v6"/><path d="M6 7l1 14h10l1-14M9 7V4h6v3"/></>,
    edit:<><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></>,
    receipt:<><path d="M5 3h14v18l-3-2-4 2-4-2-3 2Z"/><path d="M8 8h8M8 12h8M8 16h5"/></>,
    trend:<><path d="m3 17 6-6 4 4 8-9"/><path d="M15 6h6v6"/></>,
    box:<><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 8 9 5 9-5M3 8v8l9 5 9-5V8"/></>,
    settings:<><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-1.8 1.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5v.2h-2.6v-.2a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1-1.8-1.8.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H6.3v-2.6h.2a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1 1.8-1.8.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.5v-.2H15v.2a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1 1.8 1.8-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.5 1h.2v2.6h-.2a1.7 1.7 0 0 0-1.5 1Z"/></>,
    menu:<><path d="M4 6h16M4 12h16M4 18h16"/></>,
    download:<><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></>,
    upload:<><path d="M12 21V9M7 14l5-5 5 5M5 3h14"/></>,
    calendar:<><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 9h18"/></>
  };
  return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={stroke} strokeLinecap="round" strokeLinejoin="round" className={`shrink-0 ${className}`}>{paths[name]}</svg>
}

function Button({children,variant='primary',className='',...p}){
  const c={primary:'bg-slate-900 text-white hover:bg-slate-800',soft:'bg-slate-100 text-slate-800 hover:bg-slate-200',outline:'border border-slate-200 bg-white hover:bg-slate-50 text-slate-800',danger:'bg-red-50 text-red-600 hover:bg-red-100',green:'bg-emerald-600 text-white hover:bg-emerald-700'}[variant];
  return <button {...p} className={`inline-flex items-center justify-center gap-2 whitespace-nowrap min-h-[42px] px-4 rounded-xl font-semibold text-sm transition active:scale-[.98] disabled:opacity-50 disabled:pointer-events-none ${c} ${className}`}>{children}</button>
}
function Field({label,...p}){return <label className="block"><span className="block text-xs font-bold text-slate-500 mb-1.5">{label}</span><input {...p} className={`w-full h-11 px-3 rounded-xl border border-slate-200 bg-white outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 ${p.className||''}`}/></label>}
function NumberField({label,value,onChange,placeholder,required,prefix}){
  return <label className="block">
    <span className="block text-xs font-bold text-slate-500 mb-1.5">{label}</span>
    <div className="relative">
      {prefix&&<span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm">{prefix}</span>}
      <input type="text" inputMode="numeric" value={formatThousand(value)} onChange={e=>onChange(parseNum(e.target.value))} placeholder={placeholder} required={required} className={`w-full h-11 px-3 rounded-xl border border-slate-200 bg-white outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 ${prefix?'pl-8':''}`}/>
    </div>
  </label>
}
function SearchInput({className='',...p}){
  return <div className="relative">
    <Icon name="search" size={18} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"/>
    <input {...p} className={`w-full h-11 pl-10 pr-3 rounded-xl border border-slate-200 bg-white outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 ${className}`}/>
  </div>
}
function Modal({title,onClose,children,wide=false}){
  return <div className="fixed inset-0 z-50 bg-slate-950/50 backdrop-blur-sm flex items-end md:items-center justify-center p-0 md:p-6">
    <div className={`w-full ${wide?'max-w-3xl':'max-w-lg'} max-h-[94vh] overflow-auto bg-white rounded-t-3xl md:rounded-3xl shadow-2xl fade-in`}>
      <div className="sticky top-0 z-10 bg-white/95 backdrop-blur px-5 py-4 border-b border-slate-100 flex items-center justify-between">
        <h2 className="font-extrabold text-lg truncate pr-3">{title}</h2><button onClick={onClose} aria-label="Tutup" className="p-2 rounded-full hover:bg-slate-100 active:scale-95 transition shrink-0"><Icon name="x"/></button>
      </div>
      <div className="p-5">{children}</div>
    </div>
  </div>
}

function App(){
  const [tab,setTab]=useState('dashboard');
  const [products,setProducts]=useState([]);
  const [sales,setSales]=useState([]);
  const [expenses,setExpenses]=useState([]);
  const [stocktakes,setStocktakes]=useState([]);
  const [settings,setSettings]=useState({storeName:'R-Preloved'});
  const [loading,setLoading]=useState(true);
  const [modal,setModal]=useState(null);
  const [toast,setToast]=useState('');
  const [search,setSearch]=useState('');

  const reload=async(initial=false)=>{
    try{
      const [p,s,e,st,set]=await Promise.all([
        dbAll('products'),dbAll('sales'),dbAll('expenses'),dbAll('stocktakes'),dbAll('settings')
      ]);
      setProducts(Array.isArray(p)?p:[]);
      setSales(Array.isArray(s)?s:[]);
      setExpenses(Array.isArray(e)?e:[]);
      setStocktakes(Array.isArray(st)?st:[]);
      if(Array.isArray(set) && set[0]) setSettings(set[0]);
      if(!idbSupported) setToast('Penyimpanan permanen tidak tersedia di sini — data hanya tersimpan sementara selama sesi ini.');
    }catch(err){
      console.error('R-Preloved storage error:',err);
      // Jangan hapus data yang sudah tampil di layar hanya karena satu kali baca gagal —
      // biarkan tampilan lama tetap ada, cukup beri tahu lewat toast.
      setToast('Gagal memuat data terbaru. Data lama tetap ditampilkan.');
    }finally{
      setLoading(false);
    }
  };
  useEffect(()=>{reload(true)},[]);
  useEffect(()=>{
    const unlock=()=>{unlockAudio()};
    document.addEventListener('click',unlock,{once:true});
    document.addEventListener('touchstart',unlock,{once:true});
    return ()=>{document.removeEventListener('click',unlock);document.removeEventListener('touchstart',unlock);};
  },[]);
  useEffect(()=>{if(toast){const t=setTimeout(()=>setToast(''),2600);return()=>clearTimeout(t)}},[toast]);

  const stats=useMemo(()=>{
    const sold=sales.reduce((a,s)=>a+s.total,0);
    const cogs=sales.reduce((a,s)=>a+s.costTotal,0);
    const exp=expenses.reduce((a,e)=>a+e.amount,0);
    const stock=products.filter(p=>p.status!=='sold');
    return {sold,cogs,exp,profit:sold-cogs-exp,stockValue:stock.reduce((a,p)=>a+p.cost,0),stockCount:stock.length,soldCount:sales.reduce((a,s)=>a+s.items.length,0)};
  },[products,sales,expenses]);

  const saveProduct=async(data)=>{
    try{
      await dbPut('products',{...data,id:data.id||uid(),createdAt:data.createdAt||Date.now()});
      await reload();setModal(null);setToast(data.id?'Produk diperbarui':'Produk berhasil ditambahkan');
    }catch(err){console.error(err);setToast('Gagal menyimpan produk. Coba lagi.')}
  };
  const removeProduct=async(id)=>{if(!confirm('Hapus produk ini?'))return;try{await dbDelete('products',id);await reload();setToast('Produk dihapus')}catch(err){console.error(err);setToast('Gagal menghapus produk.')}};
  const saveExpense=async(data)=>{try{await dbPut('expenses',{...data,id:data.id||uid(),date:data.date||Date.now()});await reload();setModal(null);setToast('Pengeluaran tersimpan')}catch(err){console.error(err);setToast('Gagal menyimpan pengeluaran.')}};
  const sell=async(items,payment,paid,receipt)=>{
    try{
      const now=Date.now(), total=items.reduce((a,i)=>a+i.price,0), costTotal=items.reduce((a,i)=>a+i.cost,0);
      const sale={id:uid(),date:now,items,total,costTotal,payment,paid:Number(paid)||0,change:Math.max(0,(Number(paid)||0)-total),receipt};
      await dbPut('sales',sale);
      for(const i of items){const p=products.find(x=>x.id===i.id);if(p) await dbPut('products',{...p,status:'sold',soldAt:now,saleId:sale.id});}
      await reload();setModal(null);setToast(`Penjualan ${money(total)} berhasil`);
    }catch(err){console.error(err);setToast('Gagal menyimpan penjualan. Coba lagi.')}
  };
  const doStocktake=async(entries)=>{
    try{
      await dbPut('stocktakes',{id:uid(),date:Date.now(),entries});
      for(const e of entries){const p=products.find(x=>x.id===e.id);if(p && e.status==='sold' && p.status!=='sold') await dbPut('products',{...p,status:'sold'}); if(p && e.status==='available' && p.status==='sold') await dbPut('products',{...p,status:'available'});}
      await reload();setModal(null);setToast('Stock opname tersimpan');
    }catch(err){console.error(err);setToast('Gagal menyimpan stock opname.')}
  };

  const nav=[
    ['dashboard','Dashboard','grid'],['products','Produk','shirt'],['sales','Penjualan','cart'],['finance','Keuangan','wallet'],['stocktake','Stock Opname','box','Opname']
  ];
  if(loading) return <div className="min-h-screen bg-slate-950 text-white flex items-center justify-center p-6"><div className="text-center"><div className="mx-auto mb-4 w-12 h-12 rounded-2xl bg-white/10 flex items-center justify-center"><Icon name="shirt" size={25}/></div><div className="font-black text-xl">R-Preloved</div><div className="text-sm text-slate-400 mt-1">Menyiapkan aplikasi…</div></div></div>;

  return <div className="min-h-screen">
    <aside className="hidden md:flex fixed left-0 top-0 bottom-0 desktop-sidebar bg-slate-950 text-white flex-col p-4 z-30">
      <div className="px-3 py-4 mb-4"><div className="font-black text-xl">R-Preloved</div><div className="text-xs text-slate-400 mt-1">Inventory • Sales • Finance</div></div>
      <nav className="space-y-1">
        {nav.map(([id,label,icon])=><button key={id} onClick={()=>setTab(id)} className={`w-full flex items-center gap-3 px-3 py-3 rounded-xl text-sm font-semibold ${tab===id?'bg-white text-slate-900':'text-slate-300 hover:bg-white/10'}`}><Icon name={icon}/>{label}</button>)}
      </nav>
      <div className="mt-auto"><button onClick={()=>setModal({type:'settings'})} className="w-full flex items-center gap-3 px-3 py-3 rounded-xl text-sm text-slate-300 hover:bg-white/10"><Icon name="settings"/>Pengaturan</button></div>
    </aside>

    <main className="desktop-content min-h-screen pb-24 md:pb-8">
      <header className="sticky top-0 z-20 bg-white/90 backdrop-blur border-b border-slate-100">
        <div className="max-w-7xl mx-auto px-4 md:px-7 h-16 flex items-center justify-between">
          <div><div className="md:hidden font-black">R-Preloved</div><div className="hidden md:block text-sm text-slate-500">{nav.find(x=>x[0]===tab)?.[1]}</div></div>
          <div className="flex items-center gap-2">
            <Button variant="soft" className="px-3" aria-label="Scan SKU" onClick={()=>{unlockAudio();setModal({type:'scanner'})}}><Icon name="scan" size={18}/><span className="hidden sm:inline">Scan SKU</span></Button>
            <Button className="px-3" aria-label="Tambah Produk" onClick={()=>setModal({type:'product'})}><Icon name="plus" size={18}/><span className="hidden sm:inline">Produk</span></Button>
          </div>
        </div>
      </header>
      <div className="max-w-7xl mx-auto px-4 md:px-7 py-5">
        {tab==='dashboard' && <Dashboard stats={stats} products={products} sales={sales} onSell={()=>setModal({type:'sale'})} onScan={()=>{unlockAudio();setModal({type:'scanner'})}} onAddProduct={()=>setModal({type:'product'})} onReport={()=>setTab('finance')} />}
        {tab==='products' && <Products products={products} search={search} setSearch={setSearch} onAdd={()=>setModal({type:'product'})} onEdit={p=>setModal({type:'product',data:p})} onDelete={removeProduct} onSell={p=>setModal({type:'sale',data:p})} />}
        {tab==='sales' && <Sales sales={sales} onSell={()=>setModal({type:'sale'})} />}
        {tab==='finance' && <Finance stats={stats} expenses={expenses} onExpense={()=>setModal({type:'expense'})} />}

function ScannerModal({products,onClose,onFound}){
  const videoRef=useRef(null), streamRef=useRef(null), timerRef=useRef(null);
  const [status,setStatus]=useState('Menyiapkan kamera…');
  const [manual,setManual]=useState('');
  const [cart,setCart]=useState([]);
  const activeRef=useRef(true), cooldownRef=useRef(false);
  const cartRef=useRef(cart); cartRef.current=cart;

  const find=(code)=>{
    if(cooldownRef.current) return;
    const clean=String(code).trim();
    if(!clean) return;
    const p=products.find(x=>String(x.sku).toLowerCase()===clean.toLowerCase());
    if(!p){ beep('error'); setStatus(`SKU "${clean}" tidak ditemukan.`); return; }
    if(p.status==='sold'){ beep('error'); setStatus(`"${p.name}" sudah terjual sebelumnya.`); return; }
    if(cartRef.current.some(x=>x.id===p.id)){ beep('error'); setStatus(`"${p.name}" sudah ada di keranjang.`); return; }
    beep('success');
    setCart(x=>[...x,p]);
    setStatus(`✓ Ditambahkan: ${p.name}`);
    setManual('');
    // jeda sebentar biar barcode yang sama tidak ke-scan dobel oleh frame berikutnya
    cooldownRef.current=true;
    setTimeout(()=>{ cooldownRef.current=false; if(activeRef.current) setStatus('Arahkan barcode berikutnya ke kotak pemindai.'); },900);
  };
  const removeFromCart=id=>setCart(x=>x.filter(p=>p.id!==id));
  const cleanup=()=>{activeRef.current=false;if(timerRef.current)cancelAnimationFrame(timerRef.current);streamRef.current?.getTracks().forEach(t=>t.stop())};
  useEffect(()=>{
    activeRef.current=true;
    (async()=>{
      try{
        if(!navigator.mediaDevices?.getUserMedia) throw new Error('Kamera tidak didukung browser');
        const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
        if(!activeRef.current)return;s.getTracks().forEach(t=>t.enabled=true);streamRef.current=s;videoRef.current.srcObject=s;await videoRef.current.play();
        if('BarcodeDetector' in window){
          const formats=await BarcodeDetector.getSupportedFormats();
          const detector=new BarcodeDetector({formats:formats.filter(f=>['code_128','code_39','ean_13','ean_8','upc_a','upc_e','qr_code'].includes(f))});
          const scan=async()=>{if(!activeRef.current)return;try{const codes=await detector.detect(videoRef.current);if(codes.length){find(codes[0].rawValue)}}catch(e){}timerRef.current=requestAnimationFrame(scan)};
          timerRef.current=requestAnimationFrame(scan);setStatus('Arahkan barcode ke kotak pemindai.');
        }else setStatus('BarcodeDetector belum tersedia. Masukkan SKU manual.');
      }catch(e){setStatus('Kamera tidak dapat diakses. Cek izin kamera atau gunakan SKU manual.')}
    })();
    return cleanup;
  },[]);
  const total=cart.reduce((a,p)=>a+p.price,0);
  const finish=()=>{ if(!cart.length) return; cleanup(); onFound(cart); };
  return <Modal title="Scan Barcode" onClose={()=>{cleanup();onClose()}}>
    <div className="space-y-4">
      <div className="relative rounded-2xl overflow-hidden bg-slate-950 aspect-video flex items-center justify-center"><video ref={videoRef} playsInline muted className="w-full h-full object-cover"/><div className="absolute inset-1/4 scan-box rounded-2xl pointer-events-none"></div><div className="absolute bottom-3 left-0 right-0 text-center text-xs font-semibold text-white drop-shadow px-3">{status}</div></div>
      <div className="flex gap-2"><input autoFocus value={manual} onChange={e=>setManual(e.target.value)} onKeyDown={e=>e.key==='Enter'&&find(manual)} placeholder="Ketik / scan SKU (auto Enter)…" className="flex-1 min-w-0 h-11 px-3 rounded-xl border border-slate-200 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"/><Button onClick={()=>find(manual)} className="shrink-0">Tambah</Button></div>
      <div className="flex items-center justify-between"><div className="text-xs font-bold text-slate-500">Keranjang scan ({cart.length})</div>{cart.length>0 && <div className="text-sm font-black">{money(total)}</div>}</div>
      <div className="border border-slate-100 rounded-2xl overflow-hidden max-h-48 overflow-y-auto">
        {cart.map(p=><div key={p.id} className="flex items-center gap-3 p-3 border-b last:border-0"><div className="w-9 h-9 rounded-lg bg-slate-100 flex items-center justify-center shrink-0">{p.image?<img src={p.image} className="w-9 h-9 rounded-lg object-cover"/>:<Icon name="shirt" size={16}/>}</div><div className="flex-1 min-w-0"><b className="text-sm block truncate">{p.name}</b><div className="text-xs text-slate-400 truncate">{p.sku}</div></div><b className="shrink-0 text-sm">{money(p.price)}</b><button type="button" onClick={()=>removeFromCart(p.id)} aria-label="Hapus dari keranjang" className="p-1.5 text-red-500 shrink-0 active:scale-95 transition"><Icon name="x" size={16}/></button></div>)}
        {!cart.length&&<div className="p-4 text-xs text-slate-400 text-center">Scan barcode tiap barang satu per satu, kamera tidak akan tertutup. Ketika sudah selesai, klik "Lanjut ke Pembayaran".</div>}
      </div>
      <Button disabled={!cart.length} onClick={finish} className="w-full" variant="green"><Icon name="cart" size={18}/><span>Lanjut ke Pembayaran{cart.length?` (${cart.length} barang)`:''}</span></Button>
    </div>
  </Modal>
}

function Sales({sales,onSell}){
  const [q,setQ]=useState('');
  const list=sales.filter(s=>s.items.some(i=>(i.name+' '+i.sku).toLowerCase().includes(q.toLowerCase())));
  return <div className="space-y-4"><div className="flex justify-between items-center"><div><h1 className="text-2xl font-black">Penjualan</h1><p className="text-sm text-slate-500">Riwayat transaksi offline.</p></div><Button onClick={onSell}><Icon name="plus" size={18}/><span>Penjualan</span></Button></div><input value={q} onChange={e=>setQ(e.target.value)} placeholder="Cari transaksi / SKU…" className="w-full h-11 px-4 rounded-xl border border-slate-200 bg-white"/><div className="space-y-3">{list.slice().sort((a,b)=>b.date-a.date).map(s=><div key={s.id} className="bg-white rounded-2xl border border-slate-100 p-4 shadow-soft"><div className="flex justify-between gap-3"><div><b>{s.items.map(i=>i.name).join(', ')}</b><div className="text-xs text-slate-400 mt-1">{dateText(s.date)} • {s.items.length} item • <span className="font-bold">{s.payment}</span></div></div><b className="text-lg">{money(s.total)}</b></div><div className="mt-3 pt-3 border-t text-xs text-slate-500 flex justify-between"><span>Modal {money(s.costTotal)}</span><span className="font-bold text-emerald-600">Margin {money(s.total-s.costTotal)}</span></div></div>)}{!list.length&&<Empty text="Belum ada penjualan."/>}</div></div>
}

function Finance({stats,expenses,onExpense}){
  return <div className="space-y-5"><div className="flex justify-between items-center"><div><h1 className="text-2xl font-black">Keuangan</h1><p className="text-sm text-slate-500">Pemasukan, modal, pengeluaran & laba.</p></div><Button onClick={onExpense}><Icon name="plus" size={18}/><span>Pengeluaran</span></Button></div>
    <div className="grid grid-cols-2 lg:grid-cols-4 gap-3"><Kpi title="Pemasukan" value={stats.sold}/><Kpi title="Modal barang terjual" value={-stats.cogs}/><Kpi title="Pengeluaran" value={-stats.exp}/><Kpi title="Laba bersih" value={stats.profit}/></div>
    <div className="bg-white rounded-3xl border border-slate-100 shadow-soft p-5"><h2 className="font-extrabold mb-4">Pengeluaran</h2>{expenses.slice().sort((a,b)=>b.date-a.date).map(e=><div key={e.id} className="flex justify-between py-3 border-b last:border-0"><div><b className="text-sm">{e.name}</b><div className="text-xs text-slate-400">{e.category} • {dateText(e.date)}</div></div><b>{money(e.amount)}</b></div>)}{!expenses.length&&<Empty text="Belum ada pengeluaran."/>}</div>
    <div className="bg-indigo-50 rounded-3xl p-5"><div className="font-extrabold">Rumus laporan</div><div className="text-sm text-slate-600 mt-2">Laba kotor = Penjualan − Modal barang terjual. Laba bersih = Laba kotor − Pengeluaran operasional.</div></div>
  </div>
}
function Kpi({title,value}){return <div className="bg-white rounded-2xl border border-slate-100 p-4 shadow-soft min-w-0"><div className="text-xs text-slate-500 font-bold truncate">{title}</div><div className={`text-xl font-black mt-2 truncate ${value<0?'text-red-600':'text-slate-900'}`}>{money(Math.abs(value))}</div></div>}

function ExpenseModal({onClose,onSave}){const [f,setF]=useState({name:'',category:'Operasional',amount:''});const s=(k,v)=>setF(x=>({...x,[k]:v}));return <Modal title="Tambah Pengeluaran" onClose={onClose}><form onSubmit={e=>{e.preventDefault();onSave({...f,amount:Number(f.amount)||0})}} className="space-y-4"><Field label="Nama pengeluaran" value={f.name} onChange={e=>s('name',e.target.value)} required/><label className="block"><span className="block text-xs font-bold text-slate-500 mb-1.5">Kategori</span><select value={f.category} onChange={e=>s('category',e.target.value)} className="w-full h-11 px-3 rounded-xl border border-slate-200"><option>Operasional</option><option>Packaging</option><option>Transport</option><option>Marketing</option><option>Lainnya</option></select></label><NumberField label="Nominal" prefix="Rp" value={f.amount} onChange={v=>s('amount',v)} required/><Button className="w-full">Simpan Pengeluaran</Button></form></Modal>}

function Stocktake({products,stocktakes,onRun}){const active=products.filter(p=>p.status!=='sold');return <div className="space-y-5"><div className="flex justify-between items-center"><div><h1 className="text-2xl font-black">Stock Opname</h1><p className="text-sm text-slate-500">Cocokkan stok fisik dengan database.</p></div><Button onClick={onRun}><Icon name="box" size={18}/><span>Mulai Opname</span></Button></div><div className="grid grid-cols-2 gap-3"><Kpi title="Stok aktif" value={active.length}/><Kpi title="Riwayat opname" value={stocktakes.length}/></div><div className="bg-white rounded-3xl border border-slate-100 shadow-soft p-5"><h2 className="font-extrabold mb-3">Riwayat</h2>{stocktakes.slice().sort((a,b)=>b.date-a.date).map(s=><div key={s.id} className="flex justify-between py-3 border-b last:border-0"><span className="text-sm">{dateText(s.date)}</span><span className="text-sm font-bold">{s.entries.length} item diperiksa</span></div>)}{!stocktakes.length&&<Empty text="Belum ada stock opname."/>}</div></div>}

function StocktakeModal({products,onClose,onSave}){const [rows,setRows]=useState(products.map(p=>({id:p.id,status:p.status==='sold'?'sold':'available'})));const set=(id,v)=>setRows(r=>r.map(x=>x.id===id?{...x,status:v}:x));return <Modal title="Stock Opname" onClose={onClose} wide><div className="space-y-3 max-h-[55vh] overflow-auto">{rows.map(r=>{const p=products.find(x=>x.id===r.id);return <div key={r.id} className="flex items-center gap-3 p-3 rounded-xl bg-slate-50"><div className="flex-1"><b className="text-sm">{p.name}</b><div className="text-xs text-slate-400">{p.sku}</div></div><select value={r.status} onChange={e=>set(r.id,e.target.value)} className="h-10 rounded-lg border border-slate-200 px-2 bg-white text-sm"><option value="available">Ada</option><option value="sold">Terjual</option></select></div>})}</div><Button className="w-full mt-4" onClick={()=>onSave(rows)}>Simpan Stock Opname</Button></Modal>}

function SettingsModal({settings,onClose,onSave}){const [name,setName]=useState(settings.storeName||'R-Preloved');return <Modal title="Pengaturan" onClose={onClose}><div className="space-y-4"><Field label="Nama toko" value={name} onChange={e=>setName(e.target.value)}/><div className="rounded-2xl bg-slate-50 p-4 text-sm"><b>Penyimpanan:</b> IndexedDB browser ini. Data tetap lokal di perangkat/browser dan tidak otomatis tersinkron ke cloud.</div><Button className="w-full" onClick={()=>onSave({...settings,storeName:name})}>Simpan</Button></div></Modal>}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
